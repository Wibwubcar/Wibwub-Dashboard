    return wrap(
      v2card('money','ค่าแอด',baht(T.spend),delta(T.spend,Pv&&Pv.spend,1)+tail,ser('spend'))+
      v2card('res','ทักแชท',int(T.msg),delta(T.msg,Pv&&Pv.msg)+tail,ser('msg'))+
      v2card('cost','ต้นทุนต่อแชท',T.msg?baht2(T.spend/T.msg):'–',
        delta(div(T.spend,T.msg),Pv&&div(Pv.spend,Pv.msg),1)+tail,
        ds.map(d=>{const r=FB.days[d];return r[gi('msg')]?r[gi('spend')]/r[gi('msg')]:0;}))+
      v2card('roas','ROAS (CPAS + บนเพจ)',rev?x2(div(rev,T.spend)):muted('ไม่มีในไฟล์'),
        rev?(delta(div(rev,T.spend),Pv&&div(prev,Pv.spend))+tail):'ต้อง export ใหม่ให้มีคอลัมน์มูลค่าการซื้อ',null));
  }
  const o=R[ch], p=PR&&PR[ch], K={sh:['shS','shR'],tk:['tkS','tkR'],lz:['lzS','lzR']}[ch];
  const ser=i=>R.days.map(d=>dayV(d)[K[i]]||0);
  return wrap(
    v2card('money','ค่าแอด',baht(o.spend),delta(o.spend,p&&p.spend,1)+tail,ser(0))+
    v2card('res','ยอดขายจริง',baht(o.real),delta(o.real,p&&p.real)+tail,ser(1))+
    v2card('roas','ROAS จากยอดจริง',x2(div(o.real,o.spend)),
      delta(div(o.real,o.spend),p&&div(p.real,p.spend))+tail,null)+
    v2card('cost','ค่าแอด ÷ ยอดขาย',pct(div(o.spend,o.real)),
      deltaPt(div(o.spend,o.real),p&&div(p.spend,p.real))+tail,null));
}

/* ---------- บล็อก 2.1: กราฟแนวโน้ม (เส้นผลลัพธ์ + พื้นที่ค่าแอด) ---------- */
function v2Trend(ch){
  let days,res,sp,resLab,costOf,costFmt,costLab;
  if(ch==='fb'){
    if(!fbOn()) return '';
    days=fbDays(st.from,st.to); const gi=k=>FB.keys.indexOf(k);
    res=days.map(d=>FB.days[d][gi('msg')]||0); sp=days.map(d=>FB.days[d][gi('spend')]||0);
    resLab='ทักแชท'; costLab='ต้นทุนต่อแชท'; costOf=i=>res[i]?sp[i]/res[i]:NaN; costFmt=v=>baht2(v);
  }else{
    const K={sh:['shS','shR'],tk:['tkS','tkR'],lz:['lzS','lzR']}[ch];
    days=R.days; sp=days.map(d=>dayV(d)[K[0]]||0); res=days.map(d=>dayV(d)[K[1]]||0);
    resLab='ยอดขายจริง'; costLab='ค่าแอด ÷ ยอดขาย'; costOf=i=>res[i]?sp[i]/res[i]:NaN;
    costFmt=v=>pct(v);
  }
  if(days.length<2) return `<div class="card"><h2>แนวโน้มผลลัพธ์</h2><div class="note">ช่วงที่เลือกสั้นเกินกว่าจะวาดแนวโน้ม</div></div>`;
  const W=600,H=360,pl=46,pr=50,pt=14,pb=30,n=days.length,step=(W-pl-pr)/(n-1);
  const rmax=Math.max(1,...res), smax=Math.max(1,...sp);
  const X=i=>pl+i*step, Yr=v=>pt+(1-v/rmax)*(H-pt-pb), Ys=v=>pt+(1-v/smax)*(H-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*i/4;
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--bd)"/>`+
       `<text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${yTick(Math.round(rmax*(1-i/4)))}</text>`+
       `<text x="${W-pr+6}" y="${y+4}" font-size="12" fill="var(--muted)">฿${yTick(Math.round(smax*(1-i/4)))}</text>`;}
  const area=`<polygon points="${pl},${H-pb} ${sp.map((v,i)=>X(i)+','+Ys(v)).join(' ')} ${X(n-1)},${H-pb}" fill="var(--acc)" fill-opacity=".18"/>`;
  const line=`<polyline points="${res.map((v,i)=>X(i)+','+Yr(v)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round"/>`;
  const costs=days.map((d,i)=>costOf(i)).filter(Number.isFinite);
  const avg=costs.length?sp.reduce((a,b)=>a+b,0)/res.reduce((a,b)=>a+b,0):NaN;
  let dots='',lab='',bad=[];
  days.forEach((d,i)=>{const c=costOf(i), isBad=Number.isFinite(c)&&Number.isFinite(avg)&&c>=avg*1.1;
    if(isBad) bad.push([d,c]);
    dots+=`<circle cx="${X(i)}" cy="${Yr(res[i])}" r="${isBad?6:3.5}" fill="${isBad?'var(--card)':'var(--acc)'}" `+
      `stroke="${isBad?'var(--neg)':'var(--acc)'}" stroke-width="2"><title>${thD(d)} ${resLab} ${int(res[i])} · ค่าแอด ${baht(sp[i])} · ${costLab} ${costFmt(c)}</title></circle>`;
    if(n<=14||i%Math.ceil(n/10)===0)
      lab+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="12" fill="var(--muted)">${thD(d)}</text>`;});
  const note=bad.length
    ?`วันที่${costLab}สูงกว่าค่าเฉลี่ยของช่วง: `+bad.slice(0,4).map(b=>`${thD(b[0])} (${costFmt(b[1])})`).join(' · ')+(bad.length>4?` และอีก ${bad.length-4} วัน`:'')
    :`ไม่มีวันที่${costLab}สูงผิดปกติในช่วงนี้`;
  return `<div class="card"><div class="ch"><h2>แนวโน้มผลลัพธ์</h2></div>`+
    `<div class="legend"><span><i style="background:var(--acc)"></i>${resLab}</span>`+
    `<span><i style="background:var(--acc);opacity:.3"></i>ค่าแอด</span>`+
    `<span><i style="background:var(--neg);border-radius:50%"></i>${costLab}สูงผิดปกติ</span></div>`+
    `<div class="trendsvg"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟ${resLab}และค่าแอดรายวัน">${g}${area}${line}${dots}${lab}</svg></div>`+
    `<div class="note">${esc(note)} · เส้น = ${resLab} (แกนซ้าย) · พื้นที่ = ค่าแอด (แกนขวา)</div></div>`;
}

/* ---------- บล็อก 2.2: Funnel ทรงกรวย (เฉพาะขั้นที่ช่องทางนั้นมีข้อมูลจริง) ---------- */
const FSTEP=[['imp','เห็นแอด'],['clicks','คลิก'],['msg','ทักแชท'],['view','ดูสินค้า'],
             ['atc','ใส่ตะกร้า'],['checkout','เริ่มชำระเงิน'],['orders','ซื้อ']];
/* ขั้นของ Funnel ที่ช่องทางนั้น "ใช้จริง" — ผู้ใช้กำหนดของ Facebook ไว้ 4 ขั้น
   คอลัมน์ "ยอดดูเนื้อหา" ของ FB ว่างเกือบหมด (แคมเปญเป็นแบบข้อความ ไม่มี pixel)
   ถ้าเอามาใส่ด้วยจะได้ขั้นที่เล็กกว่าขั้นถัดไป แล้วอ่านเป็น "ซื้อ 299.8%" ซึ่งไม่สื่ออะไร */
const FONLY={fb:['imp','clicks','msg','orders']};
function fSteps(ch,caps,t){
  const only=FONLY[ch];
  return FSTEP.filter(([k])=>(only?only.includes(k):caps.includes(k))&&t[k]!=null);
}
/* ไฟล์แอดละเอียดอาจครอบคลุมแคบกว่าช่วงที่เลือก (เช่น Lazada ติด CAPTCHA ได้วันเดียว)
   ถ้าไม่บอก ผู้ใช้จะเทียบ Funnel กับการ์ดด้านบนแล้วคิดว่าตัวเลขพัง */
function v2Cover(M){
  const r=M.D2.range||{};
  if(!r.from||!r.to) return '';
  if(r.from<=st.from&&r.to>=st.to) return '';
  return ` · ไฟล์แอดละเอียดมีข้อมูลแค่ ${thD(r.from,1)} – ${thD(r.to,1)} ซึ่งแคบกว่าช่วงที่เลือก `+
    `ตัวเลขในบล็อกนี้จึงเป็นของช่วงนั้น ไม่ใช่ทั้ง ${NN} วัน`;
}
function v2Funnel(M){
  const caps=M.D2.caps.funnel||[], t=M.tot;
  const st2=fSteps(M.ch,caps,t);
  if(st2.length<2) return `<div class="card"><h2>เส้นทางลูกค้า</h2><div class="note">ช่องทางนี้มีข้อมูลไม่พอวาดเส้นทางลูกค้า</div></div>`;
  /* wmin ต้องกว้างพอให้ตัวเลขของขั้นสุดท้ายอยู่ในรูปทรง — เคยตั้ง 90 แล้วเลขล้นออกนอกกรวย */
  const W=300,rowH=50,gap=6,H=st2.length*(rowH+gap)-gap,wmax=W-20,wmin=122;
  const ws=st2.map((s,i)=>st2.length<2?wmax:wmax-(wmax-wmin)*i/(st2.length-1));
  let s='';
  st2.forEach(([k,lab],i)=>{const y=i*(rowH+gap),w1=ws[i],w2=i<st2.length-1?ws[i+1]:ws[i]-22,cx=W/2;
    const op=(1-i*0.14).toFixed(2), v=t[k]||0, prev=i?(t[st2[i-1][0]]||0):null;
    s+=`<polygon points="${cx-w1/2},${y} ${cx+w1/2},${y} ${cx+w2/2},${y+rowH} ${cx-w2/2},${y+rowH}" fill="var(--acc)" fill-opacity="${op}"/>`;
    const fg=op>0.55?'var(--acc-ink)':'var(--ink)';
    s+=`<text x="${cx}" y="${y+20}" text-anchor="middle" font-size="12" fill="${fg}">${lab}</text>`+
       `<text x="${cx}" y="${y+39}" text-anchor="middle" font-size="15" font-weight="700" fill="${fg}">${int(v)}`+
       (prev?`<tspan font-size="11" font-weight="500"> (${pct(v/prev,1)})</tspan>`:'')+`</text>`;});
  const over=st2.some(([k],i)=>i&&(t[k]||0)>(t[st2[i-1][0]]||0));
  return `<div class="card"><div class="ch"><h2>เส้นทางลูกค้า (Funnel)</h2></div>`+
    `<div class="fnlbig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นทางลูกค้า">${s}</svg></div>`+
    `<div class="note">% ในวงเล็บ = เทียบกับขั้นก่อนหน้า`+
    (over?' · บางขั้นมากกว่าขั้นก่อนได้จริง เพราะแพลตฟอร์มนับคนละทาง (เช่นกดดูสินค้าจากในคลิปโดยไม่ผ่านคลิกปลายทาง)':'')+
    (M.D2.caps.funnel.length<7?` · ช่องทางนี้วัดได้ถึงขั้น "${st2[st2.length-1][1]}" เท่านั้น`:'')+
    v2Cover(M)+'</div></div>';
}

/* ---------- บล็อก 2.3: สรุป + ข้อเสนอแนะ 3 ข้อ ---------- */
function v2Sum(ch,M){
  const L=M.leaves, by=t=>L.filter(a=>a.b.t===t).sort((x,y)=>(y.t.spend||0)-(x.t.spend||0));
  const stop=by('stop'),up=by('up'),fix=by('fix'),cre=by('cre');
  const tx=[];
  if(ch==='fb'&&fbOn()){
    const T=fbTot(st.from,st.to), pds=PR?fbDays(PA,PB):[], Pv=pds.length?fbSum(FB.days,pds,FB.keys):null;
    const c=div(T.spend,T.msg), pc=Pv?div(Pv.spend,Pv.msg):NaN;
    tx.push(`${NN} วันนี้ใช้ค่าแอด ${baht(T.spend)} ได้แชท ${int(T.msg)} ครั้ง ต้นทุนต่อแชท ${baht2(c)}`);
    if(Number.isFinite(pc)&&pc) tx.push(`${c>pc?'แพงขึ้น':'ถูกลง'} ${(Math.abs(c/pc-1)*100).toFixed(1)}% เทียบช่วงก่อนหน้า`);
  }else{
    const o=R[ch], p=PR&&PR[ch], rt=div(o.spend,o.real);
    tx.push(`${NN} วันนี้ใช้ค่าแอด ${baht(o.spend)} กับยอดขายจริง ${baht(o.real)} คิดเป็น ${pct(rt)} ของยอดขาย (ROAS ${x2(div(o.real,o.spend))})`);
    if(p&&p.real&&p.spend){const prt=div(p.spend,p.real),dd=(rt-prt)*100;
      tx.push(Math.abs(dd)<0.05?'สัดส่วนค่าแอดเท่าเดิมกับช่วงก่อนหน้า'
        :`สัดส่วนค่าแอด${dd>0?'สูงขึ้น':'ลดลง'} ${Math.abs(dd).toFixed(1)} จุด เทียบช่วงก่อนหน้า`);}
  }
  const n=o=>o.length;
  if(n(stop)||n(fix)||n(cre))
    tx.push(`ในช่วงนี้มีรายการที่ควรดู ${n(stop)+n(fix)+n(cre)} รายการ (หยุด ${n(stop)} · ปรับ ${n(fix)} · เปลี่ยนชิ้นงาน ${n(cre)})`);
  const next=[];
  if(n(stop)) next.push(`พิจารณาหยุด ${n(stop)} รายการในกลุ่ม "หยุด" ใช้เงินรวม ${baht(stop.reduce((a,x)=>a+(x.t.spend||0),0))} เริ่มจาก ${stop[0].name}`);
  if(n(up))   next.push(`เพิ่มงบให้ ${up[0].name} — ${up[0].b.why}`);
  if(n(fix))  next.push(`ปรับ ${fix[0].name} — ${fix[0].b.why}`);
  if(n(cre))  next.push(`เปลี่ยนชิ้นงานของ ${cre[0].name} — ${cre[0].b.why}`);
  if(!next.length) next.push('ยังไม่มีรายการที่เข้าเกณฑ์ต้องจัดการในช่วงนี้');
  return `<div class="card sumbox"><div class="ch"><h2>สรุป ${NN} วันนี้</h2></div>`+
    `<p class="sumtext">${esc(tx.join(' · '))}</p>`+
    `<h3 style="font-size:13.5px;margin-bottom:6px">ข้อเสนอแนะถัดไป</h3>`+
    `<ol class="next">${next.slice(0,3).map(t=>`<li><span>${esc(t)}</span></li>`).join('')}</ol>`+
    `<div class="note adv">เป็นคำแนะนำจากตัวเลข ทีมการตลาดเป็นผู้ตัดสินใจ</div></div>`;
}

/* ---------- บล็อก 3: บอร์ด 4 ป้าย ---------- */
const BCOL=[['up','เพิ่มงบ','ผลดีกว่าค่าเฉลี่ยกลุ่มชัดเจน'],['fix','ปรับ','มีจุดต้องแก้ แต่ยังไปต่อได้'],
            ['cre','เปลี่ยนชิ้นงาน','CTR ตกแรงในช่วงหลัง'],['stop','หยุด','เปลืองเงิน ได้ผลน้อย']];
function v2Board(M){
  const body=BCOL.map(([k,n,w])=>{
    const L=M.leaves.filter(a=>a.b.t===k).sort((x,y)=>(y.t.spend||0)-(x.t.spend||0));
    const s=L.reduce((a,x)=>a+(x.t.spend||0),0);
    return `<div class="bcol ${k}"><h3><span>${n} · ${L.length}</span><span class="num">${baht(s)}</span></h3>`+
      `<div class="why3">${w}</div>`+
      (L.slice(0,4).map(a=>`<button class="bitem" data-ad="${a.i}"><b>${esc(a.name)}</b>`+
        `<span>${esc(a.camp.name)} · ${esc(a.b.why)}</span></button>`).join('')||'<div class="why3">ไม่มีในช่วงนี้</div>')+
      (L.length>4?`<div class="why3">และอีก ${L.length-4} รายการ (ดูในตารางด้านล่าง)</div>`:'')+'</div>';}).join('');
  return `<div class="card"><div class="ch"><h2>ต้องทำอะไรต่อ</h2>`+
    `<span class="note sp" style="margin:0">กดชื่อเพื่อเลื่อนไปดูรายละเอียดด้านล่าง</span></div>`+
    `<div class="board">${body}</div>`+
    `<div class="note adv">เป็นคำแนะนำจากตัวเลข ทีมการตลาดเป็นผู้ตัดสินใจ</div></div>`;
}

/* ---------- บล็อก 4: กลุ่มผู้ชม (ตารางความร้อน) + ตำแหน่ง (แท่ง) ---------- */
const GLAB={female:'หญิง',male:'ชาย',unknown:'ไม่ระบุ'};
function ageKey(a){const m=String(a).match(/\d+/);return /unknown/i.test(a)?9999:(m?+m[0]:9998);}
function v2Aud(M){
  const arr=(M.D2.audience||[]).filter(r=>r.d>=st.from&&r.d<=st.to);
  if(!arr.length) return `<div class="card"><h2>กลุ่มผู้ชม อายุ × เพศ</h2>`+
    `<div class="note">ช่องทางนี้ไม่มีข้อมูลกลุ่มผู้ชมในรายงาน</div></div>`;
  const ages=[...new Set(arr.map(r=>r.age||'–'))].sort((a,b)=>ageKey(a)-ageKey(b));
  const gens=[...new Set(arr.map(r=>r.gender||'–'))]
    .sort((a,b)=>(/unknown/i.test(a)?1:0)-(/unknown/i.test(b)?1:0));
  const cell=(a,g)=>{const t=dBlank();arr.forEach(r=>{if((r.age||'–')===a&&(r.gender||'–')===g)dAdd(t,r);});return t;};
  const grid=ages.map(a=>gens.map(g=>cell(a,g)));
  const met=V2.metric;
  /* ช่องที่ข้อมูลน้อยเกินไปไม่คำนวณอัตราส่วน — เลขจาก 30 อิมเพรสชันเชื่อไม่ได้ */
  const val=t=>met==='spend'?(t.spend||0):met==='ctr'?(t.imp>=300?dCtr(t):null)
    :(t.revenue!=null&&t.spend?dRoas(t):null);
  const vs=[];grid.forEach(r=>r.forEach(t=>{const v=val(t);if(v!=null&&Number.isFinite(v))vs.push(v);}));
  const mx=vs.length?Math.max(...vs):1,mn=vs.length?Math.min(...vs):0;
  let h='<div class="hd"></div>'+gens.map(g=>`<div class="hd">${esc(GLAB[String(g).toLowerCase()]||g)}</div>`).join('');
  ages.forEach((a,i)=>{h+=`<div class="hd" style="text-align:left">${esc(a)}</div>`;
    gens.forEach((g,j)=>{const t=grid[i][j],v=val(t);
      const k=(v==null||!Number.isFinite(v))?null:(v-mn)/((mx-mn)||1);
      const bg=k==null?'var(--low-bg)':`color-mix(in srgb, var(--acc) ${Math.round(8+k*72)}%, var(--card))`;
      const fg=k!=null&&k>0.55?'var(--acc-ink)':(k==null?'var(--muted)':'var(--ink)');
      const txt=k==null?'–':met==='spend'?baht(v):met==='ctr'?pct2(v):x2(v);
      h+=`<div style="background:${bg};color:${fg}" title="${esc(a)} ${esc(GLAB[String(g).toLowerCase()]||g)} · ค่าแอด ${baht(t.spend)} · เห็น ${int(t.imp)} · CTR ${pct2(dCtr(t))}">${txt}</div>`;});});
  const flat=[];ages.forEach((a,i)=>gens.forEach((g,j)=>{const t=grid[i][j];
    if((t.imp||0)>=1000) flat.push([esc(a)+' '+(GLAB[String(g).toLowerCase()]||g),dCtr(t),t.spend||0]);}));
  flat.sort((x,y)=>y[1]-x[1]);
  const hasRoas=arr.some(r=>r.revenue!=null);
  return `<div class="card"><div class="ch"><h2>กลุ่มผู้ชม อายุ × เพศ</h2>`+
    `<div class="seg sm sp" id="segAud" role="group" aria-label="ตัวชี้วัด">`+
    `<button data-m="spend"${met==='spend'?' class="on"':''}>ค่าแอด</button>`+
    `<button data-m="ctr"${met==='ctr'?' class="on"':''}>CTR</button>`+
    (hasRoas?`<button data-m="roas"${met==='roas'?' class="on"':''}>ROAS</button>`:'')+`</div></div>`+
    `<div class="heat">${h}</div>`+
    `<div class="note">สีเข้ม = ค่ามาก${met==='ctr'?' · ช่องที่เห็นน้อยกว่า 300 ครั้งไม่คำนวณ CTR':''}`+
    (flat.length?` · CTR สูงสุด (เฉพาะช่องที่เห็นเกิน 1,000 ครั้ง): ${flat[0][0]} ${pct2(flat[0][1])}`:'')+'</div></div>';
}
function v2Place(M){
  const arr=(M.D2.placement||[]).filter(r=>r.d>=st.from&&r.d<=st.to);
  if(!arr.length) return `<div class="card"><h2>ตำแหน่งที่โฆษณาแสดง</h2>`+
    `<div class="note">ช่องทางนี้ไม่มีข้อมูลตำแหน่งในรายงาน</div></div>`;
  const g=dGroup(arr,r=>r.p||'–').slice(0,8), mx=Math.max(1,...g.map(o=>o.spend||0));
  const best=g.filter(o=>(o.imp||0)>2000).sort((a,b)=>dCtr(b)-dCtr(a))[0];
  return `<div class="card"><div class="ch"><h2>ตำแหน่งที่โฆษณาแสดง</h2>`+
    `<span class="note sp" style="margin:0">8 อันดับแรกตามค่าแอด</span></div>`+
    g.map(o=>`<div class="hb"><span class="nm" title="${esc(o.k)}">${esc(String(o.k).replace(/ \/ ในแอพ$/,''))}</span>`+
      `<div><div class="bar2" style="width:${Math.max(1,(o.spend||0)/mx*100).toFixed(1)}%"></div></div>`+
      `<span class="num" style="text-align:right">${baht(o.spend)}</span></div>`).join('')+
    `<div class="note">${best?`CTR สูงสุดใน 8 อันดับ: ${esc(String(best.k).replace(/ \/ ในแอพ$/,''))} ${pct2(dCtr(best))}`:'ข้อมูลไม่พอเทียบ CTR'}</div></div>`;
}

/* ---------- บล็อก 5: ตาราง 5 แคมเปญที่ใช้เงินมากที่สุด ---------- */
function v2Top5(M){
  const top=M.camps.slice(0,5);
  if(!top.length) return '';
  const rows=top.map(C=>{
    const a=C.leaves[0], o=C.o, O=OBJ[o], v=objVal(o,C.t), res=objRes(o,C.t);
    /* ตัวย่อในวงกลม: เอาคำที่ยาวที่สุดในชื่อแคมเปญ ไม่ใช่ตัวแรกของชื่อ
       เพราะชื่อขึ้นต้นด้วยรหัส/วันที่เหมือนกันหมด ("i/u/24.06.25/...") จะได้ตัวซ้ำทุกแถว */
    const tok=(String(C.name).match(/[A-Za-zก-๙]{2,}/g)||[]).filter(t=>!/^(re|th|de)$/i.test(t))
      .sort((x,y)=>y.length-x.length);
    const ini=(tok[0]||String(C.name)||'W').slice(0,2).toUpperCase();
    return `<tr class="crow"${a?` data-ad="${a.i}"`:''}><td><span class="thumb">${esc(ini)}</span>`+
      `<span class="cname"><b title="${esc(C.name)}">${esc(C.name)}</b><span>${esc(O.lab)}</span></span></td>`+
      `<td class="num">${res==null?muted('–'):(O.roas?baht(res):int(res)+' '+O.unit)}</td>`+
      `<td class="num">${o==='cpas'&&!C.t.revenue?muted('รอยอด CPAS'):objFmt(o,v)}</td>`+
      `<td class="num">${baht(C.t.spend)}</td>`+
      `<td><span class="bdg b-${C.b.t}" title="${esc(C.b.why)}">${C.b.l}</span></td></tr>`;}).join('');
  return `<div class="card"><div class="ch"><h2>5 แคมเปญที่ใช้เงินมากที่สุด</h2>`+
    `<span class="note sp" style="margin:0">กดแถวเพื่อดูรายละเอียดด้านล่าง</span></div>`+
    `<div class="scroll"><table class="ctable"><thead><tr><th>แคมเปญ</th><th>ผลลัพธ์</th>`+
    `<th>ตัววัดตามเป้าหมาย</th><th>ค่าแอด</th><th>คำแนะนำ</th></tr></thead><tbody>${rows}</tbody></table></div>`+
    `<div class="note">ตัววัดต่างกันตามเป้าหมายของแคมเปญ — ทักแชทวัดด้วยต้นทุนต่อแชท · ซื้อบนเพจวัดด้วยต้นทุนต่อการซื้อ · CPAS และแพลตฟอร์มวัดด้วย ROAS · ห้ามเอาต่างเป้าหมายมาเทียบกันตรง ๆ</div></div>`;
}

/* ---------- บล็อก 6: ตารางเจาะชั้น + รายละเอียดแอด ---------- */
const LEAFN={fb:'แอด',tk:'แอด',sh:'สินค้า / คีย์เวิร์ด',lz:'สินค้า'};
function v2Row(cls,name,o,obj,b,attrs){
  const v=objVal(obj,o), res=objRes(obj,o);
  return `<tr class="${cls}" ${attrs||''}><td>${name}</td>`+
    `<td class="num">${baht(o.spend)}</td><td class="num">${o.imp==null?'–':int(o.imp)}</td>`+
    `<td class="num">${pct2(dCtr(o))}</td>`+
    `<td class="num">${res==null?'–':(OBJ[obj].roas?baht(res):int(res))}</td>`+
    `<td class="num">${objFmt(obj,v)}</td>`+
    `<td class="num">${Number.isFinite(dFreq(o))?dFreq(o).toFixed(2):'–'}</td>`+
    `<td>${b?`<span class="bdg b-${b.t}" title="${esc(b.why)}">${b.l}</span>`:''}</td></tr>`;
}
const V2LIM=8;
function v2Tree(M){
  const ch=M.ch;let h='';
  M.objs.forEach(o=>{
    const C=M.camps.filter(c=>c.o===o); if(!C.length) return;
    const s=C.reduce((a,c)=>a+(c.t.spend||0),0), O=OBJ[o];
    h+=`<tr class="obj"><td colspan="8">${esc(O.lab)} · ${C.length} แคมเปญ · ${baht(s)} · วัดด้วย ${esc(O.met)}`+
       (Number.isFinite(M.bench[o])?` · ค่าเฉลี่ยกลุ่ม ${objFmt(o,M.bench[o])}`:'')+`</td></tr>`;
    const all=V2.more.has(o);
    C.forEach((c,idx)=>{
      const key=o+'\u0000'+c.name, op=V2.open.has(key);
      const selIn=V2.sel!=null&&M.leaves[V2.sel]&&M.leaves[V2.sel].camp===c;
      if(!all&&idx>=V2LIM&&!op&&!selIn) return;
      h+=v2Row('lv1'+(op?' open':''),`<span class="car">▸</span>${esc(c.name)}`,c.t,o,c.b,`data-c="${esc(key)}"`);
      if(op){
        const multi=c.mids.length>1||(c.mids.length===1&&c.leaves.length>1);
        if(multi) c.groups.forEach(G=>{
          h+=v2Row('lv2','ชุดโฆษณา: '+esc(G.k||'—'),G,o,null,'');
          c.leaves.filter(a=>a.g===G.k).forEach(a=>{
            h+=v2Row('lv3'+(V2.sel===a.i?' sel':''),LEAFN[ch]+': '+esc(a.name),a.t,o,a.b,`data-ad="${a.i}"`);});});
        else c.leaves.forEach(a=>{
          h+=v2Row('lv3'+(V2.sel===a.i?' sel':''),LEAFN[ch]+': '+esc(a.name),a.t,o,a.b,`data-ad="${a.i}"`);});
      }
    });
    if(C.length>V2LIM) h+=`<tr><td colspan="8"><button class="link" data-more="${esc(o)}">`+
      `${all?'ย่อกลับ':'ดูอีก '+(C.length-V2LIM)+' แคมเปญ'}</button></td></tr>`;
  });
  return `<div class="scroll"><table id="v2tbl"><thead><tr><th>แคมเปญ / ชุดโฆษณา / ${LEAFN[ch]}</th>`+
    `<th>ค่าแอด</th><th>เห็น</th><th>CTR</th><th>ผลลัพธ์</th><th>ตัววัด</th><th>ความถี่</th><th>คำแนะนำ</th>`+
    `</tr></thead><tbody>${h}</tbody></table></div>`;
}
function v2AdDetail(M){
  const a=V2.sel!=null?M.leaves[V2.sel]:null;
  if(!a) return `<div class="addet"><div class="note">กดแถว${LEAFN[M.ch]}ในตารางด้านบนเพื่อดูรายละเอียด</div></div>`;
  const caps=M.D2.caps.funnel||[], t=a.t;
  const steps=fSteps(M.ch,caps,t);
  const mx=steps.length?(t[steps[0][0]]||1):1;
  let f='';
  steps.forEach(([k,lab],i)=>{const v=t[k]||0,prev=i?(t[steps[i-1][0]]||0):null;
    if(i&&prev) f+=`<div class="fdrop num">${v<=prev?'ตกหล่น '+((1-v/prev)*100).toFixed(1)+'%':'มากกว่าขั้นก่อน (นับคนละทาง)'}</div>`;
    /* ความกว้างใช้รากที่สอง ไม่งั้นขั้นท้ายที่เลขเล็กจะกลายเป็นเส้นบาง ๆ มองไม่เห็น */
    f+=`<div class="fstep"><span>${lab}</span><div class="fbar" style="width:${Math.max(Math.sqrt(v/mx)*100,1.5).toFixed(1)}%;opacity:${(1-i*0.12).toFixed(2)}"></div><span class="num">${int(v)}</span></div>`;});
  const H=a.h, O=OBJ[a.o];
  const half=H?`<div class="sub note" style="margin:0">ช่วงแรก ${thD(H.eR[0])}–${thD(H.eR[1])} (${H.eN} วัน) เทียบช่วงหลัง ${thD(H.lR[0])}–${thD(H.lR[1])} (${H.lN} วัน)</div>`+
    `<div class="scroll"><table style="margin-top:6px"><thead><tr><th>ตัวชี้วัด</th><th>ช่วงแรก</th><th>ช่วงหลัง</th></tr></thead><tbody>`+
    `<tr><td>ค่าแอดต่อวัน</td><td class="num">${baht((H.e.spend||0)/H.eN)}</td><td class="num">${baht((H.l.spend||0)/H.lN)}</td></tr>`+
    `<tr><td>CTR</td><td class="num">${pct2(dCtr(H.e))}</td><td class="num">${pct2(dCtr(H.l))}</td></tr>`+
    `<tr><td>${esc(O.met)}</td><td class="num">${objFmt(a.o,objVal(a.o,H.e))}</td><td class="num">${objFmt(a.o,objVal(a.o,H.l))}</td></tr>`+
    `<tr><td>${esc(O.unit)}ต่อวัน</td><td class="num">${objRes(a.o,H.e)==null?'–':nf2.format((objRes(a.o,H.e)||0)/H.eN)}</td>`+
    `<td class="num">${objRes(a.o,H.l)==null?'–':nf2.format((objRes(a.o,H.l)||0)/H.lN)}</td></tr>`+
    `</tbody></table></div>`
    :`<div class="note">ช่วงที่เลือกมีข้อมูลน้อยกว่า 4 วัน จึงเทียบช่วงแรกกับช่วงหลังไม่ได้</div>`;
  return `<div class="addet"><div><div style="font-size:14px;font-weight:700">${esc(a.camp.name)}</div>`+
    `<div class="note" style="margin-top:2px">${LEAFN[M.ch]}: ${esc(a.name)}${a.g?' · ชุดโฆษณา '+esc(a.g):''} · `+
    `<span class="bdg b-${a.b.t}">${a.b.l}</span> ${esc(a.b.why)}</div>`+
    `<div class="funnel" style="margin-top:10px">${f||'<div class="note">ช่องทางนี้ไม่มีข้อมูลเส้นทางลูกค้าระดับนี้</div>'}</div>`+
    (f?`<div class="note">ความกว้างแท่งใช้สเกลรากที่สอง เพื่อให้ขั้นท้ายที่ตัวเลขเล็กยังมองเห็น</div>`:'')+
    `</div><div>${half}</div></div>`;
}
function v2Drill(M){
  const cov=v2Cover(M);
  return `<div class="card" id="v2drill"><div class="ch"><h2>เจาะลึกรายแคมเปญ `+
    `<span class="asof">ข้อมูลถึงวันที่ ${thD(M.D2.data_asof,1)}</span></h2></div>`+
    (cov?`<div class="note" style="margin-top:0">${esc(cov.replace(/^ · /,''))}</div>`:'')+
    v2Tree(M)+v2AdDetail(M)+
    `<details class="dtl" style="margin-top:12px"><summary>เกณฑ์ป้ายคิดยังไง</summary><div class="pad">`+
    `<p>แบ่งกลุ่มตาม<b>เป้าหมายของแคมเปญ</b> แล้วเทียบกันเฉพาะในกลุ่มเดียวกัน · ทุกข้อนับเฉพาะรายการที่ใช้เงินเกิน ${baht(RX.MIN_SPEND)} ในช่วงที่เลือก</p>`+
    `<p>🔴 <b>หยุด</b> = ใช้เกิน ${baht(RX.NORES_SPEND)} แล้วยังไม่มีผลลัพธ์ หรือต้นทุนต่อผลลัพธ์แพงกว่าค่าเฉลี่ยกลุ่มตั้งแต่ ${RX.STOP_X} เท่า (กลุ่มที่วัดด้วย ROAS ใช้ ROAS ต่ำกว่าค่าเฉลี่ยเกินครึ่ง)</p>`+
    `<p>🔵 <b>เปลี่ยนชิ้นงาน</b> = CTR ช่วงหลังต่ำกว่าช่วงแรกเกิน ${(RX.CRE_DROP*100).toFixed(0)}%</p>`+
    `<p>🟡 <b>ปรับ</b> = CTR ดีกว่าค่าเฉลี่ยช่องทาง แต่ปลายทางไม่ดี (ต้นทุนแพงกว่าเฉลี่ย ${RX.FIX_X} เท่า หรือ ROAS ต่ำกว่า ${(RX.FIX_ROAS*100).toFixed(0)}% ของเฉลี่ย)</p>`+
    `<p>🟢 <b>เพิ่มงบ</b> = ต้นทุนถูกกว่าค่าเฉลี่ยกลุ่มตั้งแต่ ${((1-RX.UP_X)*100).toFixed(0)}% หรือ ROAS สูงกว่าค่าเฉลี่ยตั้งแต่ ${((RX.UP_ROAS-1)*100).toFixed(0)}%</p>`+
    `<p><b>แคมเปญ CPAS</b> ขึ้น "รอยอด CPAS" เพราะรายงานละเอียดยังไม่มีคอลัมน์มูลค่าการซื้อที่แชร์ — ต้องเพิ่มคอลัมน์นี้ตอน export จึงจะติดป้ายได้</p>`+
    `</div></details></div>`;
}

/* ---------- ประกอบแท็บช่องทาง (ลำดับตามแบบ ห้ามสลับ) ---------- */
function v2Tab(ch){
  const M=v2Model(ch);
  const sty=`--acc:${ACC[ch]};--acc-soft:${ACCS[ch]};--acc-ink:${ACCI[ch]}`;
  if(!M) return `<div class="v2" style="${sty}"><div class="card"><h2>แอดละเอียด</h2>`+
    `<div class="note">ยังไม่มีไฟล์ <code>data Ads/ads_detail_${ch}.json</code> — สร้างด้วย <code>python3 scripts/ads/detail_build.py</code></div></div></div>`;
  if(M.empty) return `<div class="v2" style="${sty}">${v2Kpis(ch)}`+
    `<div class="card"><h2>แอดละเอียด</h2><div class="note">ไม่มีข้อมูลแอดละเอียดในช่วงที่เลือก `+
    `(ไฟล์ครอบคลุม ${thD(M.D2.range.from,1)} – ${thD(M.D2.range.to,1)})</div></div></div>`;
  if(V2.selCh!==ch){V2.selCh=ch;V2.sel=null;V2.open.clear();V2.more.clear();}
  if(V2.sel==null){
    const first=M.leaves.filter(a=>a.b.t==='stop').sort((x,y)=>(y.t.spend||0)-(x.t.spend||0))[0]||M.leaves[0];
    if(first){V2.sel=first.i;V2.open.add(first.o+'\u0000'+first.camp.name);}
  }
  return `<div class="v2" style="${sty}">`+
    v2Kpis(ch)+
    `<section class="row3">${v2Trend(ch)}${v2Funnel(M)}${v2Sum(ch,M)}</section>`+
    v2Board(M)+
    `<section class="grid2">${v2Aud(M)}${v2Place(M)}</section>`+
    v2Top5(M)+
    v2Drill(M)+
    `<details class="dtl"><summary>ข้อจำกัดของข้อมูลช่องทางนี้</summary><div class="pad">`+
    (M.D2.notes||[]).map(n=>'<p>'+esc(n)+'</p>').join('')+'</div></details></div>';
}
/* ผูกปุ่มทั้งหมดของแท็บ — เรียกหลังใส่ HTML แล้วเท่านั้น */
function v2Wire(ch){
  const M=v2Model(ch); if(!M||M.empty) return;
  const go=()=>{ const h=document.getElementById('main');
    const keep=window.scrollY; renderTabBody(ch); window.scrollTo(0,keep); };
  const tbl=document.getElementById('v2tbl');
  if(tbl) tbl.addEventListener('click',e=>{
    const mb=e.target.closest('[data-more]');
    if(mb){const o=mb.dataset.more; V2.more.has(o)?V2.more.delete(o):V2.more.add(o); go(); return;}
    const tr=e.target.closest('tr'); if(!tr) return;
    if(tr.dataset.c!=null){const k=tr.dataset.c; V2.open.has(k)?V2.open.delete(k):V2.open.add(k); go(); return;}
    if(tr.dataset.ad!=null){V2.sel=+tr.dataset.ad; go();}
  });
  document.querySelectorAll('#main .bitem[data-ad],#main tr.crow[data-ad]').forEach(el=>{
    el.addEventListener('click',()=>{const a=M.leaves[+el.dataset.ad]; if(!a) return;
      V2.sel=a.i; V2.open.add(a.o+'\u0000'+a.camp.name); renderTabBody(ch);
      const d=document.getElementById('v2drill');
      if(d) d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});});
  const sg=document.getElementById('segAud');
  if(sg) sg.addEventListener('click',e=>{const b=e.target.closest('[data-m]'); if(!b) return;
    V2.metric=b.dataset.m; go();});
}

/* ---------- กล่อง "ต้องจัดการก่อน" ของหน้ารวม (ทุกช่องทาง) ---------- */
function dTodo(){
  const out=[];
  Object.keys(CHOF).forEach(v=>{const ch=CHOF[v], M=v2Model(ch);
    if(!M||M.empty) return;
    M.leaves.forEach(a=>{
      if(['stop','fix','cre'].includes(a.b.t)&&(a.t.spend||0)>=RX.TODO_MIN)
        out.push({ch,view:v,name:a.name,camp:a.camp.name,b:a.b,spend:a.t.spend||0});});});
  if(!out.length) return '';
  /* เรียงตาม "เงินที่ลงไปกับของที่ต้องจัดการ" = ค่าแอดของแถวนั้น
     ห้ามใช้ spend-revenue: แถวที่ติด 🔴 เพราะ ROAS ต่ำกว่าเฉลี่ยมักยังมีกำไร
     ค่าจะติดลบแล้วถูกดันไปท้ายตาราง ทั้งที่เป็นก้อนเงินใหญ่ที่สุด */
  out.sort((a,b)=>b.spend-a.spend);
  return `<div class="card"><h2>ต้องจัดการก่อน</h2>`+
    `<div class="note">รวมแอด สินค้า และคีย์เวิร์ดที่ติดป้าย หยุด / ปรับ / เปลี่ยนชิ้นงาน จากทุกช่องทาง `+
    `เรียงตามเงินที่ลงไป · ข้ามรายการที่ใช้เงินต่ำกว่า ${baht(RX.TODO_MIN)} ในช่วงที่เลือก</div>`+
    `<div class="scroll"><table><thead><tr><th>ช่องทาง</th><th>แคมเปญ</th><th>ชื่อ</th><th>ค่าแอด</th>`+
    `<th>คำแนะนำ</th><th>เหตุผล</th></tr></thead><tbody>`+
    out.slice(0,15).map(o=>`<tr class="go" data-go="${o.view}"><td>${CHNAME[o.ch]}</td>`+
      `<td class="name" title="${esc(o.camp)}">${esc(o.camp)}</td><td class="name">${esc(o.name)}</td>`+
      `<td class="num">${baht(o.spend)}</td><td><span class="bdg b-${o.b.t}">${o.b.l}</span></td>`+
      `<td class="why2">${esc(o.b.why)}</td></tr>`).join('')+'</tbody></table></div>'+
    `<div class="note adv">เป็นคำแนะนำจากตัวเลข ทีมการตลาดเป็นผู้ตัดสินใจ</div></div>`;
}

/* ของเดิมของแต่ละแท็บ — ต่อท้าย 6 บล็อกใหม่ (ผู้ใช้เลือก 6 พ.ย. 69)
   ในนี้มีข้อมูลที่แบบใหม่ไม่มีช่องให้: ยอดขายจริงเทียบค่าแอดรายวัน ·
   ตารางแคมเปญรายเดือนจากไฟล์ export · ตารางรายวัน · หมายเหตุข้อจำกัด
   ห้ามใส่ใน <details> ที่ปิดอยู่ — Chart.js วัดขนาด canvas ที่ซ่อนได้ 0×0 */
function v2Legacy(name,html){
  return `<div style="margin-top:22px;border-top:1px solid var(--bd);padding-top:16px">`+
    `<h2 style="font-size:16px">ข้อมูลเต็มของ${name}</h2>`+
    `<div class="note" style="margin:0 0 12px">ส่วนนี้คือหน้าเดิม: ยอดขายจริงเทียบค่าแอดรายวัน · `+
    `แคมเปญรายเดือนจากไฟล์ export · ตารางรายวัน · หมายเหตุข้อจำกัดของข้อมูล</div>${html}</div>`;
}
/* เรนเดอร์เนื้อแท็บช่องทางใหม่ทั้งก้อน — ใช้ตอนกดปุ่มในบล็อกใหม่ด้วย
   ต้อง destroyCharts() ก่อน ไม่งั้น Chart.js เก่าจะค้างกับ canvas ที่หายไปแล้ว */
function renderTabBody(ch){
  destroyCharts();
  ({sh:renderSh,tk:renderTk,lz:renderLz,fb:renderFb}[ch])();
  v2Wire(ch);
}

})();
