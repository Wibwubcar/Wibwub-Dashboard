<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Dashboard</title>
<!-- หน้า Ads ที่ WIBWUB_Dashboard.html ฝังจริงตั้งแต่ 28 ต.ค. 69 (เดิมคือ WIBWUB_Ads_Dashboard_new.html
     ซึ่งเก็บไว้เป็นทางถอย ห้ามลบ) · อ่าน JSON ชุดเดียวกันทั้งหมด ไม่มีตัวเลข hardcode
     ทุกตัวเลขคำนวณจากช่วงวันที่ที่เลือกเสมอ · ไม่มีสคริปต์ไหนเขียนลงไฟล์นี้ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* สีทุกตัวเป็นโทเคนบน :root แล้วธีมมืดนิยามทับเฉพาะโทเคน
   ห้ามใส่สีดิบในกฎของคอมโพเนนต์ ไม่งั้นธีมมืดจะได้ตัวอักษรของธีมหนึ่งบนพื้นของอีกธีม */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --bd:#E3E6EB; --ink:#111827; --ink2:#4B5563; --muted:#6B7280;
  --pri:#2457F5; --pri-soft:#C9D6F5; --pos:#0F7B4F; --neg:#B42318; --warn:#B54708; --warn-bg:#FFF6ED;
  --sh:#EE4D2D; --tk:#111827; --lz:#3B2CC4; --fb:#1877F2; --line:#06A755; --orange:#E8590C;
  --sh-soft:#FDEAE5; --tk-soft:#E5E7EB; --lz-soft:#E6E3FA; --fb-soft:#E3EEFE;
  --sh-ink:#FFFFFF; --tk-ink:#FFFFFF; --lz-ink:#FFFFFF; --fb-ink:#FFFFFF;
  --panel2:#FAFBFC; --hover:#F7F9FC; --row:#F1F3F6; --mini:#EDF0F4; --grid:#EEF0F3;
  --insn:#EEF2FE; --midbg:#F3F4F6;
  --hero:#111827; --hero-ink:#FFFFFF; --hero-ink2:#C3CAD6; --hero-bar:#243244; --hero-warn:#FDA29B;
  --b-up-bg:#E7F7EE; --b-up:#0B7A43; --b-stop-bg:#FDECEC; --b-stop:#B42318;
  --b-cre-bg:#E8F0FE; --b-cre:#1A4FBF; --b-fix-bg:#FEF6E0; --b-fix:#9A6400;
  --red-bg:#FEF3F2; --green-bg:#ECFDF3; --low-bg:#F2F4F7;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --card:#161C25; --bd:#273041; --ink:#E8ECF2; --ink2:#B6BFCC; --muted:#9AA4B4;
  --pri:#4C97FF; --pri-soft:#2E4F86; --pos:#3FCB8E; --neg:#FF7A70; --warn:#F0A938; --warn-bg:#3A2A0E;
  --sh:#FF6A45; --tk:#E8ECF2; --lz:#8A7BFF; --fb:#4C97FF; --line:#2FD48A; --orange:#F0914A;
  --sh-soft:#3A1C14; --tk-soft:#273041; --lz-soft:#211B4A; --fb-soft:#16294A;
  --sh-ink:#FFFFFF; --tk-ink:#0E1218; --lz-ink:#FFFFFF; --fb-ink:#FFFFFF;
  --panel2:#1C2430; --hover:#1C2430; --row:#222B38; --mini:#222B38; --grid:#273041;
  --insn:#1A2747; --midbg:#222B38;
  --hero:#1E2634; --hero-ink:#F3F6FA; --hero-ink2:#A9B3C2; --hero-bar:#0E1218; --hero-warn:#FF9C93;
  --b-up-bg:#123527; --b-up:#3FCB8E; --b-stop-bg:#3E1A17; --b-stop:#FF7A70;
  --b-cre-bg:#1A2747; --b-cre:#7EA2FF; --b-fix-bg:#3A2A0E; --b-fix:#F0A938;
  --red-bg:#3E1A17; --green-bg:#123527; --low-bg:#1C2430;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1218; --card:#161C25; --bd:#273041; --ink:#E8ECF2; --ink2:#B6BFCC; --muted:#9AA4B4;
  --pri:#4C97FF; --pri-soft:#2E4F86; --pos:#3FCB8E; --neg:#FF7A70; --warn:#F0A938; --warn-bg:#3A2A0E;
  --sh:#FF6A45; --tk:#E8ECF2; --lz:#8A7BFF; --fb:#4C97FF; --line:#2FD48A; --orange:#F0914A;
  --sh-soft:#3A1C14; --tk-soft:#273041; --lz-soft:#211B4A; --fb-soft:#16294A;
  --sh-ink:#FFFFFF; --tk-ink:#0E1218; --lz-ink:#FFFFFF; --fb-ink:#FFFFFF;
  --panel2:#1C2430; --hover:#1C2430; --row:#222B38; --mini:#222B38; --grid:#273041;
  --insn:#1A2747; --midbg:#222B38;
  --hero:#1E2634; --hero-ink:#F3F6FA; --hero-ink2:#A9B3C2; --hero-bar:#0E1218; --hero-warn:#FF9C93;
  --b-up-bg:#123527; --b-up:#3FCB8E; --b-stop-bg:#3E1A17; --b-stop:#FF7A70;
  --b-cre-bg:#1A2747; --b-cre:#7EA2FF; --b-fix-bg:#3A2A0E; --b-fix:#F0A938;
  --red-bg:#3E1A17; --green-bg:#123527; --low-bg:#1C2430;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;line-height:1.55}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.head .sub{font-size:12.5px;color:var(--muted)}
.lab{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink2);padding:8px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.seg.sm button{font-size:12.5px;padding:6px 11px}
.dates{display:none;gap:6px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:5px 9px}
.dates.on{display:flex}
.dates input{font:inherit;font-size:12.5px;border:0;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 15px;color:var(--ink2);cursor:pointer}
.tabs button i{width:8px;height:8px;border-radius:3px;background:currentColor}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)} .chip.warn i{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.hero{background:var(--hero);color:var(--hero-ink);border:0;margin-bottom:14px}
.hero .big{font-size:19px;font-weight:600;line-height:1.5}
.hero .big b{font-weight:700}
.hero.one .big{font-size:17px}
.hero .bar{margin-top:14px;height:30px;border-radius:9px;background:var(--hero-bar);overflow:hidden;display:flex}
.hero .bar span{display:block;background:var(--pri)}
.hero .leg{display:flex;gap:18px;margin-top:9px;font-size:12.5px;color:var(--hero-ink2);flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .k-l{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .k-v{font-size:26px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:1px}
.d-up{color:var(--pos);font-weight:600} .d-dn{color:var(--neg);font-weight:600} .d-fl{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
h2{font-size:15px;font-weight:700;margin-bottom:12px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{margin:0}
.ch .sp{margin-left:auto}
.note{font-size:12px;color:var(--muted);margin-top:9px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:600;color:var(--ink2);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--row)}
th:first-child,td:first-child{text-align:left}
tr.tot td{font-weight:700;border-top:1px solid var(--bd);border-bottom:0;background:var(--panel2)}
tr.sub2 td{background:var(--panel2);font-weight:600}
td.name{text-align:left;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.go{cursor:pointer} tr.go:hover td{background:var(--hover)}
.pf{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pf i{width:9px;height:9px;border-radius:3px}
.mini{height:7px;border-radius:4px;background:var(--mini);overflow:hidden;min-width:60px}
.mini span{display:block;height:100%;background:var(--pri)}
.mini.hi span{background:var(--orange)}
.barc{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.barc b{min-width:48px;display:inline-block}
.ins{display:flex;flex-direction:column;gap:12px}
.ins .it{display:flex;gap:10px;align-items:flex-start}
.ins .n{flex:0 0 22px;height:22px;border-radius:7px;background:var(--insn);color:var(--pri);font-size:12px;font-weight:700;display:grid;place-items:center}
.ins .tx{font-size:13px;color:var(--ink2)} .ins .tx b{color:var(--ink)}
.cw{position:relative;height:270px}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.bdg.red{background:var(--red-bg);color:var(--neg)} .bdg.green{background:var(--green-bg);color:var(--pos)}
.bdg.yellow{background:var(--warn-bg);color:var(--warn)} .bdg.low{background:var(--low-bg);color:var(--muted)}
tr.grp td{background:var(--hover);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--bd);padding:9px 8px}
tr.grp td .m{font-weight:400;color:var(--muted)}
.sumline{font-size:13.5px;margin-bottom:12px} .sumline b{font-weight:700}
.wk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.wk .cw{height:180px}
.fbgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fbgrid .f-l{font-size:12.5px;color:var(--ink2)} .fbgrid .f-v{font-size:19px;font-weight:700;margin-top:2px}
.fbgrid .f-s{font-size:12px;color:var(--muted)}
.link{color:var(--pri);font-weight:600;text-decoration:none;font-size:13px}
button.link{background:none;border:0;cursor:pointer;font-family:inherit}
.sel{font:inherit;font-size:13px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;color:var(--ink)}
details{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 18px}
details summary{cursor:pointer;font-weight:600;font-size:13.5px}
details .body{margin-top:12px;font-size:13px;color:var(--ink2)}
details .body p{margin-bottom:9px}
details .body h3{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 8px}
.scroll{overflow-x:auto}
.err{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}.fbgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wk{grid-template-columns:minmax(0,1fr)}.hero .big{font-size:17px}.hero.one .big{font-size:15.5px}}
@media(max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}.fbgrid{grid-template-columns:minmax(0,1fr)}.wrap{padding:14px 12px 44px}}

/* ---- แอดละเอียด (ads_detail_*.json) ---- */
.asof{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.dkpi{display:flex;flex-wrap:wrap;gap:10px 22px;margin:10px 0 14px}
.dkpi div{display:flex;flex-direction:column;gap:2px}
.dkpi span{font-size:11.5px;color:var(--muted)}
.dkpi b{font-size:17px}
details.dtl{border:1px solid var(--bd);border-radius:10px;margin-top:8px;background:var(--card)}
details.dtl>summary{cursor:pointer;padding:10px 12px;font-size:13px;display:flex;
  flex-wrap:wrap;gap:4px 10px;align-items:baseline}
details.dtl>summary::-webkit-details-marker{display:none}
details.dtl>summary:before{content:'▸';color:var(--muted);margin-right:6px}
details.dtl[open]>summary:before{content:'▾'}
details.dtl .sm{font-size:12px;color:var(--muted)}
details.dtl .pad{padding:0 12px 10px}
details.dtl .pad p{font-size:12.5px;color:var(--ink2);margin:6px 0}
.mid{display:inline-block;font-size:11px;color:var(--muted);background:var(--midbg);
  border-radius:5px;padding:1px 6px;margin-right:4px}
.bdg{display:inline-block;font-size:12px;white-space:nowrap;border-radius:6px;padding:2px 7px}
.b-up{background:var(--b-up-bg);color:var(--b-up)}.b-stop{background:var(--b-stop-bg);color:var(--b-stop)}
.b-cre{background:var(--b-cre-bg);color:var(--b-cre)}.b-fix{background:var(--b-fix-bg);color:var(--b-fix)}
.why{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:320px}
.why2{font-size:12px;color:var(--ink2)}
tr.fnr td{padding-top:0;border-top:none}
.fnl{display:flex;flex-direction:column;gap:3px;margin:2px 0 10px}
.fnl-s{position:relative}
.fnl-b{height:16px;border-radius:4px;background:var(--pri-soft)}
.fnl-t{position:absolute;inset:0;display:flex;align-items:center;gap:8px;
  font-size:11.5px;padding-left:7px}
.fnl-d{color:var(--muted)}
.adv{font-style:italic}
@media(max-width:720px){
  .dkpi{gap:8px 16px}.dkpi b{font-size:15px}.why{max-width:none}
  /* บนมือถือ ถ้าปล่อยให้ตารางหดตามจอ คอลัมน์เหตุผลจะถูกบีบจนขึ้นบรรทัดละตัวอักษร
     ให้ตารางกว้างขั้นต่ำแล้วเลื่อนแนวนอนใน .scroll แทน (หน้าเพจยังไม่เลื่อนข้าง) */
  .card .scroll>table{min-width:640px}
  .why2{min-width:220px;display:inline-block}
}

/* ======== ดีไซน์ใหม่ของแท็บช่องทาง (ตามแบบ WIBWUB_Ads_Facebook_Mock.html) ========
   สีเน้นของแท็บมาจาก --acc / --acc-soft ที่ตั้งไว้บน .v2 ของแต่ละช่องทาง
   ลำดับบล็อกในแท็บห้ามสลับ: การ์ด 4 ใบ -> แถว 3 ช่อง -> บอร์ด 4 ป้าย ->
   กลุ่มผู้ชม+ตำแหน่ง -> ตาราง 5 แคมเปญ -> ตารางเจาะชั้น+รายละเอียดแอด */
.v2{display:flex;flex-direction:column;gap:14px}
.v2 .kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:1px;min-width:0}
.v2 .k-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.v2 .ico{width:28px;height:28px;border-radius:8px;background:var(--acc-soft);display:grid;place-items:center;flex:none}
.v2 .ico svg{width:16px;height:16px;display:block}
.v2 .kpi .k-v{font-size:22px}
.v2 .spark{margin-top:6px}
.v2 .spark svg{width:100%;height:34px;display:block}
.row3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.row3 .card{margin:0}
.trendsvg svg,.fnlbig svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sumbox{background:linear-gradient(180deg,var(--acc-soft),var(--card) 60%)}
.sumtext{font-size:13.5px;margin-bottom:10px}
.next{list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:n}
.next li{counter-increment:n;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px;
  background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
.next li::before{content:counter(n);width:22px;height:22px;border-radius:50%;background:var(--acc);
  color:var(--acc-ink);font-size:12px;display:grid;place-items:center;font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bcol{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol h3{font-size:14px;display:flex;justify-content:space-between;gap:6px;font-weight:700}
.bcol .why3{font-size:12px;color:var(--muted)}
.bcol.up{background:var(--b-up-bg)} .bcol.up h3{color:var(--b-up)}
.bcol.fix{background:var(--b-fix-bg)} .bcol.fix h3{color:var(--b-fix)}
.bcol.cre{background:var(--b-cre-bg)} .bcol.cre h3{color:var(--b-cre)}
.bcol.stop{background:var(--b-stop-bg)} .bcol.stop h3{color:var(--b-stop)}
.bitem{background:var(--card);border:0;border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;
  text-align:left;color:var(--ink);cursor:pointer;width:100%}
.bitem b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid2 .card{margin:0}
.heat{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:4px;font-size:12.5px}
.heat>div{padding:8px 6px;border-radius:6px;text-align:center}
.heat .hd{color:var(--muted);background:none;font-size:12px}
.hb{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 78px;gap:8px;align-items:center;
  font-size:12.5px;margin-bottom:6px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar2{height:14px;border-radius:4px;background:var(--acc)}
.ctable td{padding:9px 8px}
tr.crow{cursor:pointer} tr.crow:hover td{background:var(--hover)}
.thumb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;
  background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:12px;margin-right:10px;vertical-align:middle}
.cname{display:inline-flex;flex-direction:column;vertical-align:middle;max-width:280px}
.cname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cname span{font-size:12px;color:var(--muted)}
tr.obj td{background:var(--panel2);font-weight:600;font-size:12.5px}
tr.lv1{cursor:pointer} tr.lv1:hover td{background:var(--hover)}
tr.lv1 td:first-child{max-width:330px;overflow:hidden;text-overflow:ellipsis}
tr.lv2 td:first-child{padding-left:28px;color:var(--muted)}
tr.lv3 td:first-child{padding-left:48px}
tr.lv3{cursor:pointer} tr.lv3.sel td{background:var(--acc-soft)}

<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Ads Dashboard</h1>
      <div class="sub" id="sub">กำลังโหลด…</div>
    </div>
    <div class="lab">
      <div class="seg" id="seg">
        <button data-p="7">7 วัน</button><button data-p="30">30 วัน</button>
        <button data-p="thisMonth">เดือนนี้</button><button data-p="lastMonth">เดือนก่อน</button>
        <button data-p="custom">กำหนดเอง</button>
      </div>
      <div class="dates" id="dates"><input type="date" id="dFrom"><span style="color:var(--muted)">–</span><input type="date" id="dTo"></div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="overview">ภาพรวม</button>
    <button data-v="shopee"><i style="color:var(--sh)"></i>Shopee</button>
    <button data-v="tiktok"><i style="color:var(--tk)"></i>TikTok</button>
    <button data-v="lazada"><i style="color:var(--lz)"></i>Lazada</button>
    <button data-v="facebook"><i style="color:var(--fb)"></i>Facebook</button>
  </nav>
  <div id="main"><div class="err">กำลังโหลดข้อมูล…</div></div>
</div>
<script>
(function(){
'use strict';
/* อ่านสีจากโทเคนบน :root — ธีมมืดนิยามทับโทเคนไว้แล้ว จึงไม่ต้องมีสีดิบในนี้
   (Chart.js รับแต่ค่าสีจริง ส่ง var(--x) เข้าไปตรง ๆ ไม่ได้) */
const CV=k=>(getComputedStyle(document.documentElement).getPropertyValue(k)||'').trim();
const C=new Proxy({},{get:(_,k)=>CV({sh:'--sh',tk:'--tk',lz:'--lz',fb:'--fb',pri:'--pri',
  soft:'--pri-soft',ink2:'--ink2',ink:'--ink',bd:'--bd',grid:'--grid',card:'--card',
  muted:'--muted',pos:'--pos',neg:'--neg',line:'--line'}[k]||'--ink')});
const TIP=()=>({backgroundColor:C.card,titleColor:C.ink,bodyColor:C.ink2,borderColor:C.bd,borderWidth:1});
/* ===================== เกณฑ์ป้ายแนะนำ — แก้ที่นี่ที่เดียว =====================
   ผู้ใช้สั่ง 6 พ.ย. 69 ให้รวมค่าคงที่ของเกณฑ์ไว้บนสุดของไฟล์ ไม่กระจายในฟังก์ชัน
   ทุกเกณฑ์เทียบกับ "ค่าเฉลี่ยของกลุ่มเป้าหมายเดียวกัน" ไม่ใช่ตัวเลขตายตัว
   เพราะแคมเปญทักแชทกับแคมเปญ CPAS วัดกันคนละหน่วย (ดู OBJ)                  */
const RX={
  MIN_SPEND:500,     // รายการที่ใช้เงินน้อยกว่านี้ในช่วงที่เลือก = ไม่ตัดสิน
  NORES_SPEND:1000,  // 🔴 หยุด: ใช้เกินนี้แล้วยังไม่มีผลลัพธ์เลย
  STOP_X:2,          // 🔴 หยุด: ต้นทุนต่อผลลัพธ์แพงกว่าค่าเฉลี่ยกลุ่มกี่เท่า
  STOP_ROAS:0.5,     // 🔴 หยุด (กลุ่มที่วัดด้วย ROAS): ROAS ต่ำกว่าเฉลี่ยกี่เท่า
  CRE_DROP:0.30,     // 🔵 เปลี่ยนชิ้นงาน: CTR ช่วงหลังต่ำกว่าช่วงแรกเกินสัดส่วนนี้
  FIX_X:1.3,         // 🟡 ปรับ: CTR ดีกว่าเฉลี่ยช่องทาง แต่ต้นทุนแพงกว่าเฉลี่ยเท่านี้
  FIX_ROAS:0.8,      // 🟡 ปรับ (ROAS): CTR ดี แต่ ROAS ต่ำกว่าเฉลี่ยเท่านี้
  UP_X:0.7,          // 🟢 เพิ่มงบ: ต้นทุนถูกกว่าค่าเฉลี่ยกลุ่มเท่านี้
  UP_ROAS:1.3,       // 🟢 เพิ่มงบ (ROAS): ROAS สูงกว่าค่าเฉลี่ยกลุ่มเท่านี้
  TODO_MIN:100       // กล่อง "ต้องจัดการก่อน" ข้ามรายการที่ใช้เงินต่ำกว่านี้
};

const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MK=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const nf0=new Intl.NumberFormat('th-TH',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht=v=>'฿'+nf0.format(Math.round(v||0));
const baht2=v=>'฿'+nf2.format(v||0);
const int=v=>nf0.format(Math.round(v||0));
const pct=(v,d)=>Number.isFinite(v)?(v*100).toFixed(d==null?1:d)+'%':'–';
const pct2=v=>Number.isFinite(v)?v.toFixed(2)+'%':'–';
const x2=v=>Number.isFinite(v)&&v>0?v.toFixed(2)+'x':'–';
const div=(a,b)=>b?a/b:NaN;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const between=(a,b)=>Math.round((pd(b)-pd(a))/864e5)+1;
const thD=(s,y)=>{const d=pd(s);return d.getUTCDate()+' '+TH[d.getUTCMonth()]+(y?' '+(d.getUTCFullYear()+543):'');};
const thR=(a,b)=>a===b?thD(a,1):thD(a)+' – '+thD(b,1);
const muted=s=>'<span style="color:var(--muted)">'+s+'</span>';

let D=null,P=null,TKC=null,FB=null,DAYS=[],MIN='',MAX='';
const charts={};
const st={preset:'thisMonth',from:'',to:'',view:'overview',shMonth:'',tkMonth:'',tkCamp:'gmax',shAll:false,tkAll:false};
let R=null,PR=null,NN=0,PA='',PB='';

/* ---------- รวมตัวเลขตามช่วง ----------
   โครงเดียวกับ sumRange() ของหน้าจริง (_new) เพื่อให้ตัวเลขตรงกันทุกตัว */
function sum(a,b){
  const r={n:0,days:[],
    sh:{real:0,ord:0,spend:0,broad:0,direct:0,adsOrd:0,adsDays:0,t:{product:{b:0,d:0,s:0,o:0},search:{b:0,d:0,s:0,o:0},live:{b:0,d:0,s:0,o:0}}},
    tk:{real:0,ord:0,spend:0,gmv:0,adsOrd:0,t:{product:{g:0,s:0,o:0},live:{g:0,s:0,o:0}}},
    lz:{real:0,ord:0,spend:0,gmv:0,adsOrd:0,imp:0,clicks:0,days:0},
    fb:{spend:0,msg:0,purch:0,omni:0,lead:0,oval:0,pval:0,imp:0,clicks:0,ad3Spend:0}};
  for(const d of DAYS){ if(d<a||d>b) continue; const v=D.days[d]; r.n++; r.days.push(d);
    r.sh.real+=v.sh_real.gmv; r.sh.ord+=v.sh_real.orders;
    /* ค่าโฆษณา Shopee ย้อนได้แค่ ~185 วัน วันเก่ากว่านั้นไม่มีคีย์ sh_ads
       ต้องข้ามและนับ adsDays ไว้เตือน — ห้ามนับเป็น 0 เพราะจะเพี้ยนทั้ง ROAS และ % */
    if(v.sh_ads){ r.sh.adsDays++;
      for(const k of ['product','search','live']){ const x=v.sh_ads[k]||{}, t=r.sh.t[k];
        t.b+=x.gmv_broad||0; t.d+=x.gmv_direct||0; t.s+=x.spend||0; t.o+=x.orders||0;
        r.sh.broad+=x.gmv_broad||0; r.sh.direct+=x.gmv_direct||0; r.sh.spend+=x.spend||0; r.sh.adsOrd+=x.orders||0; } }
    r.tk.real+=v.tk_real.gmv; r.tk.ord+=v.tk_real.orders;
    for(const k of ['product','live']){ const x=(v.tk_ads||{})[k]||{}, t=r.tk.t[k];
      t.g+=x.gmv||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.tk.gmv+=x.gmv||0; r.tk.spend+=x.spend||0; r.tk.adsOrd+=x.orders||0; }
    /* Lazada เริ่มเก็บ 1 ก.ย. 2569 — วันก่อนหน้าไม่มีคีย์ ให้ข้าม ไม่นับเป็น 0 */
    if(v.lz_real&&v.lz_ads){ const L=v.lz_ads; r.lz.days++;
      r.lz.real+=v.lz_real.gmv||0; r.lz.ord+=v.lz_real.orders||0;
      r.lz.gmv+=L.revenue||0; r.lz.spend+=L.spend||0; r.lz.adsOrd+=L.orders||0;
      r.lz.imp+=L.imp||0; r.lz.clicks+=L.clicks||0; }
  }
  if(fbOn()){ const K=FB.keys, g=k=>K.indexOf(k);
    const ad3=(FB.acc_days||{})['AD3']||{};
    for(const d in ad3){ if(d<a||d>b) continue; r.fb.ad3Spend+=ad3[d][g('spend')]||0; }
    for(const d in FB.days){ if(d<a||d>b) continue; const row=FB.days[d];
      r.fb.spend+=row[g('spend')]||0; r.fb.msg+=row[g('msg')]||0; r.fb.purch+=row[g('purch')]||0;
      r.fb.omni+=row[g('omni')]||0; r.fb.lead+=row[g('lead')]||0;
      r.fb.oval+=row[g('omni_val')]||0; r.fb.pval+=row[g('pval')]||0;
      r.fb.imp+=row[g('imp')]||0; r.fb.clicks+=row[g('clicks')]||0; } }
  /* ยอดขายนับ 3 ช่องทางที่ขายบนแพลตฟอร์ม · ค่าแอด "สาม" ใช้เป็นตัวตั้งของ % และ ROAS
     ส่วน "รวม" บวก Facebook เข้ามาด้วย (ยอดขายของ FB ไปลงช่องทางอื่น จึงไม่เอามาหาร) */
  r.real=r.sh.real+r.tk.real+r.lz.real; r.ord=r.sh.ord+r.tk.ord+r.lz.ord;
  r.spend3=r.sh.spend+r.tk.spend+r.lz.spend; r.spendAll=r.spend3+r.fb.spend;
  return r;
}
function dayV(d){ const v=D.days[d],S=v.sh_ads||{},T=v.tk_ads||{},L=v.lz_ads,LR=v.lz_real;
  const g=(o,k,f)=>((o[k]||{})[f]||0);
  const o={hasSh:!!v.sh_ads, hasLz:!!(L&&LR),
    shR:v.sh_real.gmv, shO:v.sh_real.orders,
    shB:g(S,'product','gmv_broad')+g(S,'search','gmv_broad')+g(S,'live','gmv_broad'),
    shD:g(S,'product','gmv_direct')+g(S,'search','gmv_direct')+g(S,'live','gmv_direct'),
    shSp:g(S,'product','spend'), shSs:g(S,'search','spend'), shSl:g(S,'live','spend'),
    tkR:v.tk_real.gmv, tkO:v.tk_real.orders,
    tkGp:g(T,'product','gmv'), tkGl:g(T,'live','gmv'), tkSp:g(T,'product','spend'), tkSl:g(T,'live','spend'),
    lzR:LR?LR.gmv||0:null, lzO:LR?LR.orders||0:null,
    lzS:L?L.spend||0:null, lzG:L?L.revenue||0:null, lzAO:L?L.orders||0:null,
    lzI:L?L.imp||0:null, lzC:L?L.clicks||0:null};
  o.shS=o.shSp+o.shSs+o.shSl; o.tkS=o.tkSp+o.tkSl; o.tkG=o.tkGp+o.tkGl;
  o.fbS=fbOn()&&FB.days[d]?FB.days[d][FB.keys.indexOf('spend')]:null;
  o.real=o.shR+o.tkR+(o.lzR||0);
  o.ads=o.shS+o.tkS+(o.lzS||0)+(o.fbS||0);
  return o;
}
/* ---------- Facebook helpers (ชุดเดียวกับหน้าจริง) ---------- */
function fbOn(){ return !!(FB&&FB.days&&Object.keys(FB.days).length); }
function fbDays(a,b){ return fbOn()?Object.keys(FB.days).filter(d=>d>=a&&d<=b).sort():[]; }
function fbSum(src,dates,keys){ const o={}; keys.forEach(k=>o[k]=0);
  dates.forEach(d=>{ const a=src[d]; if(a) keys.forEach((k,i)=>o[k]+=a[i]||0); }); return o; }
function fbTot(a,b){ return fbSum(FB.days,fbDays(a,b),FB.keys); }
function fbAcc(k,a,b){ return fbSum((FB.acc_days||{})[k]||{},fbDays(a,b),FB.keys); }
/* แคมเปญเดียว -> null ถ้าไม่มีวันไหนอยู่ในช่วง (ห้ามคืน 0 จะโชว์แถวเปล่า) */
function fbCamp(c,a,b){ const ds=Object.keys(c.dd||{}).filter(d=>d>=a&&d<=b);
  if(!ds.length) return null; const o=fbSum(c.dd,ds,FB.camp_keys); o._n=ds.length; return o; }

/* ---------- ช่วงวันที่ ---------- */
function range(p){
  if(p==='custom') return [st.from||MIN,st.to||MAX];
  if(/^\d+$/.test(p)){const a=add(MAX,-(+p-1));return [a<MIN?MIN:a,MAX];}
  const m=MAX.slice(0,7);
  if(p==='thisMonth'){const a=m+'-01';return [a<MIN?MIN:a,MAX];}
  const d=pd(m+'-01'); d.setUTCMonth(d.getUTCMonth()-1);
  const a=iso(d), b=add(m+'-01',-1); return [a<MIN?MIN:a, b>MAX?MAX:b];
}
function setPreset(p){
  st.preset=p;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.getElementById('dates').classList.toggle('on',p==='custom');
  const [a,b]=range(p); st.from=a; st.to=b;
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  st.shMonth=''; st.tkMonth=''; render();
}
function setView(v){
  if(!['overview','shopee','tiktok','lazada','facebook'].includes(v)) v='overview';
  st.view=v;
  if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  render(); window.scrollTo(0,0);
}

/* ---------- ส่วนประกอบร่วม ---------- */
function delta(cur,prev,cost){
  if(!Number.isFinite(cur)||!Number.isFinite(prev)||!prev) return '<span class="d-fl">เทียบช่วงก่อนไม่ได้</span>';
  const r=(cur-prev)/Math.abs(prev); if(Math.abs(r)<0.005) return '<span class="d-fl">เท่าเดิม</span>';
  const up=r>0, good=cost?!up:up;
  return `<span class="${good?'d-up':'d-dn'}">${up?'▲':'▼'} ${(Math.abs(r)*100).toFixed(1)}%</span>`;
}
/* อัตราส่วนต้องเทียบเป็น "จุด" (percentage point) ไม่ใช่ % ของตัวเอง
   เหมือนหน้าจริง — 17.2% จาก 17.5% คือลดลง 0.3 จุด ไม่ใช่ลดลง 1.7% */
function deltaPt(cur,prev){
  if(!Number.isFinite(cur)||!Number.isFinite(prev)) return '<span class="d-fl">เทียบช่วงก่อนไม่ได้</span>';
  const dd=(cur-prev)*100; if(Math.abs(dd)<0.05) return '<span class="d-fl">เท่าเดิม</span>';
  return `<span class="${dd>0?'d-dn':'d-up'}">${dd>0?'▲':'▼'} ${Math.abs(dd).toFixed(1)} จุด</span>`;
}
function kpi(l,v,s,d){return `<div class="card kpi"><div class="k-l">${l}</div><div class="k-v num">${v}</div>`+
  `<div class="k-s num">${s||'&nbsp;'}</div><div class="k-s">${d||''}</div></div>`;}
/* แถบสีแบบตารางภาพรวม: สีส้มเมื่อเกินเกณฑ์ (ค่าแอดต่อยอดขาย > 25%) */
function barc(v,mx,hi,fmt){
  const w=Number.isFinite(v)&&mx?Math.min(100,v/mx*100):0;
  return `<div class="barc"><div class="mini${hi?' hi':''}" style="width:88px"><span style="width:${w.toFixed(1)}%"></span></div>`+
    `<b class="num">${fmt?fmt(v):pct(v)}</b></div>`;
}
function destroyCharts(){ Object.keys(charts).forEach(k=>{ try{charts[k].destroy();}catch(e){} delete charts[k]; }); }
function yTick(v){ return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':v; }
/* กราฟรายวัน: ความสูงของแท่ง = ยอดขาย · ส่วนล่างสีเข้ม = ค่าแอด (ซ้อนกัน) */
function stackChart(key,canvasId,days,ads,real,color,labTop,labBottom){
  const labels=days.map(d=>thD(d)), rest=real.map((v,i)=>Math.max(0,(v||0)-(ads[i]||0)));
  if(charts[key]) charts[key].destroy();
  charts[key]=new Chart(document.getElementById(canvasId),{type:'bar',
    data:{labels,datasets:[
      {label:labBottom,data:ads,backgroundColor:color,stack:'s',borderRadius:{topLeft:0,topRight:0,bottomLeft:5,bottomRight:5}},
      {label:labTop,data:rest,backgroundColor:C.soft,stack:'s',borderRadius:{topLeft:5,topRight:5,bottomLeft:0,bottomRight:0}}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{...TIP(),padding:11,displayColors:false,
        callbacks:{label:c=>{const i=c.dataIndex,A=ads[i]||0,T=(real[i]||0);
          return [labTop+' '+baht(T),labBottom+' '+baht(A),'คิดเป็น '+pct(div(A,T))];}}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:C.muted,maxRotation:0,autoSkipPadding:14,font:{size:11}}},
              y:{stacked:true,grid:{color:C.grid},border:{display:false},ticks:{color:C.muted,font:{size:11},callback:yTick}}}}});
}
function lineChart(key,canvasId,labels,data,color,fmt,type){
  if(charts[key]) charts[key].destroy();
  charts[key]=new Chart(document.getElementById(canvasId),{type:type||'line',
    data:{labels,datasets:[{label:'',data,borderColor:color,backgroundColor:type==='bar'?color:'transparent',
      borderWidth:2,borderRadius:4,pointRadius:labels.length>20?0:3,tension:.25}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{...TIP(),padding:10,displayColors:false,callbacks:{label:c=>' '+fmt(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{color:C.muted,maxRotation:0,autoSkipPadding:12,font:{size:11}}},
              y:{beginAtZero:true,grid:{color:C.grid},border:{display:false},ticks:{color:C.muted,font:{size:11},callback:yTick}}}}});
}
/* เดือนที่มีไฟล์ export (ใช้กับตารางแคมเปญ) · ค่าเริ่มต้น = เดือนของวันสุดท้ายในช่วงที่เลือก */
function monthKeys(){ return MK.filter(k=>P&&P.months&&P.months[k]); }
function defMonth(){ const ks=monthKeys(), m=MK[+st.to.slice(5,7)-1];
  return ks.includes(m)?m:ks[ks.length-1]; }
function monthSel(id,cur){ return `<select class="sel" id="${id}">`+monthKeys().slice().reverse()
  .map(k=>`<option value="${k}"${k===cur?' selected':''}>${THF[MK.indexOf(k)]} 2569</option>`).join('')+'</select>'; }
function moreBtn(id,n,all){ return n>15?`<button class="link" id="${id}" style="margin-top:10px">${all?'แสดงน้อยลง':'แสดงทั้งหมด '+n+' แคมเปญ'}</button>`:''; }

/* ======================= routing ======================= */
function render(){
  const a=st.from,b=st.to;
  R=sum(a,b); NN=between(a,b); PA=add(a,-NN); PB=add(a,-1);
  PR=(PA>=MIN)?sum(PA,PB):null;
  document.querySelectorAll('#tabs button').forEach(t=>t.classList.toggle('on',t.dataset.v===st.view));
  document.getElementById('sub').textContent=`ช่วงที่เลือก ${thR(a,b)} (${NN} วัน)`+(PR?` · เทียบกับ ${thR(PA,PB)}`:'');
  if(st.view==='overview'){
    destroyCharts(); renderOv();
    const h=dTodo();                     // กล่อง "ต้องจัดการก่อน" รวมทุกช่องทาง
    if(h){ const m=document.getElementById('main'); m.insertAdjacentHTML('beforeend',h);
      m.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>setView(el.dataset.go)); }
  } else renderTabBody(CHOF[st.view]);
}
function statusChips(){
  const cov=D.coverage||{};
  const cs=[['ทุกแพลตฟอร์ม',MAX]].concat([['Shopee',cov.shopee],['TikTok',cov.tiktok],['Lazada',cov.lazada]]
      .filter(x=>x[1])).concat(fbOn()?[['Facebook',FB.to]]:[]);
  return '<div class="chips">'+cs.map(([n2,d],i)=>{const late=d<MAX;
    return `<span class="chip${late?' warn':''}"><i></i>${i?n2+' ถึง '+thD(d):'ข้อมูลครบถึง '+thD(d,1)}</span>`;}).join('')+'</div>';
}
/* ประโยคสรุป 1 บรรทัดของแท็บช่องทาง — โครงเดียวกับกล่องสรุปของภาพรวม */
function oneLine(txt,legs){
  return `<div class="card hero one"><div class="big">${txt}</div>`+
    (legs?`<div class="leg">${legs.map(s=>'<span>'+s+'</span>').join('')}</div>`:'')+'</div>';
}
function dayTableHtml(id){ return `<div class="scroll" id="${id}"></div>`; }

/* ======================= ภาพรวม ======================= */
function renderOv(){

      :`<span style="color:${dd>0?'var(--hero-warn)':'#6CE9A6'}">${dd>0?'สูงขึ้น':'ลดลง'} ${(Math.abs(dd)*100).toFixed(1)} จุด</span>`;}

  const mx=Math.max(0.0001,...rows.map(r=>div(r.o.spend,r.o.real)||0));
  const trs=rows.map(r=>{const rt=div(r.o.spend,r.o.real);

        <td class="num">${muted('—')}</td><td class="num">${baht(R.fb.spend)}</td>
        <td class="num">${muted('—')}</td><td class="num">${muted('—')}</td></tr>`:'');
  const table=`<div class="card"><h2>แต่ละแพลตฟอร์มคุ้มแค่ไหน</h2><div class="scroll"><table id="tPf">

  const rev=R.fb.oval+R.fb.pval;
  const fbCard=`<div class="card"><div class="ch">

        <div class="f-s num">${R.fb.oval?'มูลค่า '+baht(R.fb.oval)+' ÷ ค่าแอด AD3 '+baht(R.fb.ad3Spend||0):'ต้อง export ใหม่ให้มีคอลัมน์มูลค่า'}</div></div>
    </div></div>`;
  const chart=`<div class="card"><div class="ch"><h2>ยอดขายและค่าแอดรายวัน</h2>
      <button id="btnTbl" class="link sp">ดูตาราง</button></div>
    <div class="cw"><canvas id="cDay"></canvas></div>
    <div class="note">ความสูงของแท่ง = ยอดขายจริง · ส่วนสีเข้มด้านล่าง = ค่าแอด (รวม Facebook)</div>
    <div id="tblWrap" style="display:none;margin-top:14px" class="scroll"></div></div>`;
  const mon=`<div class="card"><h2>แนวโน้มรายเดือน</h2>
    <div class="cw" style="height:220px"><canvas id="cMon"></canvas></div>
    <div class="note">ตัวเลขจากไฟล์รายงานรายเดือนของแต่ละแพลตฟอร์ม ไม่ขึ้นกับช่วงวันที่ด้านบน</div></div>`;
  document.getElementById('main').innerHTML=statusChips()+hero+kpis+`<div class="two">${table}${insHtml}</div>${chart}
     <div style="margin-top:14px">${fbCard}</div><div style="margin-top:14px">${mon}</div>
     <details><summary>ตัวเลขในหน้านี้มาจากไหน</summary><div class="body">
       <p><b>ยอดขายจริง</b> นับเฉพาะ Shopee + TikTok + Lazada ซึ่งเป็นช่องทางที่ขายบนแพลตฟอร์มโดยตรง ไม่รวม Facebook · LINE · Carcare · POS · เว็บไซต์ · เบิกของ จึงน้อยกว่าหน้า “การตลาด vs ยอดขาย” ที่นับครบ 11 ช่องทาง — ตั้งใจให้ต่าง เพราะถ้าเอายอดที่ไม่ได้มาจากโฆษณามารวมด้วย ROAS จะดูดีเกินจริง</p>

       <p><b>ยอดจาก Ads ของแพลตฟอร์ม</b> มักสูงกว่ายอดขายจริง เพราะแพลตฟอร์มนับออเดอร์ให้โฆษณาถ้าลูกค้าเคยเห็นหรือคลิกภายในช่วงเวลาหนึ่ง ออเดอร์เดียวอาจถูกนับให้หลายแคมเปญ และนับก่อนหักยกเลิก/คืนเงิน จึงควรดู “ค่าแอด ÷ ยอดขายจริง” เป็นหลัก</p>

      R.days.slice().reverse().map(d=>{const v=dayV(d);
        return `<tr><td>${thD(d,1)}</td><td class="num">${baht(v.real)}</td><td class="num">${baht(v.ads)}</td><td class="num">${pct(div(v.ads,v.real))}</td></tr>`;}).join('')+'</tbody></table>';

  stackChart('day','cDay',R.days,R.days.map(d=>dayV(d).ads),R.days.map(d=>dayV(d).real),C.pri,'ยอดขายจริง','ค่าแอด');

function drawMon(){
  if(!P||!P.months) return;
  const ks=monthKeys(), labels=ks.map(k=>TH[MK.indexOf(k)]);
  const get=(k,p)=>((P.months[k]||{})[p]||{}).spend||0;
  /* Lazada ไม่มีไฟล์ export รายเดือน จึงรวมเองจากรายวัน */
  const lz=ks.map(k=>{const mm=String(MK.indexOf(k)+1).padStart(2,'0'); let s=0;
    for(const d of DAYS){ if(d.slice(5,7)!==mm) continue; const v=D.days[d]; if(v.lz_ads) s+=v.lz_ads.spend||0; } return s;});
  const ds=[{label:'Shopee',data:ks.map(k=>get(k,'shopee')),backgroundColor:C.sh,borderRadius:4},
    {label:'TikTok',data:ks.map(k=>get(k,'tiktok')),backgroundColor:C.tk,borderRadius:4}];
  if(lz.some(v=>v)) ds.push({label:'Lazada',data:lz,backgroundColor:C.lz,borderRadius:4});
  charts.mon=new Chart(document.getElementById('cMon'),{type:'bar',data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{color:C.ink2,boxWidth:10,font:{size:11},usePointStyle:true,pointStyle:'rectRounded'}},
        tooltip:{...TIP(),callbacks:{label:c=>' '+c.dataset.label+': '+baht(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{size:11}}},
              y:{grid:{color:C.grid},border:{display:false},ticks:{color:C.muted,font:{size:11},callback:yTick}}}}});
}

/* ======================= Shopee ======================= */
function renderSh(){
  const s=R.sh, p=PR&&PR.sh, ratio=div(s.spend,s.real);
  const missNote=s.adsDays<R.n
    ? `<span style="color:var(--hero-warn)">ค่าแอดมีข้อมูล ${int(s.adsDays)} จาก ${int(R.n)} วัน</span>` : '';
  const head=oneLine(
    `Shopee: ค่าแอด <b>${baht(s.spend)}</b> กับยอดขายจริง <b>${baht(s.real)}</b> — ใช้ค่าแอดไป <b>${pct(ratio)}</b> ของยอดขาย (ROAS <b>${x2(div(s.real,s.spend))}</b>)`,
    [`ยอดที่ Shopee นับให้โฆษณา broad ${baht(s.broad)}`,`direct ${baht(s.direct)}`,
     `${int(s.ord)} ออเดอร์จริง · ${int(s.adsOrd)} ออเดอร์จาก Ads`, missNote].filter(Boolean));
  const kpis=`<div class="kpis">
    ${kpi('ยอดขายจริง',baht(s.real),int(s.ord)+' ออเดอร์',delta(s.real,p&&p.real))}
    ${kpi('ค่าโฆษณา',baht(s.spend),'ทุกประเภทโฆษณา',delta(s.spend,p&&p.spend,1))}
    ${kpi('ค่าแอด ÷ ยอดขาย',pct(ratio),'',deltaPt(ratio,p&&div(p.spend,p.real)))}
    ${kpi('ROAS จากยอดจริง',x2(div(s.real,s.spend)),'ตามแพลตฟอร์ม (broad) '+x2(div(s.broad,s.spend)),delta(div(s.real,s.spend),p&&div(p.real,p.spend)))}</div>`;
  if(!st.shMonth) st.shMonth=defMonth();
  const M=(P.months||{})[st.shMonth]||{}, S=M.shopee||{};
  const list=(S.campaigns||[]).slice().sort((x,y)=>(y.spend||0)-(x.spend||0));
  const shown=st.shAll?list:list.slice(0,15);
  const mx=Math.max(0.0001,...list.map(c=>c.spend||0));
  const trs=shown.map(c=>`<tr><td class="name" title="${esc(c.name)}">${esc(c.name)}</td>
      <td class="num">${baht(c.spend)}</td>
      <td>${barc(c.spend||0,mx,false,v=>pct(div(v,S.spend)))}</td>
      <td class="num">${baht(c.revenue)}</td><td class="num">${x2(c.roas||div(c.revenue,c.spend))}</td>
      <td class="num">${int(c.orders)}</td><td class="num">${c.orders?baht2(c.cpa||c.spend/c.orders):'–'}</td>
      <td class="num">${int(c.imp)}</td><td class="num">${int(c.clicks)}</td>
      <td class="num">${c.ctr!=null?pct2(+c.ctr):'–'}</td></tr>`).join('')
    || `<tr><td colspan="10" style="text-align:center;padding:18px;color:var(--muted)">ไม่มีข้อมูลแคมเปญในเดือนนี้</td></tr>`;
  const camp=`<div class="card"><div class="ch"><h2>แคมเปญ Shopee</h2>
      <span class="note" style="margin:0">ตามไฟล์ export รายเดือน ไม่ขึ้นกับช่วงวันที่ด้านบน</span>

  const mb=document.getElementById('tkMore'); if(mb) mb.onclick=()=>{st.tkAll=!st.tkAll;render();};
  stackChart('tkDay','cTkDay',R.days,R.days.map(d=>dayV(d).tkS),R.days.map(d=>dayV(d).tkR),C.tk,'ยอดขายจริง','ค่าแอด');
}

/* ======================= Lazada ======================= */
function renderLz(){
  const z=R.lz, p=(PR&&PR.lz&&PR.lz.days)?PR.lz:null, ratio=div(z.spend,z.real);
  if(!z.days){
    document.getElementById('main').innerHTML=statusChips()+
      `<div class="card"><h2>ไม่มีข้อมูล Lazada ในช่วงที่เลือก</h2><div class="note">Lazada เริ่มเก็บ 1 ก.ย. 2569 — เลือกช่วงที่ครอบวันที่นั้นขึ้นไป</div></div>`;
    return; }
  const head=oneLine(
    `Lazada: ค่าแอด <b>${baht(z.spend)}</b> กับยอดขายจริง <b>${baht(z.real)}</b> — ใช้ค่าแอดไป <b>${pct(ratio)}</b> ของยอดขาย (ROAS <b>${x2(div(z.real,z.spend))}</b>)`,
    [`ยอดที่ Lazada นับให้โฆษณา ${baht(z.gmv)}`,`${int(z.ord)} ออเดอร์จริง · ${int(z.adsOrd)} ออเดอร์จาก Ads`,
     `มีข้อมูล ${int(z.days)} วันในช่วงนี้`]);
  const kpis=`<div class="kpis">
    ${kpi('ยอดขายจริง',baht(z.real),int(z.ord)+' ออเดอร์',delta(z.real,p&&p.real))}
    ${kpi('ค่าโฆษณา',baht(z.spend),'Sponsored รวมทุกแคมเปญ',delta(z.spend,p&&p.spend,1))}
    ${kpi('ค่าแอด ÷ ยอดขาย',pct(ratio),'',deltaPt(ratio,p&&div(p.spend,p.real)))}
    ${kpi('ROAS จากยอดจริง',x2(div(z.real,z.spend)),'ตามแพลตฟอร์ม '+x2(div(z.gmv,z.spend)),delta(div(z.real,z.spend),p&&div(p.real,p.spend)))}</div>`;
  /* Lazada ไม่มีรายแคมเปญในไฟล์ จึงสรุปเป็นรายเดือนแทน (รวมเองจากรายวัน) */
  const by={}; R.days.forEach(d=>{const v=dayV(d); if(!v.hasLz) return; const m=d.slice(0,7);
    const o=by[m]||(by[m]={real:0,ord:0,spend:0,gmv:0,imp:0,clicks:0,n:0});
    o.real+=v.lzR; o.ord+=v.lzO; o.spend+=v.lzS; o.gmv+=v.lzG; o.imp+=v.lzI; o.clicks+=v.lzC; o.n++;});
  const ms=Object.keys(by).sort(), mx=Math.max(0.0001,...ms.map(m=>div(by[m].spend,by[m].real)||0));
  const trs=ms.map(m=>{const o=by[m], rt=div(o.spend,o.real);
    return `<tr><td>${THF[+m.slice(5,7)-1]} 2569 <span style="color:var(--muted)">· ${o.n} วัน</span></td>
      <td class="num">${baht(o.real)}</td><td class="num">${baht(o.spend)}</td>
      <td>${barc(rt,mx,rt>0.25)}</td><td class="num">${x2(div(o.real,o.spend))}</td>
      <td class="num">${baht(o.gmv)}</td><td class="num">${int(o.imp)}</td><td class="num">${int(o.clicks)}</td>
      <td class="num">${o.imp?pct2(o.clicks/o.imp*100):'–'}</td></tr>`;}).join('');
  const camp=`<div class="card"><div class="ch"><h2>สรุปรายเดือน — Lazada</h2>
      <span class="note" style="margin:0">ไฟล์ Lazada ไม่มีรายละเอียดรายแคมเปญ (ต่างจาก Shopee/TikTok) จึงสรุปเป็นรายเดือนจากข้อมูลรายวันในช่วงที่เลือก</span></div>
    <div class="scroll"><table><thead><tr><th>เดือน</th><th>ยอดขายจริง</th><th>ค่าโฆษณา</th><th>ค่าแอด ÷ ยอดขาย</th><th>ROAS จริง</th><th>ยอดจาก Ads</th><th>Impression</th><th>คลิก</th><th>CTR</th></tr></thead>
      <tbody>${trs}<tr class="tot"><td>รวม ${z.days} วัน</td><td class="num">${baht(z.real)}</td><td class="num">${baht(z.spend)}</td>
        <td class="num">${pct(ratio)}</td><td class="num">${x2(div(z.real,z.spend))}</td><td class="num">${baht(z.gmv)}</td>
        <td class="num">${int(z.imp)}</td><td class="num">${int(z.clicks)}</td><td class="num">${z.imp?pct2(z.clicks/z.imp*100):'–'}</td></tr></tbody></table></div>
    <div class="note">แถบเป็นสีส้มเมื่อค่าแอดเกิน 25% ของยอดขาย</div></div>`;
  const chart=`<div class="card"><h2>ยอดขายและค่าแอดรายวัน — Lazada</h2>
    <div class="cw"><canvas id="cLzDay"></canvas></div>
    <div class="note">ความสูงของแท่ง = ยอดขายจริงของ Lazada · ส่วนสีเข้มด้านล่าง = ค่าแอด Sponsored</div></div>`;
  const lzDays=R.days.filter(d=>dayV(d).hasLz);
  const dayRows=lzDays.slice().reverse().map(d=>{const v=dayV(d);
    return `<tr><td>${thD(d)}</td><td class="num">${int(v.lzR)}</td><td class="num">${int(v.lzO)}</td><td class="num">${int(v.lzS)}</td>
      <td class="num">${pct(div(v.lzS,v.lzR))}</td><td class="num">${int(v.lzG)}</td><td class="num">${x2(div(v.lzR,v.lzS))}</td>
      <td class="num">${int(v.lzI)}</td><td class="num">${int(v.lzC)}</td></tr>`;}).join('');
  const det=`<details><summary>รายละเอียดและหมายเหตุ — Lazada</summary><div class="body">
    <h3>ตารางรายวัน (${thR(st.from,st.to)})</h3>
    <div class="scroll"><table><thead><tr><th>วันที่</th><th>ยอดขายจริง</th><th>ออเดอร์</th><th>ค่าโฆษณา</th><th>÷ยอดจริง</th><th>ยอดจาก Ads</th><th>ROAS จริง</th><th>Impression</th><th>คลิก</th></tr></thead>
      <tbody>${dayRows}<tr class="tot"><td>รวม ${z.days} วัน</td><td class="num">${int(z.real)}</td><td class="num">${int(z.ord)}</td>
        <td class="num">${int(z.spend)}</td><td class="num">${pct(ratio)}</td><td class="num">${int(z.gmv)}</td>
        <td class="num">${x2(div(z.real,z.spend))}</td><td class="num">${int(z.imp)}</td><td class="num">${int(z.clicks)}</td></tr></tbody></table></div>
    <h3>หมายเหตุ</h3>
    <p><b>ข้อมูล Lazada เริ่มเก็บ 1 ก.ย. 2569</b> วันก่อนหน้านั้นไม่มีคีย์ในไฟล์และ<b>ไม่ถูกนับเป็น 0</b></p>
    <p><b>ค่าโฆษณาเป็น Sponsored Product/Affiliate รวมทุกแคมเปญ</b> ยังไม่มีรายละเอียดรายแคมเปญเหมือน Shopee/TikTok · ยอดจาก Ads นับแบบ attribution ของ Lazada จึงควรดู “ค่าแอด ÷ ยอดขายจริง” และ “ROAS จากยอดจริง” เป็นหลักเช่นเดียวกับแพลตฟอร์มอื่น</p>
    </div></details>`;
  document.getElementById('main').innerHTML=statusChips()+v2Tab('lz')+v2Legacy('Lazada',head+camp+'<div style="margin-top:14px">'+chart+'</div>'+det);
  stackChart('lzDay','cLzDay',lzDays,lzDays.map(d=>dayV(d).lzS),lzDays.map(d=>dayV(d).lzR),C.lz,'ยอดขายจริง','ค่าแอด');
}

/* ======================= Facebook =======================
   ตัวเลขทุกตัวมาจาก facebook/fb_daily.json ห้ามพิมพ์ทับลงใน HTML
   (skill: wibwub-avoid-stale-hardcoded-labels) */
function renderFb(){
  const main=document.getElementById('main');
  if(!fbOn()){ main.innerHTML=statusChips()+
    `<div class="card"><h2>ไม่มีข้อมูล Facebook Ads</h2><div class="note">ยังไม่มีไฟล์ <code>data Ads/facebook/fb_daily.json</code> — รัน <code>python3 scripts/ads/fb_daily.py</code> หลังวางไฟล์ FBD_*.csv ไว้ใน <code>data Ads/facebook/daily/</code></div></div>`;
    return; }
  const dates=fbDays(st.from,st.to);
  if(!dates.length){ main.innerHTML=statusChips()+
    `<div class="card"><h2>ไม่มีข้อมูล Facebook ในช่วงที่เลือก</h2><div class="note">ไฟล์ Facebook ครอบคลุม ${thD(FB.from,1)} – ${thD(FB.to,1)} เท่านั้น</div></div>`;
    return; }
  const T=fbTot(st.from,st.to);
  const pdts=PR?fbDays(PA,PB):[]; const Pv=pdts.length?fbSum(FB.days,pdts,FB.keys):null;
  const rev=(T.omni_val||0)+(T.pval||0);
  const ctr=v=>v.imp?v.clicks/v.imp*100:NaN, cpc=v=>v.clicks?v.spend/v.clicks:NaN;
  const missN=between(st.from,st.to)-dates.length;
  const head=oneLine(
    `Facebook: ค่าแอด <b>${baht(T.spend)}</b> ได้แชท <b>${int(T.msg)}</b> ครั้ง (${T.msg?baht2(T.spend/T.msg):'–'} ต่อแชท) · ยอดซื้อที่ FB นับ <b>${int(T.purch+T.omni)}</b> รายการ`+
    (rev?` มูลค่า <b>${baht(rev)}</b> (ROAS ${x2(div(rev,T.spend))})`:''),
    [`${FB.accounts.length} บัญชี · ${dates.length} วันที่มีข้อมูล`,
     `อิมเพรสชัน ${int(T.imp)} · คลิก ${int(T.clicks)}`,
     missN>0?`<span style="color:var(--hero-warn)">ช่วงที่เลือกกว้างกว่าไฟล์ ${int(missN)} วัน — วันที่ขาดไม่ถูกนับเป็น 0</span>`:''].filter(Boolean));
  const kpis=`<div class="kpis">
    ${kpi('ค่าโฆษณา',baht2(T.spend),'อิมเพรสชัน '+int(T.imp)+' · คลิก '+int(T.clicks),delta(T.spend,Pv&&Pv.spend,1))}
    ${kpi('แชท',int(T.msg),'การสนทนาที่เริ่มขึ้น · รวมทุกบัญชี',delta(T.msg,Pv&&Pv.msg))}
    ${kpi('ยอดซื้อ',int(T.purch+T.omni),'บนเพจ '+int(T.purch)+' · CPAS ที่ Shopee '+int(T.omni)+(T.lead?' · lead '+int(T.lead):''),delta(T.purch+T.omni,Pv&&(Pv.purch+Pv.omni)))}
    ${kpi('มูลค่าการซื้อ',rev?baht(rev):muted('ไม่มีในไฟล์'),rev?('ROAS '+x2(div(rev,T.spend))+' · CPAS '+baht(T.omni_val||0)+' · บนเพจ '+baht(T.pval||0)):'ต้อง export ใหม่ให้มีคอลัมน์มูลค่าการซื้อ',rev?delta(rev,Pv&&(Pv.omni_val+Pv.pval)):'')}</div>`;
  /* ── ตารางแยกบัญชี: 1 แถวต่อ (บัญชี × เป้าหมาย) + แถวรวมของบัญชี ── */
  const rows=[]; let cpasNote=false,noGoalNote=false,msgNote=false;
  const mxSpend=Math.max(0.0001,...FB.accounts.map(a=>fbAcc(a.key,st.from,st.to).spend||0));
  FB.accounts.forEach(acc=>{
    const mine=FB.camps.filter(c=>c.acc===acc.key).map(c=>({c,s:fbCamp(c,st.from,st.to)})).filter(x=>x.s);
    if(!mine.length) return;
    const byGoal={};
    mine.forEach(({c,s})=>{ const g=byGoal[c.goal]||(byGoal[c.goal]={label:c.goal_label,roas:[],n:0});
      FB.camp_keys.forEach(k=>g[k]=(g[k]||0)+s[k]);
      /* เอา ROAS ถ่วงน้ำหนักของแต่ละแคมเปญมาเฉลี่ยกันไม่ได้ ต้องบวกมูลค่ากับค่าแอดก่อนแล้วค่อยหาร
         ค่าเฉลี่ยรายวันเก็บไว้เป็นทางถอยเฉพาะแคมเปญที่ไฟล์ไม่มีมูลค่า */
      if(c.roas!=null&&c.roas_src!=='value') g.roas.push(c.roas); g.n++; });
    const gs=Object.entries(byGoal).sort((a,b)=>b[1].spend-a[1].spend);
    const A=fbAcc(acc.key,st.from,st.to);
    rows.push(`<tr class="sub2"><td>${esc(acc.label)}</td>
      <td style="text-align:left;color:var(--muted)">${gs.length} เป้าหมาย · ${mine.length} แคมเปญ</td>
      <td class="num">${baht2(A.spend)}</td>
      <td>${barc(A.spend||0,mxSpend,false,v=>pct(div(v,T.spend)))}</td>
      <td></td><td></td>
      <td class="num">${((A.omni_val||0)+(A.pval||0))?x2(div((A.omni_val||0)+(A.pval||0),A.spend)):''}</td>
      <td class="num">${int(A.imp)}</td><td class="num">${pct2(ctr(A))}</td><td class="num">${A.clicks?baht2(cpc(A)):'–'}</td>
      <td class="num">${A.reach_d?(A.imp/A.reach_d).toFixed(2):'–'}</td></tr>`);
    gs.forEach(([gk,g])=>{
      const gi=(FB.goals||{})[gk]||{};
      if(gk==='omni') cpasNote=true; if(gk==='none') noGoalNote=true; if(gk==='msg') msgNote=true;
      const gr=(g.omni_val||0)+(g.pval||0);
      const roas=gr?x2(div(gr,g.spend)):g.roas.length?(g.roas.reduce((a,b)=>a+b,0)/g.roas.length).toFixed(2)+'x':muted('ไม่มีในไฟล์');
      rows.push(`<tr><td style="padding-left:22px;color:var(--ink2)">↳ ${esc(g.label)}</td>
        <td style="text-align:left;color:var(--muted)">${gk==='none'?'':esc(gi.res||'ผลลัพธ์')}</td>
        <td class="num">${baht(g.spend)}</td>
        <td>${barc(g.spend||0,mxSpend,false,v=>pct(div(v,T.spend)))}</td>
        <td class="num">${gk==='none'?muted('–'):int(g.res)}</td>
        <td class="num">${g.res?baht2(g.spend/g.res):muted('–')}</td>
        <td class="num">${roas}</td><td class="num">${int(g.imp)}</td>
        <td class="num">${pct2(ctr(g))}</td><td class="num">${g.clicks?baht2(cpc(g)):'–'}</td>
        <td class="num">${muted('–')}</td></tr>`);
    });
  });
  rows.push(`<tr class="tot"><td>รวมทุกบัญชี</td><td style="text-align:left"></td>
    <td class="num">${baht2(T.spend)}</td><td class="num">100%</td><td></td><td></td>
    <td class="num">${rev?x2(div(rev,T.spend)):''}</td><td class="num">${int(T.imp)}</td>
    <td class="num">${pct2(ctr(T))}</td><td class="num">${T.clicks?baht2(cpc(T)):'–'}</td>
    <td class="num">${T.reach_d?(T.imp/T.reach_d).toFixed(2):'–'}</td></tr>`);
  const accTable=`<div class="card"><div class="ch"><h2>แยกตามบัญชีและเป้าหมาย</h2>
      <span class="note" style="margin:0">ผลลัพธ์/ต้นทุนอ่านตามเป้าหมายของแคมเปญ (คอลัมน์ “ตัวระบุผลลัพธ์”)</span></div>
    <div class="scroll"><table><thead><tr><th>บัญชี / เป้าหมาย</th><th style="text-align:left">ผลลัพธ์ที่นับ</th><th>ค่าโฆษณา</th>
      <th>สัดส่วนค่าแอด</th><th>ผลลัพธ์</th><th>ต้นทุน/ผลลัพธ์</th><th>ROAS</th><th>อิมเพรสชัน</th><th>CTR</th><th>CPC</th><th>ความถี่ (เฉลี่ย/วัน)</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div></div>`;
  /* กราฟรายวัน: ค่าแอด vs มูลค่าการซื้อที่ FB นับ (ถ้าไฟล์ไม่มีมูลค่า โชว์ค่าแอดเดี่ยว) */
  const kS=FB.keys.indexOf('spend'), kO=FB.keys.indexOf('omni_val'), kP=FB.keys.indexOf('pval');
  const dSpend=dates.map(d=>FB.days[d][kS]||0);
  const dRev=dates.map(d=>(FB.days[d][kO]||0)+(FB.days[d][kP]||0));
  const chart=`<div class="card"><h2>มูลค่าการซื้อและค่าแอดรายวัน — Facebook</h2>
    <div class="cw"><canvas id="cFbDay"></canvas></div>
    <div class="note">${rev?'ความสูงของแท่ง = มูลค่าการซื้อที่ Facebook นับได้ (CPAS + บนเพจ) · ส่วนสีเข้มด้านล่าง = ค่าแอด':'ไฟล์ชุดนี้ไม่มีคอลัมน์มูลค่าการซื้อ กราฟจึงแสดงค่าแอดรายวันเท่านั้น'} · ยอดที่ปิดการขายกันในแชทแล้วไปลง Shipnity ไม่อยู่ในกราฟนี้</div></div>`;
  const notes=['<b>ความถี่</b> โชว์เฉพาะแถวรวมของบัญชี เพราะ reach บวกข้ามวันไม่ได้ (คนเดิมถูกนับซ้ำ) ค่าที่เห็นคือ <b>ความถี่เฉลี่ยรายวัน</b> = Σอิมเพรสชัน ÷ Σreach รายวัน จึงไม่อยู่ในกราฟรายสัปดาห์'];
  if(msgNote) notes.push('<b>ROAS ของบัญชีที่ยิงเพื่อทักแชท</b> (WibWub AD 1 / AD 1) นับเฉพาะยอดที่ Facebook ตามรอยได้เอง <b>ไม่รวมยอดที่ปิดการขายกันในแชทแล้วไปลงที่ Shipnity</b> ตัวเลขจริงจึงสูงกว่าที่เห็นบนหน้านี้ — ห้ามเอาไปตัดสินว่าแคมเปญทักแชทไม่คุ้ม');
  if(cpasNote) notes.push('<b>AD3 เป็น CPAS</b> — ยอดซื้อเกิดที่ Shopee ไม่ใช่ที่เพจ ห้ามเอาไปเทียบกับยอดช่องทาง Facebook ใน Shipnity');

  const det=`<details><summary>รายละเอียดและหมายเหตุ — Facebook</summary><div class="body">

    </div>
    <h3>รายแคมเปญ — ${cr.length} แคมเปญที่มียอดในช่วงนี้</h3>

/* สัปดาห์เริ่มวันจันทร์ · อัตราส่วนคิดจากผลรวมของสัปดาห์เสมอ ไม่ใช่เฉลี่ยค่ารายวัน */
function fbWeeks(dates){
  const wk=new Map();
  dates.forEach(d=>{ const dt=pd(d), mon=add(d,-((dt.getUTCDay()+6)%7));
    if(!wk.has(mon)) wk.set(mon,[]); wk.get(mon).push(d); });
  return [...wk.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([,ds])=>{
    const s=fbSum(FB.days,ds,FB.keys), f=x=>x.slice(8,10)+'/'+x.slice(5,7);
    return {label:f(ds[0])+'–'+f(ds[ds.length-1]),days:ds.length,...s,
      cpm:s.imp?s.spend/s.imp*1000:0, ctr:s.imp?s.clicks/s.imp*100:0, cpc:s.clicks?s.spend/s.clicks:0};});
}

/* ======================= แอดละเอียด v2 (ads_detail_*.json) =======================
   โครงของแท็บช่องทางตามแบบที่ผู้ใช้อนุมัติ 6 พ.ย. 69 (WIBWUB_Ads_Facebook_Mock.html)
   ลำดับห้ามสลับ: การ์ด 4 ใบ -> แถว 3 ช่อง -> บอร์ด 4 ป้าย -> กลุ่มผู้ชม+ตำแหน่ง
                  -> ตาราง 5 แคมเปญ -> ตารางเจาะชั้น + รายละเอียดแอด
   ข้อมูลมาจาก scripts/ads/detail_build.py · ช่องไหนเป็น null = ช่องทางนั้นวัดไม่ได้
   **ห้ามแปลง null เป็น 0** ตัวเลข 0 แปลว่าวัดแล้วได้ศูนย์ ซึ่งคนละความหมาย
   เกณฑ์ป้ายอยู่ที่ค่าคงที่ RX บนสุดของสคริปต์ (ผู้ใช้สั่งให้รวมไว้ที่เดียว)        */
const DET={};                       // ch -> JSON (null ถ้าโหลดไม่ได้)
const MET=['spend','imp','reach','clicks','msg','view','atc','checkout','orders','revenue'];
const CHOF={shopee:'sh',tiktok:'tk',lazada:'lz',facebook:'fb'};
const CHNAME={fb:'Facebook',tk:'TikTok',sh:'Shopee',lz:'Lazada'};
const ACC={fb:'var(--fb)',tk:'var(--tk)',sh:'var(--sh)',lz:'var(--lz)'};
const ACCS={fb:'var(--fb-soft)',tk:'var(--tk-soft)',sh:'var(--sh-soft)',lz:'var(--lz-soft)'};
/* สีตัวอักษรที่อ่านออกบนพื้นสีเน้น — TikTok ธีมมืดสีเน้นเกือบขาว จึงต้องใช้ตัวอักษรเข้ม */
const ACCI={fb:'var(--fb-ink)',tk:'var(--tk-ink)',sh:'var(--sh-ink)',lz:'var(--lz-ink)'};
const V2={open:new Set(),more:new Set(),sel:null,selCh:'',metric:'spend'};

function dBlank(){const o={};MET.forEach(k=>o[k]=null);return o;}
function dAdd(dst,src){MET.forEach(k=>{const v=src[k];if(v==null)return;dst[k]=dst[k]==null?v:dst[k]+v;});}
function dRows(ch){const D2=DET[ch];if(!D2)return[];
  /* Lazada: รายงานไม่คืนคอลัมน์วันที่ แถวหนึ่งคือ "ยอดรวมของทั้งช่วง" (ฟิลด์ span)
     จึงนับเข้าช่วงที่เลือกเมื่อ "ช่วงของไฟล์ทับกับช่วงที่เลือก" ไม่ใช่เทียบวันเดียว */
  if(ch==='lz') return D2.rows.filter(r=>{const s=(r.span||'').split('..');
    return s.length===2?(s[0]<=st.to&&s[1]>=st.from):(r.d>=st.from&&r.d<=st.to);});
  return D2.rows.filter(r=>r.d>=st.from&&r.d<=st.to);}
/* แถว "ชั้นบน" ของช่องทาง — ใช้คิดยอดรวมและหัวแคมเปญ ห้ามบวกข้ามชั้น
   Shopee มี 3 ชั้นในไฟล์เดียว (camp/kw/prod) ถ้าบวกหมดจะได้ ฿264,422 แทน ฿223,317 */
function dTop(ch,rows){ return ch==='sh'?rows.filter(r=>r.lv==='camp'||r.lv==='kw'):rows; }
/* ลูกของแคมเปญหนึ่ง — ถ้ามีชั้นสินค้าให้โชว์ชั้นนั้น ไม่งั้นโชว์ตัวมันเอง */
function dKids(ch,inC){
  if(ch!=='sh') return inC;
  const prod=inC.filter(r=>r.lv==='prod'); if(prod.length) return prod;
  const kw=inC.filter(r=>r.lv==='kw'); return kw.length?kw:inC;
}
function dGroup(rows,keyf){const m=new Map();
  rows.forEach(r=>{const k=keyf(r);let o=m.get(k);
    if(!o){o={k,c:r.c,g:r.g,a:r.a,lv:r.lv,n:0,...dBlank()};m.set(k,o);}
    o.n++;dAdd(o,r);});
  return [...m.values()].sort((x,y)=>(y.spend||0)-(x.spend||0));}
function dRoas(o){return (o.revenue!=null&&o.spend)?o.revenue/o.spend:NaN;}
function dCtr(o){return o.imp?o.clicks/o.imp*100:NaN;}
function dFreq(o){return o.reach?o.imp/o.reach:NaN;}
function dAvg(rows){const t=dBlank();rows.forEach(r=>dAdd(t,r));
  return {roas:dRoas(t),ctr:dCtr(t),tot:t};}
/* ครึ่งแรก/ครึ่งหลังของช่วง — ใช้ดูว่าชิ้นงานเริ่มหมดอายุหรือยัง
   ต้องมีอย่างน้อย 4 วันจึงแบ่งได้ ไม่งั้นครึ่งหนึ่งจะเหลือวันเดียวแล้วแกว่งมาก */
function dHalves(rows){
  const ds=[...new Set(rows.map(r=>r.d))].sort();
  if(ds.length<4) return null;
  const mid=ds[Math.ceil(ds.length/2)];
  const h=[dBlank(),dBlank()];
  rows.forEach(r=>dAdd(h[r.d<mid?0:1],r));
  return {e:h[0],l:h[1],eN:ds.filter(d=>d<mid).length,lN:ds.filter(d=>d>=mid).length,
          eR:[ds[0],ds.filter(d=>d<mid).pop()],lR:[mid,ds[ds.length-1]]};
}

/* ---------- เป้าหมายแคมเปญ -> ตัวชี้วัด (ห้ามรวม ROAS ข้ามเป้าหมาย) ----------
   ต้นเหตุที่หน้าเดิมโชว์ ROAS 4.53x กับ 0.89x ขัดกัน คือเอาแคมเปญทักแชท
   (ซึ่ง Facebook ตามรอยยอดขายไม่ได้) ไปรวมกับแคมเปญ CPAS ที่ตามรอยได้ */
const OBJ={
  msg :{res:'msg',    lab:'ข้อความ',               met:'ต้นทุนต่อแชท',     unit:'แชท'},
  buy :{res:'orders', lab:'ยอดซื้อบนเพจ',          met:'ต้นทุนต่อการซื้อ', unit:'ยอดซื้อ'},
  cpas:{res:'revenue',lab:'ยอดขาย CPAS (Shopee)',  met:'ROAS',             unit:'ยอดซื้อ', roas:true},
  plat:{res:'revenue',lab:'ยอดขายบนแพลตฟอร์ม',     met:'ROAS',             unit:'ยอดซื้อ', roas:true},
  lead:{res:'msg',    lab:'ลูกค้าเป้าหมาย',        met:'ต้นทุนต่อ lead',   unit:'lead'},
  none:{res:null,     lab:'ไม่ระบุเป้าหมายในรายงาน',met:'–',               unit:'ผลลัพธ์'}
};
const OBJORD=['msg','buy','cpas','plat','lead','none'];
let FBGOAL=null;
function fbGoalMap(){
  if(FBGOAL) return FBGOAL;
  FBGOAL={};
  const M={msg:'msg',purchase:'buy',omni:'cpas',lead:'lead',none:'none'};
  if(fbOn()&&FB.camps) FB.camps.forEach(c=>{FBGOAL[c.name]=M[c.goal]||'none';});
  return FBGOAL;
}
/* เป้าหมายของแคมเปญหนึ่ง — ของ Facebook อ่านจาก fb_daily.json (คอลัมน์ตัวระบุผลลัพธ์)
   ถ้าไม่เจอชื่อตรงกันจึงเดาจากคำขึ้นต้นของชื่อแคมเปญ (อนุสัญญาการตั้งชื่อของทีม) */
function objOf(ch,name){
  if(ch!=='fb') return 'plat';
  const g=fbGoalMap()[name]; if(g) return g;
  if(/^cpas/i.test(name)) return 'cpas';
  if(/^i\/u/i.test(name)) return 'msg';
  if(/^ii\//i.test(name)) return 'lead';
  return 'buy';
}
function objRes(o,t){const k=OBJ[o].res;return k?t[k]:null;}
/* ตัววัดหลักของเป้าหมายนั้น — ROAS (สูงดี) หรือ ต้นทุนต่อผลลัพธ์ (ต่ำดี) */
function objVal(o,t){ const O=OBJ[o];
  if(O.roas) return dRoas(t);
  const r=objRes(o,t); return (r&&t.spend!=null)?t.spend/r:NaN; }
function objFmt(o,v){ return Number.isFinite(v)?(OBJ[o].roas?x2(v):baht2(v)):'–'; }

/* ---------- ป้ายแนะนำ 4 แบบ (เกณฑ์อยู่ที่ RX บนสุดของไฟล์) ---------- */
const BRANK={stop:4,cre:3,fix:2,up:1,none:0};
const BNAME={up:'🟢 เพิ่มงบ',fix:'🟡 ปรับ',cre:'🔵 เปลี่ยนชิ้นงาน',stop:'🔴 หยุด',none:'—'};
function v2Badge(a,bench,chCtr){
  const t=a.t,o=a.o,O=OBJ[o],sp=t.spend||0;
  if(o==='cpas'&&!t.revenue)
    return {t:'none',l:'—',why:'รอยอดขาย CPAS จาก Shopee — รายงานละเอียดยังไม่มีคอลัมน์มูลค่าการซื้อที่แชร์'};
  if(o==='none') return {t:'none',l:'—',why:'รายงานชุดนี้ไม่มีผลลัพธ์ให้วัด'};
  const res=objRes(o,t);
  if(sp>=RX.NORES_SPEND&&!res) return {t:'stop',l:BNAME.stop,why:`ใช้ ${baht(sp)} ยังไม่มี${O.unit}`};
  if(sp<RX.MIN_SPEND) return {t:'none',l:'—',why:`ใช้เงินน้อยกว่า ${baht(RX.MIN_SPEND)} ในช่วงนี้ ยังตัดสินไม่ได้`};
  const v=objVal(o,t), ctr=dCtr(t);
  const H=a.h, ce=H?dCtr(H.e):NaN, cl=H?dCtr(H.l):NaN;
  if(Number.isFinite(v)&&Number.isFinite(bench)&&bench>0){
    if(O.roas ? v<=bench*RX.STOP_ROAS : v>=bench*RX.STOP_X)
      return {t:'stop',l:BNAME.stop,why:O.roas
        ?`ROAS ${x2(v)} ต่ำกว่าค่าเฉลี่ยกลุ่ม ${x2(bench)} เกินครึ่ง`
        :`${O.met} ${baht2(v)} แพงกว่าค่าเฉลี่ยกลุ่ม ${(v/bench).toFixed(1)} เท่า`};
  }
  if(Number.isFinite(ce)&&ce>0&&Number.isFinite(cl)&&cl<ce*(1-RX.CRE_DROP))
    return {t:'cre',l:BNAME.cre,why:`CTR ลดจาก ${pct2(ce)} เหลือ ${pct2(cl)} คนเริ่มเบื่อชิ้นงาน`};
  if(Number.isFinite(v)&&Number.isFinite(bench)&&bench>0&&Number.isFinite(ctr)&&Number.isFinite(chCtr)&&ctr>=chCtr){
    if(O.roas ? v<bench*RX.FIX_ROAS : v>=bench*RX.FIX_X)
      return {t:'fix',l:BNAME.fix,why:O.roas
        ?`คนคลิกดี (CTR ${pct2(ctr)}) แต่ ROAS ${x2(v)} ต่ำกว่าเฉลี่ยกลุ่ม ${x2(bench)}`
        :`คนคลิกดี (CTR ${pct2(ctr)}) แต่ ${O.met} ${baht2(v)} แพงกว่าเฉลี่ย ${(v/bench).toFixed(1)} เท่า`};
  }
  if(Number.isFinite(v)&&Number.isFinite(bench)&&bench>0){
    if(O.roas ? v>=bench*RX.UP_ROAS : v<=bench*RX.UP_X)
      return {t:'up',l:BNAME.up,why:O.roas
        ?`ROAS ${x2(v)} สูงกว่าค่าเฉลี่ยกลุ่ม ${(v/bench).toFixed(1)} เท่า`
        :`${O.met} ${baht2(v)} ถูกกว่าค่าเฉลี่ยกลุ่ม ${((1-v/bench)*100).toFixed(0)}%`};
  }
  return {t:'none',l:'—',why:'อยู่ในเกณฑ์ปกติของกลุ่มเป้าหมายเดียวกัน'};
}

/* ---------- แปลงไฟล์ของช่องทางเป็นโมเดลที่ทุกบล็อกใช้ร่วมกัน ---------- */
function v2Model(ch){
  const D2=DET[ch]; if(!D2) return null;
  const rows=dRows(ch); if(!rows.length) return {D2,empty:true};
  const top=dTop(ch,rows), tot=dAvg(top).tot, chCtr=dCtr(tot);
  const camps=dGroup(top,r=>r.c).map(c=>({name:c.k,t:c,o:objOf(ch,c.k)}));
  const leaves=[];
  camps.forEach(C=>{
    const inC=dKids(ch,rows.filter(r=>r.c===C.name));
    C.mids=[...new Set(inC.map(r=>r.g))].filter(x=>x);
    C.groups=dGroup(inC,r=>r.g);
    C.leaves=dGroup(inC,r=>r.g+'\u0000'+r.a).map(L=>{
      const my=inC.filter(r=>(r.g+'\u0000'+r.a)===L.k);
      const o={name:L.a||L.c||'(ไม่มีชื่อ)',g:L.g||'',t:L,o:C.o,camp:C,h:dHalves(my),i:leaves.length};
      leaves.push(o); return o;});
  });
  /* ค่าเฉลี่ยเทียบ ต้องคิดแยกตามเป้าหมาย และคิดจากผลรวมก่อนหาร
     (ค่าเฉลี่ยของอัตราส่วน ≠ อัตราส่วนของผลรวม) */
  const bench={};
  OBJORD.forEach(k=>{const L=leaves.filter(a=>a.o===k); if(!L.length) return;
    const t=dBlank(); L.forEach(a=>dAdd(t,a.t)); bench[k]=objVal(k,t);});
  leaves.forEach(a=>{a.b=v2Badge(a,bench[a.o],chCtr);});
  camps.forEach(C=>{C.b=C.leaves.reduce((m,a)=>BRANK[a.b.t]>BRANK[m?m.t:'none']?a.b:m,null)||{t:'none',l:'—',why:''};});
  return {ch,D2,rows,top,tot,chCtr,camps,leaves,bench,
          objs:OBJORD.filter(o=>camps.some(c=>c.o===o))};
}

/* ---------- ชิ้นส่วนเล็ก ---------- */
const ICO={money:'<path d="M2 5h12v8H2zM8 7.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3"/>',
  res:'<path d="M3 3h10v7H7l-3 3v-3H3z"/>',
  cost:'<path d="M3 3l3 3M3 3v3M3 3h3M13 13l-3-3M13 13v-3M13 13h-3M5 11l6-6"/>',
  roas:'<path d="M2 12l4-4 3 3 5-6M10 5h4v4"/>'};
function ico(k){return `<span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="var(--acc)" `+
  `stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]||ICO.money}</svg></span>`;}
/* เส้นจิ๋วในการ์ด — ไม่มีแกน ใช้ดูรูปร่างเท่านั้น จึงไม่ต้องมีตัวเลขกำกับ */
function spark(vals){
  const v=vals.filter(x=>Number.isFinite(x)); if(v.length<2) return '';
  const w=120,h=34,mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1;
  const pts=v.map((x,i)=>[i*(w/(v.length-1)),h-3-(x-mn)/r*(h-8)]);
  const p=pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),L=pts[pts.length-1];
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`+
    `<polyline points="0,${h} ${p} ${w},${h}" fill="var(--acc)" fill-opacity=".12" stroke="none"/>`+
    `<polyline points="${p}" fill="none" stroke="var(--acc)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`+
    `<circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.6" fill="var(--acc)"/></svg></div>`;
}
function v2card(i,l,v,d,ser){
  return `<div class="kpi"><div class="k-top">${ico(i)}<span class="k-l">${l}</span></div>`+
    `<div class="k-v num">${v}</div><div class="k-s num">${d||'&nbsp;'}</div>${ser?spark(ser):''}</div>`;
}

/* ---------- บล็อก 1: การ์ด 4 ใบ + % เทียบช่วงก่อนที่ยาวเท่ากัน ----------
   % มาจากข้อมูลระดับช่องทาง (ads_daily / fb_daily) ซึ่งมีย้อนหลังพอ
   ไฟล์แอดละเอียดมีแค่ 7 วัน เทียบช่วงก่อนไม่ได้ ถ้าไม่มีช่วงก่อน = ไม่แสดง % */
function v2Kpis(ch){
  const tail=PR?` เทียบ ${NN} วันก่อน`:'';
