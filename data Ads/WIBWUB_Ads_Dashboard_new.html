<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIBWUB Ads Dashboard</title>
<!--
  WIBWUB Ads Dashboard (v2, 19 ต.ค. 2569) — 3 หน้า: ภาพรวม / Shopee / TikTok (ใช้ช่วงวันที่ร่วมกัน)
  ข้อมูลไม่ฝังในไฟล์นี้ — หน้าเว็บอ่านจาก 2 ไฟล์ข้างๆ:
    ads_daily.json   = รายวัน (ยอดขายจริง + ยอดจาก Ads + ค่าโฆษณา) Shopee/TikTok — ใช้กับตัวเลือกช่วงวันที่
    ads_periods.json = รายเดือนจากไฟล์ export (ยอดรวม + รายชื่อแคมเปญ) — ใช้กับแนวโน้มรายเดือน/ตารางแคมเปญ
  งานตั้งเวลาให้แก้เฉพาะ 2 ไฟล์ JSON นี้ ห้ามแก้ตัวเลขใน HTML
  เปิดหน้าเฉพาะได้ด้วย #overview / #shopee / #tiktok ต่อท้าย URL
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --panel-2:#F9FAFB; --border:#E6E8EC; --border-2:#D9DCE2;
  --ink:#1A1D23; --ink-2:#4B5260; --muted:#7A8190; --grid:#EEF0F3;
  --shopee:#E8501F; --tiktok:#0A9690; --lazada:#1A52C4; --fb:#1877F2;
  --shopee-soft:#FDEEE8; --tiktok-soft:#E3F4F3; --lazada-soft:#E8EEFB; --fb-soft:#E8F1FE;
  --good:#1E8E3E; --bad:#C5221F; --warn-bg:#FFF7E6; --warn-bd:#F5D9A0; --warn-ink:#7A5200;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Thai',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* top bar (ซ่อนเมื่ออยู่ใน iframe ของ Dashboard หลัก) */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.topbar img{height:22px;display:block}
.topbar h1{font-size:15px;font-weight:700}
body.embedded .topbar{display:none}

/* sticky header: page tabs + range */
.head{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;padding:8px 20px 0;overflow-x:auto}
.tab{border:0;background:none;padding:9px 16px 10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab[data-v="shopee"].on{border-bottom-color:var(--shopee)}
.tab[data-v="lazada"].on{border-bottom-color:var(--lazada)}
.tab[data-v="tiktok"].on{border-bottom-color:var(--tiktok)}
.rangebar{padding:8px 20px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-top:1px solid var(--grid)}
.rangebar .dates{display:flex;align-items:center;gap:6px}
.rangebar input[type=date]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border-2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.asof{font-size:12px;color:var(--muted);margin-left:auto}

.main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.view{display:none}.view.on{display:block}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:700;color:var(--ink)}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.range-title{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.range-title b{color:var(--ink)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .sub2{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.kpi .delta{font-size:12px;margin-top:2px;color:var(--muted)}
.delta .up{color:var(--good)} .delta .dn{color:var(--bad)}
.kpi .split{margin-top:10px;padding-top:10px;border-top:1px solid var(--grid);display:grid;gap:3px;font-size:12.5px;color:var(--ink-2)}
.kpi .split div{display:flex;justify-content:space-between;gap:8px}
.view-shopee .kpi{border-top:3px solid var(--shopee)} .view-tiktok .kpi{border-top:3px solid var(--tiktok)}
.view-lazada .kpi{border-top:3px solid var(--lazada)}
.view-facebook .kpi{border-top:3px solid var(--fb)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.sh{background:var(--shopee)} .dot.tk{background:var(--tiktok)} .dot.lz{background:var(--lazada)}
.dot.fb{background:var(--fb)}
.dash{display:inline-block;width:16px;height:0;border-top:2px dashed var(--ink-2);margin-right:6px;vertical-align:3px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three>*{min-width:0}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.four>*{min-width:0}
/* กราฟรายสัปดาห์ 4 ใบของแท็บ Facebook — เตี้ยกว่ากราฟหลักเพราะวางเรียง 2x2 */
.wk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wk>*{min-width:0}
.wk .cwrap{height:200px}
.two>*{min-width:0}
.pcard{cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--border-2)}
.pcard.sh{border-top:3px solid var(--shopee)} .pcard.tk{border-top:3px solid var(--tiktok)} .pcard.lz{border-top:3px solid var(--lazada)}
.pcard.fb{border-top:3px solid var(--fb)}
.pcard-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px}
.pcard-h .go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.m .ml{font-size:12px;color:var(--muted)}
.m .mv{font-size:17px;font-weight:700}
.m .ms{font-size:12px;color:var(--ink-2)}
.mini-wrap{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.mini th{font-weight:600;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:8px;text-align:right;border-bottom:1px solid var(--grid)}
.mini tr.tot td{font-weight:700;border-bottom:none}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* charts */
.chart-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
.chart-h .t{font-weight:700;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--border-2)}
.seg button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
.cwrap{position:relative;height:280px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.data th{position:sticky;top:0;background:var(--panel-2);font-weight:600;color:var(--ink-2);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
table.data td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--grid)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th.grp{text-align:center}
table.data th.sh{box-shadow:inset 0 -2px 0 var(--shopee)} table.data th.tk{box-shadow:inset 0 -2px 0 var(--tiktok)} table.data th.lz{box-shadow:inset 0 -2px 0 var(--lazada)}
table.data th.fb{box-shadow:inset 0 -2px 0 var(--fb)}
table.data tr.accsum td{font-weight:700;background:var(--panel-2)}
table.data tr.tot td{font-weight:700;background:var(--panel-2);border-top:1px solid var(--border-2)}
table.data td.name{white-space:normal;min-width:220px;max-width:420px;text-align:left}
table.data tbody tr:hover td{background:#FAFBFC}
.muted{color:var(--muted)}
.more{margin-top:8px;font-size:12.5px;background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer}
select.sel{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--ink)}

.callout{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:12.5px}
.callout b{color:#5A3D00}
details.src{margin-top:16px;font-size:12px;color:var(--muted)}
details.src summary{cursor:pointer}
details.src pre{white-space:pre-wrap;font-family:inherit;margin-top:6px}
.err{margin:40px auto;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--ink-2)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}.three{grid-template-columns:minmax(0,1fr)}.four{grid-template-columns:minmax(0,1fr)}.wk{grid-template-columns:minmax(0,1fr)}}
@media (min-width:821px) and (max-width:1100px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .head{position:static}
  .tabs,.rangebar{padding-left:12px;padding-right:12px}.main{padding:14px 12px 32px}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:20px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .asof{margin-left:0;width:100%}
  .cwrap{height:240px}
  .legend{margin-left:0}
  .tab{padding:8px 12px 9px}
}
</style>
</head>
<body>

<div class="topbar">
  <img src="../logo-header.png" alt="WIBWUB">
  <h1>Ads Dashboard</h1>
</div>

<div class="head">
  <nav class="tabs" id="tabs">
    <button class="tab" data-v="overview">📊 ภาพรวม</button>
    <button class="tab" data-v="shopee"><i class="dot sh"></i>Shopee</button>
    <button class="tab" data-v="tiktok"><i class="dot tk"></i>TikTok</button>
    <button class="tab" data-v="lazada"><i class="dot lz"></i>Lazada</button>
    <button class="tab" data-v="facebook"><i class="dot fb"></i>Facebook</button>
  </nav>
  <div class="rangebar">
    <div class="dates">
      <input type="date" id="dFrom" aria-label="วันที่เริ่ม">
      <span class="muted">ถึง</span>
      <input type="date" id="dTo" aria-label="วันที่สิ้นสุด">
    </div>
    <div class="chips" id="presets">
      <button class="chip" data-p="7">7 วันล่าสุด</button>
      <button class="chip" data-p="14">14 วันล่าสุด</button>
      <button class="chip" data-p="30">30 วันล่าสุด</button>
      <button class="chip" data-p="thisMonth">เดือนนี้</button>
      <button class="chip" data-p="lastMonth">เดือนก่อน</button>
      <button class="chip" data-p="all">ทั้งหมด</button>
    </div>
    <span class="asof" id="asof"></span>
  </div>
</div>

<div class="main" id="main">
  <div class="err">กำลังโหลดข้อมูล…</div>
</div>

<script>
(function(){
'use strict';
if (window.self !== window.top) document.body.classList.add('embedded');

const CLOSED = { '2026-02-19':'ปิดร้านออนไลน์ — เอาท์ติ้งบริษัท', '2026-02-20':'ปิดร้านออนไลน์ — เอาท์ติ้งบริษัท' };
const C = { sh:'#E8501F', tk:'#0A9690', lz:'#1A52C4', fb:'#1877F2', ink:'#1A1D23', ink2:'#4B5260', muted:'#7A8190', grid:'#EEF0F3' };
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MKEYS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const VIEWS = ['overview','shopee','tiktok','lazada','facebook'];

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('th-TH',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht = v => '฿' + nf0.format(Math.round(v||0));
const bahtShort = v => { v=v||0; const a=Math.abs(v);
  if (a>=1e6) return '฿'+(v/1e6).toFixed(a>=1e7?1:2)+'M';
  if (a>=1e3) return '฿'+(v/1e3).toFixed(a>=1e5?0:1)+'K';
  return '฿'+nf0.format(Math.round(v)); };
const int = v => nf0.format(Math.round(v||0));
const pct = (v,d=1) => (Number.isFinite(v) ? (v*100).toFixed(d)+'%' : '–');
const x2 = v => (Number.isFinite(v) && v>0 ? v.toFixed(2)+'x' : '–');
const div = (a,b) => (b ? a/b : NaN);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmtISO(dt){ return dt.toISOString().slice(0,10); }
function addDays(s,n){ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return fmtISO(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/864e5)+1; }
function thDate(s, withYear){ const d=parseD(s); return d.getUTCDate()+' '+TH_M[d.getUTCMonth()]+(withYear?' '+(d.getUTCFullYear()+543):''); }
function thRange(a,b){
  const A=parseD(a),B=parseD(b), yA=A.getUTCFullYear()+543, yB=B.getUTCFullYear()+543;
  if (a===b) return thDate(a,true);
  if (yA===yB && A.getUTCMonth()===B.getUTCMonth()) return A.getUTCDate()+'–'+B.getUTCDate()+' '+TH_M[B.getUTCMonth()]+' '+yB;
  if (yA===yB) return thDate(a)+' – '+thDate(b)+' '+yB;
  return thDate(a,true)+' – '+thDate(b,true);
}
/* mode: undefined = สูงขึ้นดี, 'cost' = สูงขึ้นแย่, 'pt' = อัตราส่วนค่าโฆษณา (จุด, สูงขึ้นแย่) */
function deltaHtml(cur, prev, mode){
  if (typeof cur!=='number' || typeof prev!=='number' || !Number.isFinite(cur) || !Number.isFinite(prev) || prev===0)
    return '<span class="muted">ไม่มีช่วงก่อนหน้าให้เทียบ</span>';
  if (mode==='pt'){ const d=(cur-prev)*100; const cls = d>0?'dn':'up';
    return `<span class="${cls}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)} จุด</span> เทียบช่วงก่อน`; }
  const r=(cur-prev)/prev; let cls = r>=0?'up':'dn'; if (mode==='cost') cls = r>=0?'dn':'up';
  return `<span class="${cls}">${r>=0?'▲':'▼'} ${Math.abs(r*100).toFixed(1)}%</span> เทียบช่วงก่อน`;
}

/* ---------- state ---------- */
let DAILY=null, PERIODS=null, TKC=null, FEE=null, DAYS=[], MIN='', MAX='';
/* ── Facebook Ads ────────────────────────────────────────────────────────
   FB มาจาก data Ads/facebook/fb_daily.json (scripts/ads/fb_daily.py อ่าน
   data Ads/facebook/daily/FBD_*.csv) ชุดเดียวกับที่หน้า "การตลาด vs ยอดขาย"
   ใช้เป็น ads_fb · ห้ามพิมพ์ตัวเลข FB ลงหน้านี้ตรง ๆ และห้ามใช้ไฟล์ยอดรวม FB_*.csv
   ช่วงวันที่ของ FB ไม่เท่ากับ ads_daily.json (เริ่ม 1 ต.ค. 69) -> ต้องกรองด้วย
   วันที่ที่ FB มีจริงเสมอ ห้าม reindex ตาม DAYS ไม่งั้นจะได้ 0 ปลอม ๆ */
let FB=null;
/* ── ค่าธรรมเนียมแพลตฟอร์ม ───────────────────────────────────────────────
   อัตรามาจาก data Ads/platform_fee.json ไฟล์เดียวกับที่หน้า "การตลาด vs ยอดขาย" ใช้
   แก้อัตราที่ไฟล์นั้นที่เดียว ทั้งสองหน้าขยับตามเอง
   เขียนได้ 2 แบบ: ตัวเลขเดียว = คงที่ · [{from,rate}] = เปลี่ยนตามวันที่
   rate ที่มี prev:true คือเดือนที่ยอดยังไม่ปิด ตัวเลขยังขยับได้ */
const FEE_CH = [{k:'sh', n:'Shopee', c:'#E8501F'},
                {k:'tk', n:'TikTok', c:'#0A9690'},
                {k:'lz', n:'Lazada', c:'#1A52C4'}];
function feeRates(){ return (FEE && FEE.rates) || {}; }
function feeOn(k, d){
  const s = feeRates()[k];
  if (typeof s === 'number') return s;
  if (!Array.isArray(s) || !s.length) return 0;
  let r = 0;                       // ก่อนช่วงแรกสุด = ยังไม่รู้อัตรา ให้เป็น 0 ไม่ใช่เดา
  for (const x of s){ if (d >= x.from) r = x.rate; else break; }
  return r;
}
function feeProv(k, d){
  const s = feeRates()[k]; if (!Array.isArray(s)) return false;
  let p = false;
  for (const x of s){ if (d >= x.from) p = !!x.prov; else break; }
  return p;
}
function hasFee(){ return Object.keys(feeRates()).length > 0; }
const st = { view:'overview', from:'', to:'', preset:'thisMonth',
  ovMetric:'real', shMetric:'realads', tkMetric:'realads', lzMetric:'realads', monMetric:'spend',
  shMonth:'', tkMonth:'', tkCamp:'gmax', shAll:false, tkAll:false };
const charts = {};
let CUR=null, PREV=null;   // ผลรวมช่วงที่เลือก / ช่วงก่อนหน้า
let PREVA='', PREVB='';    // ขอบของช่วงก่อนหน้า — FB รวมแยกจาก sumRange จึงต้องรู้วันที่

/* ---------- aggregation ---------- */
function sumRange(a,b){
  const r = { n:0, days:[],
    sh:{real:0,orders:0,broad:0,direct:0,spend:0,adsOrders:0,adsDays:0,fee:0, t:{product:{b:0,d:0,s:0,o:0},search:{b:0,d:0,s:0,o:0},live:{b:0,d:0,s:0,o:0}}},
    tk:{real:0,orders:0,gmv:0,spend:0,adsOrders:0,fee:0, t:{product:{g:0,s:0,o:0},live:{g:0,s:0,o:0}}},
    lz:{real:0,orders:0,gmv:0,spend:0,adsOrders:0,imp:0,clicks:0,days:0,fee:0} };
  for (const d of DAYS){ if (d<a || d>b) continue; const v=DAILY.days[d]; r.n++; r.days.push(d);
    r.sh.real+=v.sh_real.gmv; r.sh.orders+=v.sh_real.orders;
    // ค่าโฆษณา Shopee ย้อนได้แค่ ~185 วัน (หน้าต่างกลิ้ง) วันเก่ากว่านั้นไม่มีคีย์ sh_ads
    // ให้ข้ามและนับ adsDays ไว้เพื่อขึ้นป้ายเตือน — ห้ามนับเป็น 0 เพราะจะเพี้ยนทั้ง ROAS และ %
    if (v.sh_ads){ r.sh.adsDays++;
      for (const k of ['product','search','live']){ const x=v.sh_ads[k]||{}; const t=r.sh.t[k];
        t.b+=x.gmv_broad||0; t.d+=x.gmv_direct||0; t.s+=x.spend||0; t.o+=x.orders||0;
        r.sh.broad+=x.gmv_broad||0; r.sh.direct+=x.gmv_direct||0; r.sh.spend+=x.spend||0; r.sh.adsOrders+=x.orders||0; } }
    r.sh.fee += (v.sh_real.gmv||0)*feeOn('sh',d);
    r.tk.fee += (v.tk_real.gmv||0)*feeOn('tk',d);
    r.tk.real+=v.tk_real.gmv; r.tk.orders+=v.tk_real.orders;
    for (const k of ['product','live']){ const x=v.tk_ads[k]||{}; const t=r.tk.t[k];
      t.g+=x.gmv||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.tk.gmv+=x.gmv||0; r.tk.spend+=x.spend||0; r.tk.adsOrders+=x.orders||0; }
    // Lazada เริ่มเก็บ 1 ก.ย. 2026 — วันก่อนหน้าไม่มีคีย์ ให้ข้าม ไม่นับเป็น 0
    if (v.lz_real && v.lz_ads){ const L=v.lz_ads; r.lz.days++;
      r.lz.real+=v.lz_real.gmv||0; r.lz.orders+=v.lz_real.orders||0;
      r.lz.gmv+=L.revenue||0; r.lz.spend+=L.spend||0; r.lz.adsOrders+=L.orders||0;
      r.lz.imp+=L.imp||0; r.lz.clicks+=L.clicks||0;
      r.lz.fee += (v.lz_real.gmv||0)*feeOn('lz',d); }
  }
  r.all = { real:r.sh.real+r.tk.real+r.lz.real, spend:r.sh.spend+r.tk.spend+r.lz.spend,
            ads:r.sh.broad+r.tk.gmv+r.lz.gmv, orders:r.sh.orders+r.tk.orders+r.lz.orders,
            fee:r.sh.fee+r.tk.fee+r.lz.fee };
  /* net = ยอดขายจริงหลังหักค่าธรรมเนียมแพลตฟอร์ม (ยังไม่หักค่าโฆษณา)
     cost = ต้นทุนที่จ่ายให้แพลตฟอร์มทั้งหมด = ค่าโฆษณา + ค่าธรรมเนียม */
  ['sh','tk','lz','all'].forEach(k=>{ const o=r[k];
    o.net  = o.real - (o.fee||0);
    o.cost = (o.spend||0) + (o.fee||0); });
  r.feeDays = r.days.filter(d=>feeOn('sh',d)>0).length;
  r.feeProv = r.days.some(d=>FEE_CH.some(c=>feeProv(c.k,d)));
  return r;
}
function fbOn(){ return !!(FB && FB.days && Object.keys(FB.days).length); }
function fbDays(a,b){ return fbOn() ? Object.keys(FB.days).filter(d=>d>=a&&d<=b).sort() : []; }
/* รวมอาเรย์รายวัน -> object อ่านด้วยชื่อคีย์ (ลำดับอยู่ใน FB.keys / FB.camp_keys) */
function fbSum(src, dates, keys){
  const o={}; keys.forEach(k=>o[k]=0);
  dates.forEach(d=>{ const a=src[d]; if(a) keys.forEach((k,i)=>o[k]+=a[i]); });
  return o;
}
function fbTot(a,b){ return fbSum(FB.days, fbDays(a,b), FB.keys); }
function fbAcc(key,a,b){ return fbSum(FB.acc_days[key]||{}, fbDays(a,b), FB.keys); }
/* แคมเปญเดียว -> null ถ้าไม่มีวันไหนอยู่ในช่วงที่เลือก (ห้ามคืน 0 จะโชว์แถวเปล่า) */
function fbCamp(c,a,b){
  const ds=Object.keys(c.dd||{}).filter(d=>d>=a&&d<=b);
  if(!ds.length) return null;
  const o=fbSum(c.dd, ds, FB.camp_keys); o._n=ds.length; return o;
}
const fbSpend = (a,b) => fbOn() ? fbTot(a,b).spend : 0;
const baht2 = v => '฿' + nf2.format(v||0);
const pct2 = v => (Number.isFinite(v) ? (v).toFixed(2)+'%' : '–');

function dayVals(d){ const v=DAILY.days[d], S=v.sh_ads||{}, T=v.tk_ads, LR=v.lz_real, LA=v.lz_ads;
  const g=(o,k,f)=>((o[k]||{})[f]||0);
  return { shR:v.sh_real.gmv, shO:v.sh_real.orders, hasShAds:!!v.sh_ads,
    shB:g(S,'product','gmv_broad')+g(S,'search','gmv_broad')+g(S,'live','gmv_broad'),
    shD:g(S,'product','gmv_direct')+g(S,'search','gmv_direct')+g(S,'live','gmv_direct'),
    shS:g(S,'product','spend')+g(S,'search','spend')+g(S,'live','spend'),
    shSp:g(S,'product','spend'), shSs:g(S,'search','spend'), shSl:g(S,'live','spend'),
    tkR:v.tk_real.gmv, tkO:v.tk_real.orders,
    tkG:g(T,'product','gmv')+g(T,'live','gmv'), tkS:g(T,'product','spend')+g(T,'live','spend'),
    tkSp:g(T,'product','spend'), tkSl:g(T,'live','spend'), tkGp:g(T,'product','gmv'), tkGl:g(T,'live','gmv'),
    hasLz:!!(LR&&LA),
    lzR:LR?LR.gmv:null, lzO:LR?LR.orders:null,
    lzG:LA?LA.revenue:null, lzS:LA?LA.spend:null, lzAO:LA?LA.orders:null, lzI:LA?LA.imp:null, lzC:LA?LA.clicks:null };
}

/* ---------- presets ---------- */
function presetRange(p){
  if (p==='all') return [MIN,MAX];
  if (/^\d+$/.test(p)){ const a=addDays(MAX,-(+p-1)); return [a<MIN?MIN:a, MAX]; }
  const m = MAX.slice(0,7);
  if (p==='thisMonth'){ const a=m+'-01'; return [a<MIN?MIN:a, MAX]; }
  if (p==='lastMonth'){ const d=parseD(m+'-01'); d.setUTCMonth(d.getUTCMonth()-1); const a=fmtISO(d), b=addDays(m+'-01',-1);
    return [a<MIN?MIN:a, b>MAX?MAX:b]; }
  return [MIN,MAX];
}
function save(){ try{ localStorage.setItem('wibwub_ads_state', JSON.stringify({p:st.preset,a:st.from,b:st.to,v:st.view})); }catch(e){} }
function setRange(a,b,preset){
  if (a>b) [a,b]=[b,a];
  if (a<MIN) a=MIN; if (b>MAX) b=MAX; if (a>MAX) a=MAX; if (b<MIN) b=MIN;
  st.from=a; st.to=b; st.preset=preset||'';
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===st.preset));
  save(); recompute(); renderView();
}
function setView(v, fromHash){
  if (!VIEWS.includes(v)) v='overview';
  st.view=v;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on', el.id==='view-'+v));
  if (!fromHash && location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  save(); renderView();
  window.scrollTo(0,0);
}

function recompute(){
  CUR = sumRange(st.from, st.to);
  const n = daysBetween(st.from, st.to), pa = addDays(st.from,-n), pb = addDays(st.from,-1);
  PREV = (pa>=MIN) ? sumRange(pa,pb) : null;
  PREVA = pa; PREVB = pb;
  const t = `ช่วงที่เลือก: <b>${thRange(st.from, st.to)}</b> (${n} วัน)` + (PREV?` <span class="muted">· เทียบกับ ${thRange(pa,pb)}</span>`:'');
  document.querySelectorAll('[data-rt]').forEach(e=>e.innerHTML=t);
  document.querySelectorAll('[data-rs]').forEach(e=>e.textContent=thRange(st.from, st.to));
  coverageNote(n);
}
/* วันที่ไม่มีค่าโฆษณา Shopee (เก่ากว่าหน้าต่าง ~185 วันของ Shopee Ads) ต้องบอกให้ชัด
   ไม่งั้นจะเข้าใจผิดว่าเดือนนั้นค่าโฆษณาถูกลง ทั้งที่จริงคือไม่มีข้อมูล */
function coverageNote(n){
  const el = document.querySelectorAll('[data-cov]'), miss = CUR.n - CUR.sh.adsDays;
  if (miss <= 0){ el.forEach(e=>{ e.hidden=true; e.innerHTML=''; }); return; }
  const gap = CUR.days.filter(d=>!DAILY.days[d].sh_ads);
  const span = gap.length===1 ? thDate(gap[0],1) : thDate(gap[0],1)+' – '+thDate(gap[gap.length-1],1);
  el.forEach(e=>{ e.hidden=false; e.innerHTML =
    `<b>ค่าโฆษณา Shopee ไม่ครบช่วงนี้:</b> ขาด ${int(miss)} จาก ${int(CUR.n)} วัน (${span}) — ` +
    `ระบบ Shopee ย้อนดูค่าโฆษณารายวันได้แค่ประมาณ 185 วัน วันที่ขาด<b>ไม่ถูกนับเป็น 0</b> ` +
    `ค่าโฆษณารวม · % ต่อยอดขาย · ROAS ของ Shopee จึงคิดจาก ${int(CUR.sh.adsDays)} วันที่มีข้อมูลเท่านั้น ` +
    `ส่วนยอดขายจริงและออเดอร์ครบทุกวัน` + monthFallback(gap); });
}
/* เดือนที่ไม่มีรายวันเลย ยังมี "ยอดรวมทั้งเดือน" จากไฟล์ export อยู่ใน PERIODS
   ถ้าช่วงที่เลือกคลุมเดือนนั้นครบทั้งเดือน ก็บอกยอดรวมไปด้วย จะได้ไม่ต้องเดา
   แต่ถ้าคลุมไม่ครบเดือนห้ามเอามาใช้ เพราะเป็นยอดทั้งเดือน หารรายวันไม่ได้ */
function monthFallback(gap){
  const by = {}; gap.forEach(d=>{ (by[d.slice(0,7)] = by[d.slice(0,7)] || []).push(d); });
  const out = [];
  for (const m of Object.keys(by).sort()){
    const inM = new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate();
    const pm = PERIODS.months[MKEYS[+m.slice(5,7)-1]];
    if (by[m].length !== inM || !pm || !pm.shopee || !pm.shopee.spend) continue;  // ไม่ครบเดือน = ใช้ไม่ได้
    if (st.from > m+'-01' || st.to < m+'-'+String(inM).padStart(2,'0')) continue;
    out.push(`${TH_MF[+m.slice(5,7)-1]} ${baht(pm.shopee.spend)}`);
  }
  return out.length ? `<br><b>มีเฉพาะยอดรวมทั้งเดือน</b> (จากไฟล์รายงานรายเดือน ไม่ใช่รายวัน): ` +
    out.join(' · ') + ` — ตัวเลขนี้ไม่ถูกรวมในการ์ดด้านบน ดูได้ที่กราฟ "แนวโน้มรายเดือน"` : '';
}

}

const _lzMonCache={};
function lzMonth(mkey){
  if (mkey in _lzMonCache) return _lzMonCache[mkey];
  const mm=String(MKEYS.indexOf(mkey)+1).padStart(2,'0');
  let spend=0, revenue=0, orders=0, days=0, last='';
  for (const d of DAYS){ if (d.slice(5,7)!==mm) continue; const v=DAILY.days[d]; if (!v.lz_ads) continue;

  return _lzMonCache[mkey] = days ? {spend,revenue,orders,days,last} : null;
}

      <td>${int(t.t.product.s)}</td><td>${int(t.t.live.s)}</td><td>${int(t.spend)}</td><td>${pct(div(t.spend,t.real))}</td><td>${x2(div(t.real,t.spend))}</td></tr></tbody>`;

function renderTkCamp(){
  campMonthSelect('tkMonth','tkMonth', ()=>{ st.tkAll=false; renderTkCamp(); });
  segOn('segTkCamp', st.tkCamp);
  const M=PERIODS.months[st.tkMonth], tab=st.tkCamp; let head, rows, tot='', list, empty='ไม่มีข้อมูลแคมเปญในเดือนนี้';
  if (tab==='biz'){
    const src=M.tiktok.bizAds; list=((src&&src.campaigns)||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head='<tr><th>แคมเปญ</th><th>ค่าโฆษณา</th><th>Impressions</th><th>คลิก</th><th>CTR</th><th>CPM</th></tr>';
    rows=list.map(c=>`<tr><td class="name">${esc(c.name)}</td><td>${baht(c.spend)}</td><td>${int(c.imp)}</td><td>${int(c.clicks)}</td><td>${c.imp?(c.clicks/c.imp*100).toFixed(2)+'%':'–'}</td><td>${c.imp?nf2.format(c.spend/c.imp*1000):'–'}</td></tr>`);
    const T=src&&src.total; if (T) tot=`<tr class="tot"><td>รวมทั้งเดือน</td><td>${baht(T.spend)}</td><td>${int(T.imp)}</td><td>${int(T.clicks)}</td><td>${T.imp?(T.clicks/T.imp*100).toFixed(2)+'%':'–'}</td><td>${T.imp?nf2.format(T.spend/T.imp*1000):'–'}</td></tr>`;
  } else if (TKC && TKC.months && TKC.months[st.tkMonth]){
    // แคมเปญย่อยจาก API (ads_tk_campaigns.json) — ครบทุกแคมเปญ รวมแคมเปญที่ถูกลบแล้ว
    const X=TKC.months[st.tkMonth], key = tab==='gmax' ? 'product' : 'live';
    list=(X[key]||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head='<tr><th>'+(tab==='gmax'?'แคมเปญ':'ไลฟ์ / แคมเปญ')+'</th><th>ค่าโฆษณา</th><th>สัดส่วน</th><th>ยอดขาย (Ads)</th><th>ROAS</th><th>ออเดอร์</th><th>CPA</th></tr>';
    const T=list.reduce((a,c)=>(a.spend+=c.spend||0,a.revenue+=c.revenue||0,a.orders+=c.orders||0,a),{spend:0,revenue:0,orders:0});
    rows=list.map(c=>`<tr><td class="name">${esc(c.name)}</td><td>${baht(c.spend)}</td><td>${pct(div(c.spend,T.spend),1)}</td><td>${baht(c.revenue)}</td><td>${x2(div(c.revenue,c.spend))}</td><td>${int(c.orders)}</td><td>${c.orders&&c.spend?nf2.format(c.spend/c.orders):'–'}</td></tr>`);
    tot=`<tr class="tot"><td>รวม ${thRange(X.from,X.to)}</td><td>${baht(T.spend)}</td><td>100%</td><td>${baht(T.revenue)}</td><td>${x2(div(T.revenue,T.spend))}</td><td>${int(T.orders)}</td><td>${T.orders?nf2.format(T.spend/T.orders):'–'}</td></tr>`;
  } else {
    const src = tab==='gmax' ? M.tiktok.gmvMax : M.tiktok.gmvLive;
    list=((src&&(tab==='gmax'?src.campaigns:src.sessions))||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head='<tr><th>'+(tab==='gmax'?'แคมเปญ':'ไลฟ์ / แคมเปญ')+'</th><th>ค่าโฆษณา</th><th>ยอดขาย (Ads)</th><th>ROAS</th><th>ออเดอร์</th><th>CPA</th></tr>';
    rows=list.map(c=>`<tr><td class="name">${esc(c.name)}</td><td>${baht(c.spend)}</td><td>${baht(c.revenue)}</td><td>${x2(c.roi||div(c.revenue,c.spend))}</td><td>${int(c.orders)}</td><td>${c.orders?nf2.format(c.cpa||c.spend/c.orders):'–'}</td></tr>`);
    const T=src&&src.total; if (T) tot=`<tr class="tot"><td>รวมทั้งเดือน</td><td>${baht(T.spend)}</td><td>${baht(T.revenue)}</td><td>${x2(div(T.revenue,T.spend))}</td><td>${int(T.orders)}</td><td>${T.orders?nf2.format(T.spend/T.orders):'–'}</td></tr>`;
    if (tab==='gmax' && !list.length && T && T.spend) empty='เดือนนี้ไฟล์ export มีเฉพาะยอดรวม ไม่มีรายแคมเปญ';
  }
  campTable('tTkCamp','tkMore','tkAll', head, rows, tot, empty);
}

/* ═════════ Facebook ═════════
   ย้ายมาจาก data Ads/WIBWUB_Ads_Dashboard.html (commit feaf8db) ซึ่งไม่ได้ถูกฝัง
   ที่ไหน จึงไม่เคยขึ้นให้ใครเห็น · ที่นี่อ่าน fb_daily.json ด้วย fetch และใช้
   ตัวเลือกช่วงวันที่ร่วมกับแท็บอื่น (ของเดิมเลือกเป็น "เดือน") */
function fbEmpty(msg){
  document.getElementById('fbKpis').innerHTML =
    `<div class="kpi"><div class="lab">ไม่มีข้อมูล Facebook Ads</div><div class="sub2 muted">${msg}</div></div>`;
  ['fbBody','tFbCamp','fbNotes'].forEach(id=>{ const e=document.getElementById(id); if(e) e.innerHTML=''; });
  document.getElementById('fbCampSub').textContent='';
  document.getElementById('tFbAcc').innerHTML='';
  document.getElementById('fbAccNote').innerHTML='';
  ['fb_spend','fb_cpm','fb_ctr','fb_cpc'].forEach(k=>{ if(charts[k]){ charts[k].destroy(); delete charts[k]; } });
}
function renderFb(){
  const cov=document.getElementById('fbCov');
  if (!fbOn()){ cov.hidden=true;
    fbEmpty('ยังไม่มีไฟล์ data Ads/facebook/fb_daily.json — รัน <code>python3 scripts/ads/fb_daily.py</code> หลังวางไฟล์ FBD_*.csv ไว้ใน data Ads/facebook/daily/');
    return; }
  const dates=fbDays(st.from, st.to);
  if (!dates.length){ cov.hidden=true;
    fbEmpty('ช่วงที่เลือกไม่มีข้อมูล — ไฟล์ Facebook ครอบคลุม '+thDate(FB.from,1)+' – '+thDate(FB.to,1)+' เท่านั้น');
    return; }
  /* ช่วงที่เลือกกว้างกว่าที่ไฟล์ FB มี ต้องบอก ไม่งั้นจะอ่านว่าค่าโฆษณาลดลง */
  const miss = daysBetween(st.from, st.to) - dates.length;
  cov.hidden = miss<=0;
  if (miss>0) cov.innerHTML = `<b>ข้อมูล Facebook ไม่ครบช่วงนี้:</b> มี ${int(dates.length)} จาก `+
    `${int(daysBetween(st.from,st.to))} วัน (${thDate(dates[0],1)} – ${thDate(dates[dates.length-1],1)}) — `+
    `ไฟล์ FBD_*.csv ครอบคลุม ${thDate(FB.from,1)} – ${thDate(FB.to,1)} วันที่ขาด<b>ไม่ถูกนับเป็น 0</b>`;

  const T=fbSum(FB.days, dates, FB.keys);
  const pd = PREV ? fbDays(PREVA, PREVB) : [];
  const Pv = pd.length ? fbSum(FB.days, pd, FB.keys) : null;
  const rev = (T.omni_val||0) + (T.pval||0);
  const cpm = v => v.imp ? v.spend/v.imp*1000 : NaN;
  const ctr = v => v.imp ? v.clicks/v.imp*100 : NaN;
  const cpc = v => v.clicks ? v.spend/v.clicks : NaN;
  document.getElementById('fbKpis').innerHTML = [
    /* ทศนิยม 2 ตำแหน่ง เพื่อเทียบกับยอดรวมในไฟล์ CSV ได้ตรงหลักสตางค์ */
    { lab:'ค่าโฆษณา', val:baht2(T.spend), sub:'อิมเพรสชัน '+int(T.imp)+' · คลิก '+int(T.clicks),
      d:deltaHtml(T.spend, Pv&&Pv.spend,'cost') },
    { lab:'แชท', val:int(T.msg), sub:'การสนทนาที่เริ่มขึ้น · รวมทุกบัญชี', d:deltaHtml(T.msg, Pv&&Pv.msg) },
    { lab:'ค่าใช้จ่ายต่อแชท', val:T.msg?baht2(T.spend/T.msg):'–', sub:'ค่าโฆษณารวม ÷ แชทรวม',
      d:deltaHtml(div(T.spend,T.msg), Pv&&div(Pv.spend,Pv.msg),'cost') },
    { lab:'ยอดซื้อ', val:int(T.purch+T.omni),
      sub:'บนเพจ '+int(T.purch)+' · CPAS ที่ Shopee '+int(T.omni)+(T.lead?' · lead '+int(T.lead):''),
      d:deltaHtml(T.purch+T.omni, Pv&&(Pv.purch+Pv.omni)) },
    /* ROAS ที่ถูกต้องคือ Σมูลค่าการซื้อ ÷ Σค่าโฆษณา — ไฟล์เก่า (ก่อน 28 ต.ค. 69)
       ไม่มีคอลัมน์มูลค่า จึงต้องขึ้นว่าไม่มีในไฟล์ ห้ามเอา ROAS รายวันมาเฉลี่ยแทน */
    { lab:'มูลค่าการซื้อ', val:rev?baht(rev):'<span class="muted">ไม่มีในไฟล์</span>',
      sub:rev?('ROAS '+x2(div(rev,T.spend))+' · CPAS '+baht(T.omni_val||0)+' · บนเพจ '+baht(T.pval||0))
             :'ต้อง export ใหม่ให้มีคอลัมน์มูลค่าการซื้อ',
      d:rev?deltaHtml(rev, Pv&&(Pv.omni_val+Pv.pval)):'' },
  ].map(kpiTile).join('');

  /* ── ตารางแยกบัญชี: 1 แถวต่อ (บัญชี × เป้าหมาย) + แถวรวมของบัญชี ───────── */
  const rows=[]; let cpasNote=false, noGoalNote=false, msgNote=false;
  FB.accounts.forEach(acc=>{
    const mine=FB.camps.filter(c=>c.acc===acc.key).map(c=>({c,s:fbCamp(c,st.from,st.to)})).filter(x=>x.s);
    if (!mine.length) return;
    const byGoal={};
    mine.forEach(({c,s})=>{
      const g=byGoal[c.goal]||(byGoal[c.goal]={label:c.goal_label,roas:[],n:0});
      FB.camp_keys.forEach(k=>g[k]=(g[k]||0)+s[k]);
      /* เก็บเฉพาะ ROAS ที่มาจาก "เฉลี่ยรายวัน" ไว้เป็นทางถอย — เอา ROAS ถ่วงน้ำหนัก
         ของแต่ละแคมเปญมาเฉลี่ยกันไม่ได้ ต้องบวกมูลค่ากับค่าโฆษณาก่อนแล้วค่อยหาร */
      if (c.roas!=null && c.roas_src!=='value') g.roas.push(c.roas);
      g.n++;
    });
    const gs=Object.entries(byGoal).sort((a,b)=>b[1].spend-a[1].spend);
    gs.forEach(([gk,g])=>{
      const gi=(FB.goals||{})[gk]||{};
      if (gk==='omni') cpasNote=true;
      if (gk==='none') noGoalNote=true;
      if (gk==='msg') msgNote=true;
      /* ROAS: ไฟล์ให้มาเป็นอัตราส่วนรายวัน ไม่มีมูลค่าการซื้อให้ถ่วงน้ำหนักด้วยค่าโฆษณา
         -> โชว์ได้แค่ค่าเฉลี่ยของแคมเปญที่มีค่า · AD3 (CPAS) ไม่มีคอลัมน์นี้เลย */
      const gr = (g.omni_val||0) + (g.pval||0);
      const roas = gr ? x2(div(gr, g.spend))
                 : g.roas.length ? (g.roas.reduce((a,b)=>a+b,0)/g.roas.length).toFixed(2)+'x'
                 : '<span class="muted">ไม่มีในไฟล์</span>';
      rows.push(`<tr><td>${esc(acc.label)}</td>
        <td style="text-align:left">${esc(g.label)}${gk==='none'?'':' <span class="muted">· '+esc(gi.res||'ผลลัพธ์')+'</span>'}</td>
        <td>${baht(g.spend)}</td>
        <td>${gk==='none'?'<span class="muted">–</span>':int(g.res)}</td>
        <td>${g.res?baht2(g.spend/g.res):'<span class="muted">–</span>'}</td>
        <td>${roas}</td><td>${int(g.imp)}</td>
        <td>${pct2(ctr(g))}</td><td>${g.clicks?baht2(cpc(g)):'–'}</td>
        <td><span class="muted">–</span></td></tr>`);
    });
    /* แถวรวมของบัญชี — ความถี่โชว์ที่แถวนี้แถวเดียว เพราะ reach บวกข้ามวัน/ข้ามแคมเปญ
       ไม่ได้ (คนเดิมถูกนับซ้ำ) ค่านี้คือ "ความถี่เฉลี่ยรายวัน" = Σอิมเพรสชัน ÷ Σreach รายวัน */
    const A=fbAcc(acc.key, st.from, st.to);
    rows.push(`<tr class="accsum"><td>${esc(acc.label)} รวม</td>
      <td style="text-align:left" class="muted">${gs.length} เป้าหมาย · ${mine.length} แคมเปญ</td>
      <td>${baht2(A.spend)}</td><td></td><td></td>
      <td>${((A.omni_val||0)+(A.pval||0)) ? x2(div((A.omni_val||0)+(A.pval||0), A.spend)) : ''}</td>
      <td>${int(A.imp)}</td>
      <td>${pct2(ctr(A))}</td><td>${A.clicks?baht2(cpc(A)):'–'}</td>
      <td>${A.reach_d?(A.imp/A.reach_d).toFixed(2):'–'}</td></tr>`);
  });
  rows.push(`<tr class="tot"><td>รวมทุกบัญชี</td><td style="text-align:left"></td>
    <td>${baht2(T.spend)}</td><td></td><td></td>
    <td>${rev ? x2(div(rev, T.spend)) : ''}</td><td>${int(T.imp)}</td>
    <td>${pct2(ctr(T))}</td><td>${T.clicks?baht2(cpc(T)):'–'}</td>
    <td>${T.reach_d?(T.imp/T.reach_d).toFixed(2):'–'}</td></tr>`);
  document.getElementById('tFbAcc').innerHTML = `
    <thead><tr><th>บัญชี</th><th style="text-align:left">เป้าหมาย</th><th>ค่าโฆษณา</th><th>ผลลัพธ์</th>
      <th>ต้นทุน/ผลลัพธ์</th><th>ROAS</th><th>อิมเพรสชัน</th><th>CTR</th><th>CPC</th>
      <th>ความถี่ (เฉลี่ย/วัน)</th></tr></thead><tbody>${rows.join('')}</tbody>`;

  const notes=['<b>ความถี่</b> โชว์เฉพาะแถวรวมของบัญชี เพราะ reach บวกข้ามวันไม่ได้ (คนเดิมถูกนับซ้ำ) '+
               'ค่าที่เห็นคือ <b>ความถี่เฉลี่ยรายวัน</b> = Σอิมเพรสชัน ÷ Σreach รายวัน จึงไม่อยู่ในกราฟรายสัปดาห์'];
  if (msgNote) notes.push('<b>ROAS ของบัญชีที่ยิงเพื่อทักแชท</b> (WibWub AD 1 / AD 1) นับเฉพาะยอดที่ '+
    'Facebook ตามรอยได้เอง <b>ไม่รวมยอดที่ปิดการขายกันในแชทแล้วไปลงที่ Shipnity</b> '+

  if (cpasNote) notes.push('<b>AD3 เป็น CPAS</b> — ยอดซื้อเกิดที่ Shopee ไม่ใช่ที่เพจ ห้ามเอาไปเทียบกับยอดช่องทาง Facebook ใน Shipnity');

      'มูลค่ามาจากคอลัมน์ “ค่าคอนเวอร์ชั่นการซื้อสำหรับรายการที่แชร์” (CPAS) และ “ค่าคอนเวอร์ชั่นการซื้อ” (บนเพจ) '+
      '· แคมเปญที่ยังไม่มีมูลค่าในไฟล์จะถอยไปใช้ค่าเฉลี่ย ROAS รายวันแทน'
    : '<b>ROAS</b> ไฟล์ชุดนี้ยังไม่มีคอลัมน์มูลค่าการซื้อ (เพิ่มใน URL ตอน 28 ต.ค. 69) '+
      'ค่าที่เห็นจึงเป็นค่าเฉลี่ยของ ROAS รายวันซึ่งถ่วงน้ำหนักไม่ได้ · ต้อง export ใหม่จึงจะได้ตัวเลขที่ถูก');
  if (noGoalNote) notes.push('แคมเปญที่ขึ้น “ไม่มีผลลัพธ์ในรายงาน” คือแคมเปญที่คอลัมน์ “ตัวระบุผลลัพธ์” ว่างทุกวัน '+
             '<b>และ</b>ไม่มีการซื้อสินค้าที่แชร์ในไฟล์ — มีค่าโฆษณาแต่ไม่มีผลลัพธ์ให้นับจริง ๆ '+
             '(แคมเปญ CPAS ที่ตัวระบุว่างแต่มีการซื้อ ถูกนับเป็น “ยอดขาย CPAS” ให้แล้ว)');
  document.getElementById('fbAccNote').innerHTML = notes.map(n=>'• '+n).join('<br>');
  document.getElementById('fbNotes').innerHTML =
    '<b>ที่มาของตัวเลข:</b> ไฟล์ <code>data Ads/facebook/daily/FBD_*.csv</code> '+FB.accounts.length+' บัญชี '+
    '→ <code>scripts/ads/fb_daily.py</code> → <code>facebook/fb_daily.json</code> '+
    '(สร้างเมื่อ '+esc(String(FB.generated||'').slice(0,16).replace('T',' '))+') ชุดเดียวกับที่หน้า '+
    '<b>“การตลาด vs ยอดขาย”</b> ใช้เป็นค่าโฆษณา Facebook รายวัน — ตัวเลข 2 หน้าจึงตรงกันโดยโครงสร้าง '+
    '<br><b>คลิก</b> ไม่มีคอลัมน์นับในรายงาน ถอดจาก CTR(ทั้งหมด) ÷ 100 × อิมเพรสชัน (ตรวจแล้วเป็นจำนวนเต็มพอดีทุกแถว)';

  /* ── ตารางแคมเปญ ───────────────────────────────────────────────────────── */
  const cr=FB.camps.map(c=>({c,s:fbCamp(c,st.from,st.to)})).filter(x=>x.s).sort((a,b)=>b.s.spend-a.s.spend);
  document.getElementById('fbCampSub').textContent = cr.length+' แคมเปญที่มียอดในช่วงนี้';
  document.getElementById('tFbCamp').innerHTML = `
    <thead><tr><th>แคมเปญ</th><th>บัญชี</th><th style="text-align:left">เป้าหมาย</th><th>ค่าโฆษณา</th>
      <th>ผลลัพธ์</th><th>ต้นทุน/ผลลัพธ์</th><th>อิมเพรสชัน</th><th>CTR</th><th>CPC</th><th>สถานะ</th></tr></thead>
    <tbody>${cr.map(({c,s})=>{
      const accL=(FB.accounts.find(a=>a.key===c.acc)||{}).label||c.acc;
      return `<tr><td class="name">${esc(c.name)}</td><td>${esc(accL)}</td>
        <td style="text-align:left">${esc(c.goal_label)}</td><td>${baht(s.spend)}</td>
        <td>${c.goal==='none'?'<span class="muted">–</span>':int(s.res)}</td>
        <td>${s.res?baht2(s.spend/s.res):'<span class="muted">–</span>'}</td>
        <td>${int(s.imp)}</td><td>${pct2(ctr(s))}</td><td>${s.clicks?baht2(cpc(s)):'–'}</td>
        <td class="muted">${esc(c.deliv)}</td></tr>`; }).join('')}</tbody>`;

  fbCharts(dates);

/* สัปดาห์เริ่มวันจันทร์ · อัตราส่วนคิดจากผลรวมของสัปดาห์เสมอ ไม่ใช่เฉลี่ยค่ารายวัน
   (ค่าเฉลี่ยของอัตราส่วนไม่เท่ากับอัตราส่วนของผลรวม) */
function fbWeeks(dates){
  const wk=new Map();
  dates.forEach(d=>{ const dt=parseD(d), mon=addDays(d, -((dt.getUTCDay()+6)%7));
    if(!wk.has(mon)) wk.set(mon,[]); wk.get(mon).push(d); });
  return [...wk.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([,ds])=>{
    const s=fbSum(FB.days, ds, FB.keys), f=x=>x.slice(8,10)+'/'+x.slice(5,7);
    return {label:f(ds[0])+'–'+f(ds[ds.length-1]), days:ds.length, ...s,
            cpm:s.imp?s.spend/s.imp*1000:0, ctr:s.imp?s.clicks/s.imp*100:0, cpc:s.clicks?s.spend/s.clicks:0};
  });
}
function fbCharts(dates){
  const w=fbWeeks(dates), labels=w.map(x=>x.label+(x.days<7?' *':''));
  const mk=(key,canvasId,type,data,color,fmt)=>{
    const o=baseOpts(fmt);
    const ds=[{label:'', data, borderColor:color, backgroundColor:type==='bar'?color:'transparent',
               borderWidth:2, borderRadius:4, pointRadius:labels.length>20?0:3, tension:.25}];
    if (charts[key]){ charts[key].destroy(); delete charts[key]; }
    charts[key]=new Chart(document.getElementById(canvasId), {type, data:{labels, datasets:ds}, options:o});
  };
  mk('fb_spend','cFbSpend','bar', w.map(x=>+x.spend.toFixed(2)), C.fb, FMT.money);
  mk('fb_cpm','cFbCpm','line',   w.map(x=>+x.cpm.toFixed(2)),   '#1E8E3E', FMT.money);
  mk('fb_ctr','cFbCtr','line',   w.map(x=>+x.ctr.toFixed(3)),   '#D97706', FMT.pct);
  mk('fb_cpc','cFbCpc','line',   w.map(x=>+x.cpc.toFixed(2)),   '#C5221F', FMT.money);
}

/* ---------- boot ---------- */
async function loadJSON(f){ const res=await fetch(f+'?t='+Date.now(), {cache:'no-store'}); if(!res.ok) throw new Error(f+' '+res.status); return res.json(); }
Promise.all([loadJSON('ads_daily.json'), loadJSON('ads_periods.json'),
             loadJSON('ads_tk_campaigns.json').catch(()=>null),
             loadJSON('platform_fee.json').catch(()=>null),
             loadJSON('facebook/fb_daily.json').catch(()=>null)]).then(([d,p,tc,fee,fb])=>{
  DAILY=d; PERIODS=p; TKC=tc; FEE=fee; FB=fb; DAYS=Object.keys(d.days).sort(); MIN=DAYS[0]; MAX=DAYS[DAYS.length-1];
  const cv=d.coverage||{shopee:MAX,tiktok:MAX};
  document.getElementById('asof').textContent = `ข้อมูลรายวัน ${thDate(MIN)} – ${thDate(MAX,true)} · Shopee ถึง ${thDate(cv.shopee)} · TikTok ถึง ${thDate(cv.tiktok)}`
    + (cv.lazada ? ` · Lazada ถึง ${thDate(cv.lazada)}` : '')
    + (fbOn() ? ` · Facebook ${thDate(FB.from)} – ${thDate(FB.to)}` : '');
  ['dFrom','dTo'].forEach(id=>{ const el=document.getElementById(id); el.min=MIN; el.max=MAX; });
  buildSkeleton();
  document.getElementById('srcText').textContent=(d.source_note||'')+'\n'+(p.note||'');
  document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
  window.addEventListener('hashchange', ()=>setView(location.hash.slice(1), true));
  document.querySelectorAll('#presets .chip').forEach(c=>c.onclick=()=>{ const [a,b]=presetRange(c.dataset.p); setRange(a,b,c.dataset.p); });
  const onDate=()=>{ const a=document.getElementById('dFrom').value, b=document.getElementById('dTo').value; if(a&&b) setRange(a,b,''); };
  document.getElementById('dFrom').onchange=onDate; document.getElementById('dTo').onchange=onDate;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('wibwub_ads_state')||'null'); }catch(e){}
  const hv=location.hash.slice(1);
  st.view = VIEWS.includes(hv) ? hv : (saved&&VIEWS.includes(saved.v) ? saved.v : 'overview');
  let a,b,pr;
  if (saved && saved.p){ [a,b]=presetRange(saved.p); pr=saved.p; }
  else if (saved && saved.a && saved.b && saved.a>=MIN && saved.b<=MAX){ a=saved.a; b=saved.b; pr=''; }
  else { [a,b]=presetRange('thisMonth'); pr='thisMonth'; }
  st.from=a; st.to=b; st.preset=pr;
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===pr));
  recompute(); setView(st.view, true);
}).catch(e=>{
  document.getElementById('main').innerHTML = `<div class="err">โหลดข้อมูลไม่สำเร็จ (${esc(e.message)})<br><span class="muted">หน้านี้อ่านข้อมูลจาก ads_daily.json และ ads_periods.json ในโฟลเดอร์เดียวกัน — ถ้าเปิดไฟล์จากเครื่องโดยตรง (file://) เบราว์เซอร์จะไม่ยอมโหลด ให้เปิดผ่าน GitHub Pages</span></div>`;
});
})();
