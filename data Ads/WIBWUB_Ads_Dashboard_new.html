<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIBWUB Ads Dashboard</title>
<!--
  WIBWUB Ads Dashboard (v2, 19 ต.ค. 2569)
  ข้อมูลไม่ฝังในไฟล์นี้ — หน้าเว็บอ่านจาก 2 ไฟล์ข้างๆ:
    ads_daily.json   = รายวัน (ยอดขายจริง + ยอดจาก Ads + ค่าโฆษณา) Shopee/TikTok — ใช้กับตัวเลือกช่วงวันที่
    ads_periods.json = รายเดือนจากไฟล์ export (ยอดรวม + รายชื่อแคมเปญ) — ใช้กับแนวโน้มรายเดือน/ตารางแคมเปญ
  งานตั้งเวลาให้แก้เฉพาะ 2 ไฟล์ JSON นี้ ห้ามแก้ตัวเลขใน HTML
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --panel-2:#F9FAFB; --border:#E6E8EC; --border-2:#D9DCE2;
  --ink:#1A1D23; --ink-2:#4B5260; --muted:#7A8190; --grid:#EEF0F3;
  --shopee:#E8501F; --tiktok:#0A9690; --total:#1A1D23;
  --shopee-soft:#FDEEE8; --tiktok-soft:#E3F4F3;
  --good:#1E8E3E; --bad:#C5221F; --warn-bg:#FFF7E6; --warn-bd:#F5D9A0; --warn-ink:#7A5200;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Thai',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* ── top bar (ซ่อนเมื่ออยู่ใน iframe ของ Dashboard หลัก) ── */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.topbar img{height:22px;display:block}
.topbar h1{font-size:15px;font-weight:700}
.topbar .sp{flex:1}
body.embedded .topbar{display:none}

/* ── range bar (sticky) ── */
.rangebar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.rangebar .dates{display:flex;align-items:center;gap:6px}
.rangebar input[type=date]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border-2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.asof{font-size:12px;color:var(--muted);margin-left:auto}

.main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:700;color:var(--ink)}
.sec-h .sub{font-size:12.5px;color:var(--muted)}

.range-title{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.range-title b{color:var(--ink)}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .delta{font-size:12px;margin-top:2px;color:var(--muted)}
.kpi .delta .up{color:var(--good)} .kpi .delta .dn{color:var(--bad)}
.kpi .split{margin-top:10px;padding-top:10px;border-top:1px solid var(--grid);display:grid;gap:3px;font-size:12.5px;color:var(--ink-2)}
.kpi .split div{display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.sh{background:var(--shopee)} .dot.tk{background:var(--tiktok)}

/* ── cards / panels ── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two>*{min-width:0}
.mini-wrap{overflow-x:auto;margin-top:14px}
.pcard-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px}
.pcard-h .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.pcard.sh .tag{background:var(--shopee-soft);color:#A63A14}
.pcard.tk .tag{background:var(--tiktok-soft);color:#076B67}
.pcard.sh{border-top:3px solid var(--shopee)} .pcard.tk{border-top:3px solid var(--tiktok)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.m .ml{font-size:12px;color:var(--muted)}
.m .mv{font-size:17px;font-weight:700}
.m .ms{font-size:12px;color:var(--ink-2)}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.mini th{font-weight:600;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--border)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--grid)}
.mini tr.tot td{font-weight:700;border-bottom:none}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* ── charts ── */
.chart-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
.chart-h .t{font-weight:700;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--border-2)}
.seg button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
.cwrap{position:relative;height:280px}

/* ── tables ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.data th{position:sticky;top:0;background:var(--panel-2);font-weight:600;color:var(--ink-2);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
table.data td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--grid)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th.grp{text-align:center;border-bottom:1px solid var(--border)}
table.data th.sh{box-shadow:inset 0 -2px 0 var(--shopee)} table.data th.tk{box-shadow:inset 0 -2px 0 var(--tiktok)}
table.data tr.tot td{font-weight:700;background:var(--panel-2);border-top:1px solid var(--border-2)}
table.data td.name{white-space:normal;min-width:220px;max-width:420px;text-align:left}
table.data tbody tr:hover td{background:#FAFBFC}
.muted{color:var(--muted)}
.more{margin-top:8px;font-size:12.5px;background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer}

.callout{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:12.5px}
.callout b{color:#5A3D00}
details.src{margin-top:12px;font-size:12px;color:var(--muted)}
details.src summary{cursor:pointer}
details.src pre{white-space:pre-wrap;font-family:inherit;margin-top:6px}

.err{margin:40px auto;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--ink-2)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .rangebar{padding:10px 12px}.main{padding:14px 12px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:20px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .asof{margin-left:0;width:100%}
  .cwrap{height:240px}
  .legend{margin-left:0}
}
</style>
</head>
<body>

<div class="topbar">
  <img src="../logo-header.png" alt="WIBWUB">
  <h1>Ads Dashboard</h1>
  <span class="sp"></span>
</div>

<div class="rangebar" id="rangebar">
  <div class="dates">
    <input type="date" id="dFrom" aria-label="วันที่เริ่ม">
    <span class="muted">ถึง</span>
    <input type="date" id="dTo" aria-label="วันที่สิ้นสุด">
  </div>
  <div class="chips" id="presets">
    <button class="chip" data-p="7">7 วันล่าสุด</button>
    <button class="chip" data-p="14">14 วันล่าสุด</button>
    <button class="chip" data-p="30">30 วันล่าสุด</button>
    <button class="chip" data-p="thisMonth">เดือนนี้</button>
    <button class="chip" data-p="lastMonth">เดือนก่อน</button>
    <button class="chip" data-p="all">ทั้งหมด</button>
  </div>
  <span class="asof" id="asof"></span>
</div>

<div class="main" id="main">
  <div class="err" id="loading">กำลังโหลดข้อมูล…</div>
</div>

<script>
(function(){
'use strict';
if (window.self !== window.top) document.body.classList.add('embedded');

const C = { sh:'#E8501F', tk:'#0A9690', ink:'#1A1D23', ink2:'#4B5260', muted:'#7A8190', grid:'#EEF0F3' };
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MKEYS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('th-TH',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht = v => '฿' + nf0.format(Math.round(v||0));
const bahtShort = v => { v=v||0; const a=Math.abs(v);
  if (a>=1e6) return '฿'+(v/1e6).toFixed(a>=1e7?1:2)+'M';
  if (a>=1e3) return '฿'+(v/1e3).toFixed(a>=1e5?0:1)+'K';
  return '฿'+nf0.format(Math.round(v)); };
const int = v => nf0.format(Math.round(v||0));
const pct = (v,d=1) => (isFinite(v) ? (v*100).toFixed(d)+'%' : '–');
const x2 = v => (isFinite(v) && v>0 ? v.toFixed(2)+'x' : '–');
const div = (a,b) => (b ? a/b : NaN);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmtISO(dt){ return dt.toISOString().slice(0,10); }
function addDays(s,n){ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return fmtISO(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/864e5)+1; }
function thDate(s, withYear){ const d=parseD(s); return d.getUTCDate()+' '+TH_M[d.getUTCMonth()]+(withYear?' '+(d.getUTCFullYear()+543):''); }
function thRange(a,b){
  const A=parseD(a),B=parseD(b), yA=A.getUTCFullYear()+543, yB=B.getUTCFullYear()+543;
  if (a===b) return thDate(a,true);
  if (yA===yB && A.getUTCMonth()===B.getUTCMonth()) return A.getUTCDate()+'–'+B.getUTCDate()+' '+TH_M[B.getUTCMonth()]+' '+yB;
  if (yA===yB) return thDate(a)+' – '+thDate(b)+' '+yB;
  return thDate(a,true)+' – '+thDate(b,true);
}
function deltaHtml(cur, prev, mode){
  if (!isFinite(cur) || !isFinite(prev) || prev===0) return '<span class="muted">ไม่มีช่วงก่อนหน้าให้เทียบ</span>';
  if (mode==='pt'){ const d=(cur-prev)*100; const cls = d>0?'dn':'up'; // ค่าโฆษณา÷ยอดขาย สูงขึ้น = แย่ลง
    return `<span class="${cls}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)} จุด</span> เทียบช่วงก่อน`; }
  const r=(cur-prev)/prev; let cls = r>=0?'up':'dn'; if (mode==='cost') cls = r>=0?'dn':'up';
  return `<span class="${cls}">${r>=0?'▲':'▼'} ${Math.abs(r*100).toFixed(1)}%</span> เทียบช่วงก่อน`;
}

/* ---------- state ---------- */
let DAILY=null, PERIODS=null, DAYS=[], MIN='', MAX='';
const st = { from:'', to:'', preset:'thisMonth', dayMetric:'real', monMetric:'spend', campMonth:'', campTab:'sh', campAll:false };
const charts = {};

/* ---------- aggregation ---------- */
function sumRange(a,b){
  const r = { n:0, days:[],
    sh:{real:0,orders:0,broad:0,direct:0,spend:0,adsOrders:0, t:{product:{b:0,d:0,s:0,o:0},search:{b:0,d:0,s:0,o:0},live:{b:0,d:0,s:0,o:0}}},
    tk:{real:0,orders:0,gmv:0,spend:0,adsOrders:0, t:{product:{g:0,s:0,o:0},live:{g:0,s:0,o:0}}} };
  for (const d of DAYS){ if (d<a || d>b) continue; const v=DAILY.days[d]; r.n++; r.days.push(d);
    r.sh.real+=v.sh_real.gmv; r.sh.orders+=v.sh_real.orders;
    for (const k of ['product','search','live']){ const x=v.sh_ads[k]||{}; const t=r.sh.t[k];
      t.b+=x.gmv_broad||0; t.d+=x.gmv_direct||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.sh.broad+=x.gmv_broad||0; r.sh.direct+=x.gmv_direct||0; r.sh.spend+=x.spend||0; r.sh.adsOrders+=x.orders||0; }
    r.tk.real+=v.tk_real.gmv; r.tk.orders+=v.tk_real.orders;
    for (const k of ['product','live']){ const x=v.tk_ads[k]||{}; const t=r.tk.t[k];
      t.g+=x.gmv||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.tk.gmv+=x.gmv||0; r.tk.spend+=x.spend||0; r.tk.adsOrders+=x.orders||0; }
  }
  r.all = { real:r.sh.real+r.tk.real, spend:r.sh.spend+r.tk.spend, ads:r.sh.broad+r.tk.gmv, orders:r.sh.orders+r.tk.orders };
  return r;
}
function dayVals(d){ const v=DAILY.days[d];
  const shS=['product','search','live'].reduce((s,k)=>s+((v.sh_ads[k]||{}).spend||0),0);
  const shB=['product','search','live'].reduce((s,k)=>s+((v.sh_ads[k]||{}).gmv_broad||0),0);
  const tkS=['product','live'].reduce((s,k)=>s+((v.tk_ads[k]||{}).spend||0),0);
  const tkG=['product','live'].reduce((s,k)=>s+((v.tk_ads[k]||{}).gmv||0),0);
  return { shR:v.sh_real.gmv, shO:v.sh_real.orders, shB, shS, tkR:v.tk_real.gmv, tkO:v.tk_real.orders, tkG, tkS };
}

/* ---------- presets ---------- */
function presetRange(p){
  if (p==='all') return [MIN,MAX];
  if (/^\d+$/.test(p)){ const n=+p; return [ (addDays(MAX,-(n-1))<MIN?MIN:addDays(MAX,-(n-1))), MAX ]; }
  const m = MAX.slice(0,7);
  if (p==='thisMonth'){ const a=m+'-01'; return [a<MIN?MIN:a, MAX]; }
  if (p==='lastMonth'){ const d=parseD(m+'-01'); d.setUTCMonth(d.getUTCMonth()-1); const a=fmtISO(d); const b=addDays(m+'-01',-1);
    return [a<MIN?MIN:a, b>MAX?MAX:b]; }
  return [MIN,MAX];
}
function setRange(a,b,preset){
  if (a>b) [a,b]=[b,a];
  if (a<MIN) a=MIN; if (b>MAX) b=MAX; if (a>MAX) a=MAX; if (b<MIN) b=MIN;
  st.from=a; st.to=b; st.preset=preset||'';
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===st.preset));
  try{ localStorage.setItem('wibwub_ads_range', JSON.stringify({p:st.preset,a,b})); }catch(e){}
  renderRange();
}

/* ---------- layout skeleton ---------- */
function buildSkeleton(){
  document.getElementById('main').innerHTML = `
  <section class="sec">
    <div class="range-title" id="rangeTitle"></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="sec">
    <div class="panel">
      <div class="chart-h">
        <span class="t">รายวัน</span>
        <div class="seg" id="segDay">
          <button data-m="real">ยอดขายจริง</button>
          <button data-m="spend">ค่าโฆษณา</button>
          <button data-m="ratio">ค่าโฆษณา ÷ ยอดขายจริง</button>
          <button data-m="roas">ROAS จากยอดจริง</button>
        </div>
        <div class="legend"><span><i class="dot sh"></i>Shopee</span><span><i class="dot tk"></i>TikTok</span></div>
      </div>
      <div class="cwrap"><canvas id="cDay" aria-label="กราฟรายวัน"></canvas></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>แยกตามแพลตฟอร์ม</h2><span class="sub" id="pfSub"></span></div>
    <div class="two">
      <div class="panel pcard sh" id="cardSh"></div>
      <div class="panel pcard tk" id="cardTk"></div>
    </div>
    <div class="callout" style="margin-top:12px">
      <b>ทำไมยอดจาก Ads อาจสูงกว่ายอดขายจริง:</b> แพลตฟอร์มนับออเดอร์ให้โฆษณาถ้าลูกค้าเคยเห็นหรือคลิกโฆษณาภายในช่วงเวลาหนึ่ง
      (Shopee แบบ <b>broad</b> นับกว้างที่สุด, <b>direct</b> นับเฉพาะสินค้าที่คลิกโดยตรง) ออเดอร์เดียวอาจถูกนับให้หลายแคมเปญ
      และนับก่อนหักยกเลิก/คืนเงิน — จึงควรดู <b>ค่าโฆษณา ÷ ยอดขายจริง</b> และ <b>ROAS จากยอดจริง</b> เป็นหลัก
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>ตารางรายวัน</h2><span class="sub">เรียงจากวันล่าสุด</span></div>
    <div class="tbl-wrap" style="max-height:520px"><table class="data num" id="tDaily"></table></div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>แนวโน้มรายเดือน</h2><span class="sub">ตัวเลขตามรายงานของแต่ละแพลตฟอร์ม (ไฟล์ export รายเดือน) · ไม่ขึ้นกับช่วงวันที่ด้านบน</span></div>
    <div class="panel">
      <div class="chart-h">
        <div class="seg" id="segMon">
          <button data-m="spend">ค่าโฆษณา</button>
          <button data-m="revenue">ยอดขายจาก Ads</button>
          <button data-m="roas">ROAS ตามแพลตฟอร์ม</button>
        </div>
        <div class="legend"><span><i class="dot sh"></i>Shopee</span><span><i class="dot tk"></i>TikTok</span></div>
      </div>
      <div class="cwrap"><canvas id="cMon" aria-label="กราฟรายเดือน"></canvas></div>
      <p class="note" id="monNote"></p>
    </div>
  </section>

/* ---------- charts ---------- */
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12;
Chart.defaults.color = C.muted;
function baseOpts(yFmt){
  return { responsive:true, maintainAspectRatio:false, animation:{duration:250},
    interaction:{mode:'index', intersect:false},
    plugins:{ legend:{display:false},
      tooltip:{ backgroundColor:'#fff', titleColor:C.ink, bodyColor:C.ink2, borderColor:'#D9DCE2', borderWidth:1, padding:10, boxPadding:4, usePointStyle:true,
        callbacks:{ label:ctx=>' '+ctx.dataset.label+': '+yFmt(ctx.parsed.y, true) } } },
    scales:{ x:{ grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, autoSkipPadding:12} },
             y:{ beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{callback:v=>yFmt(v,false)} } } };
}
function renderDayChart(){
  document.querySelectorAll('#segDay button').forEach(b=>b.classList.toggle('on', b.dataset.m===st.dayMetric));
  const days = DAYS.filter(d=>d>=st.from && d<=st.to);
  const V = days.map(dayVals); const mt=st.dayMetric;
  const pick = { real:v=>[v.shR,v.tkR], spend:v=>[v.shS,v.tkS], ratio:v=>[div(v.shS,v.shR)*100, div(v.tkS,v.tkR)*100], roas:v=>[div(v.shR,v.shS), div(v.tkR,v.tkS)] }[mt];
  const sh = V.map(v=>{const x=pick(v)[0]; return isFinite(x)?x:null;}), tk = V.map(v=>{const x=pick(v)[1]; return isFinite(x)?x:null;});
  const fmt = { real:(v,full)=>full?baht(v):bahtShort(v), spend:(v,full)=>full?baht(v):bahtShort(v), ratio:v=>v==null?'–':(+v).toFixed(1)+'%', roas:v=>v==null?'–':(+v).toFixed(2)+'x' }[mt];
  const labels = days.map(d=>thDate(d));
  const ds = [
    { label:'Shopee', data:sh, borderColor:C.sh, backgroundColor:C.sh, borderWidth:2, pointRadius:days.length>20?0:3, pointHoverRadius:5, pointBorderColor:'#fff', pointBorderWidth:2, tension:.25, spanGaps:true },
    { label:'TikTok', data:tk, borderColor:C.tk, backgroundColor:C.tk, borderWidth:2, pointRadius:days.length>20?0:3, pointHoverRadius:5, pointBorderColor:'#fff', pointBorderWidth:2, tension:.25, spanGaps:true } ];
  if (charts.day){ charts.day.data.labels=labels; charts.day.data.datasets=ds; charts.day.options=baseOpts(fmt); charts.day.update(); }
  else charts.day = new Chart(document.getElementById('cDay'), { type:'line', data:{labels, datasets:ds}, options:baseOpts(fmt) });
}
function monthList(){ return MKEYS.filter(k=>PERIODS.months[k]); }
function renderMonChart(){
  document.querySelectorAll('#segMon button').forEach(b=>b.classList.toggle('on', b.dataset.m===st.monMetric));

  const val = (p,key)=>{ const x=PERIODS.months[key][p]; if(!x) return null; if (mt==='roas') return x.spend? x.revenue/x.spend : null; return x[mt]||0; };

  else charts.mon = new Chart(document.getElementById('cMon'), { type:'bar', data:{labels, datasets:ds}, options:opts });
  const last = PERIODS.months[ks[ks.length-1]];

    + (last && last.cover ? ` · เดือนล่าสุดเป็นข้อมูลบางส่วน (Shopee ถึงวันที่ ${last.cover.shopeeDay}, TikTok ถึงวันที่ ${last.cover.tiktokDay})` : '');

function renderCamp(){

  const M = PERIODS.months[st.campMonth]; const tab=st.campTab; let head='', rows=[], tot='', list=[];
  if (tab==='sh'){
    list = (M.shopee.campaigns||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head = '<tr><th>แคมเปญ</th><th>ค่าโฆษณา</th><th>ยอดขาย (Ads)</th><th>ROAS</th><th>ออเดอร์</th><th>CPA</th><th>Impressions</th><th>คลิก</th><th>CTR</th></tr>';

    const S=M.shopee; tot = `<tr class="tot"><td>รวมทั้งเดือน</td><td>${baht(S.spend)}</td><td>${baht(S.revenue)}</td><td>${x2(div(S.revenue,S.spend))}</td><td>${int(S.orders)}</td><td>${S.orders?nf2.format(S.spend/S.orders):'–'}</td><td>${int(S.imp)}</td><td>${int(S.clicks)}</td><td>${S.imp?(S.clicks/S.imp*100).toFixed(2)+'%':'–'}</td></tr>`;

    const src = tab==='gmax' ? M.tiktok.gmvMax : M.tiktok.gmvLive;
    list = ((src && (tab==='gmax'?src.campaigns:src.sessions))||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head = '<tr><th>'+(tab==='gmax'?'แคมเปญ':'ไลฟ์ / แคมเปญ')+'</th><th>ค่าโฆษณา</th><th>ยอดขาย (Ads)</th><th>ROAS</th><th>ออเดอร์</th><th>CPA</th></tr>';
    rows = list.map(c=>`<tr><td class="name">${esc(c.name)}</td><td>${baht(c.spend)}</td><td>${baht(c.revenue)}</td><td>${x2(c.roi||div(c.revenue,c.spend))}</td><td>${int(c.orders)}</td><td>${c.orders?nf2.format(c.cpa||c.spend/c.orders):'–'}</td></tr>`);
    const T = src && src.total; if (T) tot = `<tr class="tot"><td>รวมทั้งเดือน</td><td>${baht(T.spend)}</td><td>${baht(T.revenue)}</td><td>${x2(div(T.revenue,T.spend))}</td><td>${int(T.orders)}</td><td>${T.orders?nf2.format(T.spend/T.orders):'–'}</td></tr>`;
  } else {
    const src = M.tiktok.bizAds; list = ((src&&src.campaigns)||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    head = '<tr><th>แคมเปญ</th><th>ค่าโฆษณา</th><th>Impressions</th><th>คลิก</th><th>CTR</th><th>CPM</th></tr>';

    const T = src && src.total; if (T) tot = `<tr class="tot"><td>รวมทั้งเดือน</td><td>${baht(T.spend)}</td><td>${int(T.imp)}</td><td>${int(T.clicks)}</td><td>${T.imp?(T.clicks/T.imp*100).toFixed(2)+'%':'–'}</td><td>${T.imp?nf2.format(T.spend/T.imp*1000):'–'}</td></tr>`;
  }

  DAILY=d; PERIODS=p; DAYS=Object.keys(d.days).sort(); MIN=DAYS[0]; MAX=DAYS[DAYS.length-1];

  document.getElementById('srcText').textContent = (d.source_note||'') + '\n' + (p.note||'');
  document.querySelectorAll('#presets .chip').forEach(c=>c.onclick=()=>{ const [a,b]=presetRange(c.dataset.p); setRange(a,b,c.dataset.p); });
  const onDate=()=>{ const a=document.getElementById('dFrom').value, b=document.getElementById('dTo').value; if(a&&b) setRange(a,b,''); };
  document.getElementById('dFrom').onchange=onDate; document.getElementById('dTo').onchange=onDate;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('wibwub_ads_range')||'null'); }catch(e){}
  if (saved && saved.p){ const [a,b]=presetRange(saved.p); setRange(a,b,saved.p); }

  else { const [a,b]=presetRange('thisMonth'); setRange(a,b,'thisMonth'); }
}).catch(e=>{
  document.getElementById('main').innerHTML = `<div class="err">โหลดข้อมูลไม่สำเร็จ (${esc(e.message)})<br><span class="muted">หน้านี้อ่านข้อมูลจาก ads_daily.json และ ads_periods.json ในโฟลเดอร์เดียวกัน — ถ้าเปิดไฟล์จากเครื่องโดยตรง (file://) เบราว์เซอร์จะไม่ยอมโหลด ให้เปิดผ่าน GitHub Pages</span></div>`;
});
})();
</script>
</body>
</html>
