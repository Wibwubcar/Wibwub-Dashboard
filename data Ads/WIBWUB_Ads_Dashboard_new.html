<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIBWUB Ads Dashboard</title>
<!--
  WIBWUB Ads Dashboard (v2, 19 ต.ค. 2569) — 3 หน้า: ภาพรวม / Shopee / TikTok (ใช้ช่วงวันที่ร่วมกัน)
  ข้อมูลไม่ฝังในไฟล์นี้ — หน้าเว็บอ่านจาก 2 ไฟล์ข้างๆ:
    ads_daily.json   = รายวัน (ยอดขายจริง + ยอดจาก Ads + ค่าโฆษณา) Shopee/TikTok — ใช้กับตัวเลือกช่วงวันที่
    ads_periods.json = รายเดือนจากไฟล์ export (ยอดรวม + รายชื่อแคมเปญ) — ใช้กับแนวโน้มรายเดือน/ตารางแคมเปญ
  งานตั้งเวลาให้แก้เฉพาะ 2 ไฟล์ JSON นี้ ห้ามแก้ตัวเลขใน HTML
  เปิดหน้าเฉพาะได้ด้วย #overview / #shopee / #tiktok ต่อท้าย URL
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --panel-2:#F9FAFB; --border:#E6E8EC; --border-2:#D9DCE2;
  --ink:#1A1D23; --ink-2:#4B5260; --muted:#7A8190; --grid:#EEF0F3;
  --shopee:#E8501F; --tiktok:#0A9690;
  --shopee-soft:#FDEEE8; --tiktok-soft:#E3F4F3;
  --good:#1E8E3E; --bad:#C5221F; --warn-bg:#FFF7E6; --warn-bd:#F5D9A0; --warn-ink:#7A5200;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Thai',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* top bar (ซ่อนเมื่ออยู่ใน iframe ของ Dashboard หลัก) */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.topbar img{height:22px;display:block}
.topbar h1{font-size:15px;font-weight:700}
body.embedded .topbar{display:none}

/* sticky header: page tabs + range */
.head{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;padding:8px 20px 0;overflow-x:auto}
.tab{border:0;background:none;padding:9px 16px 10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab[data-v="shopee"].on{border-bottom-color:var(--shopee)}
.tab[data-v="tiktok"].on{border-bottom-color:var(--tiktok)}
.rangebar{padding:8px 20px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-top:1px solid var(--grid)}
.rangebar .dates{display:flex;align-items:center;gap:6px}
.rangebar input[type=date]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border-2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.asof{font-size:12px;color:var(--muted);margin-left:auto}

.main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.view{display:none}.view.on{display:block}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:700;color:var(--ink)}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.range-title{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.range-title b{color:var(--ink)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .sub2{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.kpi .delta{font-size:12px;margin-top:2px;color:var(--muted)}
.delta .up{color:var(--good)} .delta .dn{color:var(--bad)}
.kpi .split{margin-top:10px;padding-top:10px;border-top:1px solid var(--grid);display:grid;gap:3px;font-size:12.5px;color:var(--ink-2)}
.kpi .split div{display:flex;justify-content:space-between;gap:8px}
.view-shopee .kpi{border-top:3px solid var(--shopee)} .view-tiktok .kpi{border-top:3px solid var(--tiktok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.sh{background:var(--shopee)} .dot.tk{background:var(--tiktok)}
.dash{display:inline-block;width:16px;height:0;border-top:2px dashed var(--ink-2);margin-right:6px;vertical-align:3px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two>*{min-width:0}
.pcard{cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--border-2)}
.pcard.sh{border-top:3px solid var(--shopee)} .pcard.tk{border-top:3px solid var(--tiktok)}
.pcard-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px}
.pcard-h .go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.m .ml{font-size:12px;color:var(--muted)}
.m .mv{font-size:17px;font-weight:700}
.m .ms{font-size:12px;color:var(--ink-2)}
.mini-wrap{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.mini th{font-weight:600;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:8px;text-align:right;border-bottom:1px solid var(--grid)}
.mini tr.tot td{font-weight:700;border-bottom:none}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* charts */
.chart-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
.chart-h .t{font-weight:700;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--border-2)}
.seg button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
.cwrap{position:relative;height:280px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.data th{position:sticky;top:0;background:var(--panel-2);font-weight:600;color:var(--ink-2);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
table.data td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--grid)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th.grp{text-align:center}
table.data th.sh{box-shadow:inset 0 -2px 0 var(--shopee)} table.data th.tk{box-shadow:inset 0 -2px 0 var(--tiktok)}
table.data tr.tot td{font-weight:700;background:var(--panel-2);border-top:1px solid var(--border-2)}
table.data td.name{white-space:normal;min-width:220px;max-width:420px;text-align:left}
table.data tbody tr:hover td{background:#FAFBFC}
.muted{color:var(--muted)}
.more{margin-top:8px;font-size:12.5px;background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer}
select.sel{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--ink)}

.callout{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:12.5px}
.callout b{color:#5A3D00}
details.src{margin-top:16px;font-size:12px;color:var(--muted)}
details.src summary{cursor:pointer}
details.src pre{white-space:pre-wrap;font-family:inherit;margin-top:6px}
.err{margin:40px auto;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--ink-2)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .head{position:static}
  .tabs,.rangebar{padding-left:12px;padding-right:12px}.main{padding:14px 12px 32px}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:20px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .asof{margin-left:0;width:100%}
  .cwrap{height:240px}
  .legend{margin-left:0}
  .tab{padding:8px 12px 9px}
}
</style>
</head>
<body>

<div class="topbar">
  <img src="../logo-header.png" alt="WIBWUB">
  <h1>Ads Dashboard</h1>
</div>

<div class="head">
  <nav class="tabs" id="tabs">
    <button class="tab" data-v="overview">📊 ภาพรวม</button>
    <button class="tab" data-v="shopee"><i class="dot sh"></i>Shopee</button>
    <button class="tab" data-v="tiktok"><i class="dot tk"></i>TikTok</button>
  </nav>
  <div class="rangebar">
    <div class="dates">
      <input type="date" id="dFrom" aria-label="วันที่เริ่ม">
      <span class="muted">ถึง</span>
      <input type="date" id="dTo" aria-label="วันที่สิ้นสุด">
    </div>
    <div class="chips" id="presets">
      <button class="chip" data-p="7">7 วันล่าสุด</button>
      <button class="chip" data-p="14">14 วันล่าสุด</button>
      <button class="chip" data-p="30">30 วันล่าสุด</button>
      <button class="chip" data-p="thisMonth">เดือนนี้</button>
      <button class="chip" data-p="lastMonth">เดือนก่อน</button>
      <button class="chip" data-p="all">ทั้งหมด</button>
    </div>
    <span class="asof" id="asof"></span>
  </div>
</div>

<div class="main" id="main">
  <div class="err">กำลังโหลดข้อมูล…</div>
</div>

<script>
(function(){
'use strict';
if (window.self !== window.top) document.body.classList.add('embedded');

const C = { sh:'#E8501F', tk:'#0A9690', ink:'#1A1D23', ink2:'#4B5260', muted:'#7A8190', grid:'#EEF0F3' };
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MKEYS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const VIEWS = ['overview','shopee','tiktok'];

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('th-TH',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht = v => '฿' + nf0.format(Math.round(v||0));
const bahtShort = v => { v=v||0; const a=Math.abs(v);
  if (a>=1e6) return '฿'+(v/1e6).toFixed(a>=1e7?1:2)+'M';
  if (a>=1e3) return '฿'+(v/1e3).toFixed(a>=1e5?0:1)+'K';
  return '฿'+nf0.format(Math.round(v)); };
const int = v => nf0.format(Math.round(v||0));
const pct = (v,d=1) => (Number.isFinite(v) ? (v*100).toFixed(d)+'%' : '–');
const x2 = v => (Number.isFinite(v) && v>0 ? v.toFixed(2)+'x' : '–');
const div = (a,b) => (b ? a/b : NaN);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmtISO(dt){ return dt.toISOString().slice(0,10); }
function addDays(s,n){ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return fmtISO(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/864e5)+1; }
function thDate(s, withYear){ const d=parseD(s); return d.getUTCDate()+' '+TH_M[d.getUTCMonth()]+(withYear?' '+(d.getUTCFullYear()+543):''); }
function thRange(a,b){
  const A=parseD(a),B=parseD(b), yA=A.getUTCFullYear()+543, yB=B.getUTCFullYear()+543;
  if (a===b) return thDate(a,true);
  if (yA===yB && A.getUTCMonth()===B.getUTCMonth()) return A.getUTCDate()+'–'+B.getUTCDate()+' '+TH_M[B.getUTCMonth()]+' '+yB;
  if (yA===yB) return thDate(a)+' – '+thDate(b)+' '+yB;
  return thDate(a,true)+' – '+thDate(b,true);
}
/* mode: undefined = สูงขึ้นดี, 'cost' = สูงขึ้นแย่, 'pt' = อัตราส่วนค่าโฆษณา (จุด, สูงขึ้นแย่) */
function deltaHtml(cur, prev, mode){
  if (typeof cur!=='number' || typeof prev!=='number' || !Number.isFinite(cur) || !Number.isFinite(prev) || prev===0)
    return '<span class="muted">ไม่มีช่วงก่อนหน้าให้เทียบ</span>';
  if (mode==='pt'){ const d=(cur-prev)*100; const cls = d>0?'dn':'up';
    return `<span class="${cls}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)} จุด</span> เทียบช่วงก่อน`; }
  const r=(cur-prev)/prev; let cls = r>=0?'up':'dn'; if (mode==='cost') cls = r>=0?'dn':'up';
  return `<span class="${cls}">${r>=0?'▲':'▼'} ${Math.abs(r*100).toFixed(1)}%</span> เทียบช่วงก่อน`;
}

/* ---------- state ---------- */
let DAILY=null, PERIODS=null, TKC=null, DAYS=[], MIN='', MAX='';
const st = { view:'overview', from:'', to:'', preset:'thisMonth',
  ovMetric:'real', shMetric:'realads', tkMetric:'realads', monMetric:'spend',
  shMonth:'', tkMonth:'', tkCamp:'gmax', shAll:false, tkAll:false };
const charts = {};
let CUR=null, PREV=null;   // ผลรวมช่วงที่เลือก / ช่วงก่อนหน้า

/* ---------- aggregation ---------- */
function sumRange(a,b){
  const r = { n:0, days:[],
    sh:{real:0,orders:0,broad:0,direct:0,spend:0,adsOrders:0, t:{product:{b:0,d:0,s:0,o:0},search:{b:0,d:0,s:0,o:0},live:{b:0,d:0,s:0,o:0}}},
    tk:{real:0,orders:0,gmv:0,spend:0,adsOrders:0, t:{product:{g:0,s:0,o:0},live:{g:0,s:0,o:0}}} };
  for (const d of DAYS){ if (d<a || d>b) continue; const v=DAILY.days[d]; r.n++; r.days.push(d);
    r.sh.real+=v.sh_real.gmv; r.sh.orders+=v.sh_real.orders;
    for (const k of ['product','search','live']){ const x=v.sh_ads[k]||{}; const t=r.sh.t[k];
      t.b+=x.gmv_broad||0; t.d+=x.gmv_direct||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.sh.broad+=x.gmv_broad||0; r.sh.direct+=x.gmv_direct||0; r.sh.spend+=x.spend||0; r.sh.adsOrders+=x.orders||0; }
    r.tk.real+=v.tk_real.gmv; r.tk.orders+=v.tk_real.orders;
    for (const k of ['product','live']){ const x=v.tk_ads[k]||{}; const t=r.tk.t[k];
      t.g+=x.gmv||0; t.s+=x.spend||0; t.o+=x.orders||0;
      r.tk.gmv+=x.gmv||0; r.tk.spend+=x.spend||0; r.tk.adsOrders+=x.orders||0; }
  }
  r.all = { real:r.sh.real+r.tk.real, spend:r.sh.spend+r.tk.spend, ads:r.sh.broad+r.tk.gmv, orders:r.sh.orders+r.tk.orders };
  return r;
}
function dayVals(d){ const v=DAILY.days[d], S=v.sh_ads, T=v.tk_ads;
  const g=(o,k,f)=>((o[k]||{})[f]||0);
  return { shR:v.sh_real.gmv, shO:v.sh_real.orders,
    shB:g(S,'product','gmv_broad')+g(S,'search','gmv_broad')+g(S,'live','gmv_broad'),
    shD:g(S,'product','gmv_direct')+g(S,'search','gmv_direct')+g(S,'live','gmv_direct'),
    shS:g(S,'product','spend')+g(S,'search','spend')+g(S,'live','spend'),
    shSp:g(S,'product','spend'), shSs:g(S,'search','spend'), shSl:g(S,'live','spend'),
    tkR:v.tk_real.gmv, tkO:v.tk_real.orders,
    tkG:g(T,'product','gmv')+g(T,'live','gmv'), tkS:g(T,'product','spend')+g(T,'live','spend'),
    tkSp:g(T,'product','spend'), tkSl:g(T,'live','spend'), tkGp:g(T,'product','gmv'), tkGl:g(T,'live','gmv') };
}

/* ---------- presets ---------- */
function presetRange(p){
  if (p==='all') return [MIN,MAX];
  if (/^\d+$/.test(p)){ const a=addDays(MAX,-(+p-1)); return [a<MIN?MIN:a, MAX]; }
  const m = MAX.slice(0,7);
  if (p==='thisMonth'){ const a=m+'-01'; return [a<MIN?MIN:a, MAX]; }
  if (p==='lastMonth'){ const d=parseD(m+'-01'); d.setUTCMonth(d.getUTCMonth()-1); const a=fmtISO(d), b=addDays(m+'-01',-1);
    return [a<MIN?MIN:a, b>MAX?MAX:b]; }
  return [MIN,MAX];
}
function save(){ try{ localStorage.setItem('wibwub_ads_state', JSON.stringify({p:st.preset,a:st.from,b:st.to,v:st.view})); }catch(e){} }
function setRange(a,b,preset){
  if (a>b) [a,b]=[b,a];
  if (a<MIN) a=MIN; if (b>MAX) b=MAX; if (a>MAX) a=MAX; if (b<MIN) b=MIN;
  st.from=a; st.to=b; st.preset=preset||'';
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===st.preset));
  save(); recompute(); renderView();
}
function setView(v, fromHash){
  if (!VIEWS.includes(v)) v='overview';
  st.view=v;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on', el.id==='view-'+v));
  if (!fromHash && location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  save(); renderView();
  window.scrollTo(0,0);
}

/* ---------- skeleton ---------- */
function kpiBox(id, k4){ return `<div class="kpis${k4?' k4':''}" id="${id}"></div>`; }
function buildSkeleton(){
  document.getElementById('main').innerHTML = `
  <!-- ═════════ ภาพรวม ═════════ -->
  <div class="view view-overview" id="view-overview">
    <section class="sec">
      <div class="range-title" data-rt></div>
      ${kpiBox('ovKpis')}
    </section>
    <section class="sec">
      <div class="panel">
        <div class="chart-h">
          <span class="t">รายวัน</span>

/* ---------- shared pieces ---------- */
function kpiTile(t){ return `
  <div class="kpi">
    <div class="lab">${t.lab}</div>
    <div class="val num">${t.val}</div>
    ${t.sub?`<div class="sub2 num">${t.sub}</div>`:''}
    <div class="delta">${t.d||''}</div>
    ${t.sh!=null?`<div class="split num">
      <div><span><i class="dot sh"></i>Shopee</span><span>${t.sh}</span></div>
      <div><span><i class="dot tk"></i>TikTok</span><span>${t.tk}</span></div></div>`:''}
  </div>`; }
function m(label, val, sub){ return `<div class="m"><div class="ml">${label}</div><div class="mv num">${val}</div>${sub?`<div class="ms num">${sub}</div>`:''}</div>`; }

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12;
Chart.defaults.color = C.muted;
function baseOpts(yFmt){
  return { responsive:true, maintainAspectRatio:false, animation:{duration:250},
    interaction:{mode:'index', intersect:false},
    plugins:{ legend:{display:false},
      tooltip:{ backgroundColor:'#fff', titleColor:C.ink, bodyColor:C.ink2, borderColor:'#D9DCE2', borderWidth:1, padding:10, boxPadding:4, usePointStyle:true,
        callbacks:{ label:ctx=>' '+ctx.dataset.label+': '+yFmt(ctx.parsed.y, true) } } },
    scales:{ x:{ grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, autoSkipPadding:12} },
             y:{ beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{callback:v=>yFmt(v,false)} } } };
}
const FMT = { money:(v,full)=>v==null?'–':(full?baht(v):bahtShort(v)), pct:v=>v==null?'–':(+v).toFixed(1)+'%', x:v=>v==null?'–':(+v).toFixed(2)+'x' };
const fin = x => Number.isFinite(x) ? x : null;
function line(label, data, color, n, dashed){
  return { label, data, borderColor:color, backgroundColor:color, borderWidth:2, borderDash:dashed?[6,4]:[],
    pointRadius:n>20?0:3, pointHoverRadius:5, pointBorderColor:'#fff', pointBorderWidth:2, tension:.25, spanGaps:true };
}
function drawLine(key, canvasId, labels, ds, fmt){
  const o=baseOpts(fmt);
  if (charts[key]){ charts[key].data.labels=labels; charts[key].data.datasets=ds; charts[key].options=o; charts[key].update(); }
  else charts[key]=new Chart(document.getElementById(canvasId), {type:'line', data:{labels, datasets:ds}, options:o});
}
function rangeDays(){ return DAYS.filter(d=>d>=st.from && d<=st.to); }
function segOn(id, val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', (b.dataset.m||b.dataset.t)===val)); }

/* ---------- recompute + routing ---------- */
function recompute(){
  CUR = sumRange(st.from, st.to);
  const n = daysBetween(st.from, st.to), pa = addDays(st.from,-n), pb = addDays(st.from,-1);
  PREV = (pa>=MIN) ? sumRange(pa,pb) : null;
  const t = `ช่วงที่เลือก: <b>${thRange(st.from, st.to)}</b> (${n} วัน)` + (PREV?` <span class="muted">· เทียบกับ ${thRange(pa,pb)}</span>`:'');
  document.querySelectorAll('[data-rt]').forEach(e=>e.innerHTML=t);
  document.querySelectorAll('[data-rs]').forEach(e=>e.textContent=thRange(st.from, st.to));
}
function renderView(){
  if (!CUR) return;
  if (st.view==='overview'){ renderOvKpis(); renderOvCards(); renderOvTable(); renderOvChart(); renderMonChart(); }
  else if (st.view==='shopee'){ renderShKpis(); renderShTypes(); renderShTable(); renderShChart(); renderShCamp(); }
  else { renderTkKpis(); renderTkTypes(); renderTkTable(); renderTkChart(); renderTkCamp(); }
}

function renderOvChart(){

function platformChart(key, canvasId, legendId, metric, color, getR, getA, getS, adsLabel){
  const days=rangeDays(), V=days.map(dayVals), n=days.length, labels=days.map(d=>thDate(d));
  const lg=document.getElementById(legendId);
  if (metric==='realads'){
    lg.innerHTML=`<span><i class="dot" style="background:${color}"></i>ยอดขายจริง</span><span><i class="dash"></i>${adsLabel}</span>`;
    drawLine(key, canvasId, labels, [ line('ยอดขายจริง', V.map(getR), color, n), line(adsLabel, V.map(getA), C.ink2, n, true) ], FMT.money);
    return;
  }
  const lab={spend:'ค่าโฆษณา', ratio:'ค่าโฆษณา ÷ ยอดขายจริง', roas:'ROAS จากยอดจริง'}[metric];
  lg.innerHTML='';
  const f={spend:v=>getS(v), ratio:v=>fin(div(getS(v),getR(v))*100), roas:v=>fin(div(getR(v),getS(v)))}[metric];
  drawLine(key, canvasId, labels, [ line(lab, V.map(f), color, n) ], {spend:FMT.money, ratio:FMT.pct, roas:FMT.x}[metric]);
}

function campMonthSelect(id, key, after){
  const sel=document.getElementById(id); const ks=monthList().slice().reverse();
  if (!sel.options.length) sel.innerHTML = ks.map(k=>`<option value="${k}">${TH_MF[MKEYS.indexOf(k)]} 2569</option>`).join('');

  sel.value=st[key]; sel.onchange=()=>{ st[key]=sel.value; after(); };
}
function campTable(tableId, moreId, allKey, head, rows, tot, emptyMsg){
  const LIMIT=15, shown = st[allKey] ? rows : rows.slice(0,LIMIT), cols=(head.match(/<th/g)||[]).length;
  document.getElementById(tableId).innerHTML = `<thead>${head}</thead><tbody>${shown.join('') || `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:18px">${emptyMsg}</td></tr>`}${tot||''}</tbody>`;
  const more=document.getElementById(moreId);
  if (rows.length>LIMIT){ more.hidden=false; more.textContent = st[allKey] ? 'แสดงน้อยลง' : `แสดงทั้งหมด ${rows.length} แคมเปญ`; } else more.hidden=true;
}

/* ---------- boot ---------- */
async function loadJSON(f){ const res=await fetch(f+'?t='+Date.now(), {cache:'no-store'}); if(!res.ok) throw new Error(f+' '+res.status); return res.json(); }
Promise.all([loadJSON('ads_daily.json'), loadJSON('ads_periods.json'), loadJSON('ads_tk_campaigns.json').catch(()=>null)]).then(([d,p,tc])=>{
  DAILY=d; PERIODS=p; TKC=tc; DAYS=Object.keys(d.days).sort(); MIN=DAYS[0]; MAX=DAYS[DAYS.length-1];
  const cv=d.coverage||{shopee:MAX,tiktok:MAX};
  document.getElementById('asof').textContent = `ข้อมูลรายวัน ${thDate(MIN)} – ${thDate(MAX,true)} · Shopee ถึง ${thDate(cv.shopee)} · TikTok ถึง ${thDate(cv.tiktok)}`;
  ['dFrom','dTo'].forEach(id=>{ const el=document.getElementById(id); el.min=MIN; el.max=MAX; });
  buildSkeleton();
  document.getElementById('srcText').textContent=(d.source_note||'')+'\n'+(p.note||'');
  document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
  window.addEventListener('hashchange', ()=>setView(location.hash.slice(1), true));
  document.querySelectorAll('#presets .chip').forEach(c=>c.onclick=()=>{ const [a,b]=presetRange(c.dataset.p); setRange(a,b,c.dataset.p); });
  const onDate=()=>{ const a=document.getElementById('dFrom').value, b=document.getElementById('dTo').value; if(a&&b) setRange(a,b,''); };
  document.getElementById('dFrom').onchange=onDate; document.getElementById('dTo').onchange=onDate;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('wibwub_ads_state')||'null'); }catch(e){}
  const hv=location.hash.slice(1);
  st.view = VIEWS.includes(hv) ? hv : (saved&&VIEWS.includes(saved.v) ? saved.v : 'overview');
  let a,b,pr;
  if (saved && saved.p){ [a,b]=presetRange(saved.p); pr=saved.p; }
  else if (saved && saved.a && saved.b && saved.a>=MIN && saved.b<=MAX){ a=saved.a; b=saved.b; pr=''; }
  else { [a,b]=presetRange('thisMonth'); pr='thisMonth'; }
  st.from=a; st.to=b; st.preset=pr;
  document.getElementById('dFrom').value=a; document.getElementById('dTo').value=b;
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on', c.dataset.p===pr));
  recompute(); setView(st.view, true);
}).catch(e=>{
  document.getElementById('main').innerHTML = `<div class="err">โหลดข้อมูลไม่สำเร็จ (${esc(e.message)})<br><span class="muted">หน้านี้อ่านข้อมูลจาก ads_daily.json และ ads_periods.json ในโฟลเดอร์เดียวกัน — ถ้าเปิดไฟล์จากเครื่องโดยตรง (file://) เบราว์เซอร์จะไม่ยอมโหลด ให้เปิดผ่าน GitHub Pages</span></div>`;
});
})();
