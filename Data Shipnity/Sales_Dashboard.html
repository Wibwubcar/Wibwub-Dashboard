<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sukhumvit Set', 'Sarabun', sans-serif;
    background: #F8F9FB; color: #0F0F0F; padding: 24px; min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  .header { margin-bottom: 18px; }
  .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .header p { color: #777; font-size: 13px; }
  
  /* Date range bar */
  .range-bar {
    background: white; border-radius: 6px; border: 1px solid #e5e7eb;
    padding: 5px 10px; margin-bottom: 12px; display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap;
  }
  .range-btn {
    padding: 3px 8px; background: white; border: 1px solid #14b8a6;
    color: #14b8a6; border-radius: 5px; font-size: 10px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .range-btn:hover { background: #f0fdfa; }
  .range-btn.primary { background: #14b8a6; color: white; }
  .range-btn .icon { font-size: 10px; }
  .range-label { font-size: 10px; color: #777; }
  .range-current { font-size: 10px; color: #0F0F0F; font-weight: 600; }
  .compare-toggle {
    display: flex; align-items: center; gap: 4px; font-size: 10px; cursor: pointer; user-select: none;
    margin-left: auto;
  }
  .compare-toggle input { accent-color: #1A5CDB; }

  /* Picker overlay */
  .picker-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 99;
  }
  .picker-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 36px; }
  .picker {
    background: white; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.16);
    width: 390px; max-width: 95vw; overflow: hidden;
  }
  .picker-body { display: flex; min-height: 182px; }
  .picker-side {
    width: 98px; background: #f9fafb; padding: 7px; border-right: 1px solid #e5e7eb;
    display: flex; flex-direction: column; gap: 4px;
  }
  .preset-btn {
    padding: 4px 6px; background: white; border: 1px solid #14b8a6;
    color: #14b8a6; border-radius: 4px; font-size: 9.5px; cursor: pointer; text-align: center;
  }
  .preset-btn:hover { background: #f0fdfa; }
  .preset-btn.active { background: #14b8a6; color: white; }
  .picker-main { flex: 1; padding: 7px 10px; }
  .picker-header { display: flex; justify-content: flex-end; margin-bottom: 5px; }
  .custom-btn {
    padding: 3px 8px; background: white; border: 1px solid #14b8a6;
    color: #14b8a6; border-radius: 4px; font-size: 9.5px; cursor: pointer;
  }
  .custom-btn.active { background: #14b8a6; color: white; }
  .calendars { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .cal { font-size: 9.5px; }
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between; padding: 0 1px; margin-bottom: 3px;
  }
  .cal-nav-title { font-weight: 500; font-size: 10px; }
  .cal-nav-btn {
    background: none; border: none; cursor: pointer; padding: 1px 4px; color: #777; font-size: 10px;
  }
  .cal-nav-btn:hover { color: #0F0F0F; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center;
  }
  .cal-dow {
    font-size: 8.5px; color: #9ca3af; padding: 3px 0; font-weight: 500;
  }
  .cal-day {
    padding: 3.5px 0; cursor: pointer; border-radius: 3px; user-select: none;
    font-size: 9.5px;
  }
  .cal-day:hover:not(.disabled):not(.out) { background: #F8F9FB; }
  .cal-day.out { color: #d1d5db; cursor: default; }
  .cal-day.disabled { color: #e5e7eb; cursor: not-allowed; }
  .cal-day.range { background: #d1fae5; color: #065f46; border-radius: 0; }
  .cal-day.range-start, .cal-day.range-end { background: #14b8a6; color: white; }
  .cal-day.range-start { border-radius: 3px 0 0 3px; }
  .cal-day.range-end { border-radius: 0 3px 3px 0; }
  .cal-day.range-start.range-end { border-radius: 3px; }
  .cal-day .dot {
    width: 3px; height: 3px; background: white; border-radius: 50%;
    display: inline-block; vertical-align: middle; margin-top: -1px;
  }
  .picker-footer {
    padding: 6px 10px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 5px;
  }
  .btn-cancel {
    padding: 3px 10px; background: white; border: 1px solid #d1d5db; color: #333;
    border-radius: 4px; font-size: 10px; cursor: pointer;
  }
  .btn-apply {
    padding: 3px 10px; background: #14b8a6; color: white; border: none;
    border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 500;
  }
  .btn-apply:hover { background: #0d9488; }
  .btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* KPIs */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px; margin-bottom: 16px;
  }
  .kpi {
    background: white; padding: 18px; border-radius: 12px; border: 1px solid #e5e7eb;
  }
  .kpi-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 700; color: #0F0F0F; }
  .kpi-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .kpi-delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .delta-pos { color: #059669; }
  .delta-neg { color: #dc2626; }
  
  /* Layout */
  .grid { display: grid; gap: 16px; margin-bottom: 16px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .calendars { grid-template-columns: 1fr; } }
  .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #0F0F0F; }
  .card .sub { font-size: 12px; color: #777; margin-bottom: 12px; margin-top: -8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 8px; font-weight: 600; color: #777;
       border-bottom: 1px solid #e5e7eb; font-size: 11px; text-transform: uppercase;
       letter-spacing: 0.3px; position: sticky; top: 0; background: white; }
  td { padding: 9px 8px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { font-weight: 700; color: #1A5CDB; width: 32px; }
  .bar-cell { position: relative; }
  .bar-fill { position: absolute; left: 0; bottom: 2px; height: 4px;
              background: linear-gradient(90deg, #1A5CDB, #5c8fdb); border-radius: 2px; }
  .table-wrap { max-height: 540px; overflow-y: auto; }
  .chart-box { position: relative; height: 320px; }
  .chart-box.tall { height: 440px; }
  .chart-box.xtall { height: 580px; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    background: #eef2ff; color: #4338ca; font-size: 11px; font-weight: 500;
  }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .controls input, .controls select {
    padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px;
  }
  .channel-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .channel-tab {
    padding: 6px 14px; background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;
  }
  .channel-tab.active { background: #1A5CDB; color: white; border-color: #1A5CDB; }
  .compare-note { font-size: 12px; color: #777; }
  .vs-label { display: inline-block; padding: 2px 8px; background: #F8F9FB; color: #777;
              border-radius: 4px; font-size: 11px; margin: 0 8px; }
</style>
</head>

  <div id="main-view"></div>
</div>

<!-- Date Range Picker Popup -->
<div class="picker-overlay" id="picker-overlay">

    </div>
    <div class="picker-footer">

      <button class="btn-apply" id="btn-apply">ยืนยัน</button>
    </div>
  </div>
</div>

  const ds = parseDate(start), de = parseDate(end);
  if (ds.getFullYear() === de.getFullYear() && ds.getMonth() === de.getMonth()) {
    return `${ds.getDate()}-${de.getDate()} ${THAI_MONTHS[ds.getMonth()]} ${ds.getFullYear()+543}`;
  }
  if (ds.getFullYear() === de.getFullYear()) {
    return `${ds.getDate()} ${THAI_MONTHS[ds.getMonth()]} - ${de.getDate()} ${THAI_MONTHS[de.getMonth()]} ${ds.getFullYear()+543}`;
  }
  return `${fmtThaiDate(start)} - ${fmtThaiDate(end)}`;
}

// ----- RAW field normalisation (convert full-name format → compressed index format) -----
(function(){
  var chMap = new Map(), prMap = new Map();
  RAW.lines.forEach(function(l){
    if(!chMap.has(l.channel)) chMap.set(l.channel, chMap.size);
    if(!prMap.has(l.name))    prMap.set(l.name,    prMap.size);
  });
  RAW.channels = Array.from(chMap.keys());
  RAW.products = Array.from(prMap.keys());
  RAW.lines.forEach(function(l){
    l.c = chMap.get(l.channel);
    l.p = prMap.get(l.name);
    l.q = l.qty;
    l.s = l.price * l.qty;
  });
})();

// ----- state -----
let currentRange = {start: RAW.date_min, end: RAW.date_max};
let cmpRange = null;
let pickerMode = 'main'; // 'main' or 'cmp'
let pickerDraft = {start: null, end: null, preset: null};
let pickerLeftMonth = {y: 2026, m: 4}; // May
let charts = {};

// ----- shortcuts -----
function getPresets() {
  const tmax = RAW.date_max;
  const tmin = RAW.date_min;
  // clamp today to data range
  const todayInRange = TODAY >= tmin && TODAY <= tmax ? TODAY : tmax;
  const yesterday = addDays(todayInRange, -1);
  const last7Start = addDays(todayInRange, -6);
  const last30Start = addDays(todayInRange, -29);
  const d = parseDate(todayInRange);
  const monthStart = dateToStr(new Date(d.getFullYear(), d.getMonth(), 1));
  const prevMonthEnd = dateToStr(new Date(d.getFullYear(), d.getMonth(), 0));
  const prevMonthStart = dateToStr(new Date(d.getFullYear(), d.getMonth()-1, 1));
  return [
    {key: 'today', label: 'วันนี้', start: todayInRange, end: todayInRange},
    {key: 'yesterday', label: 'เมื่อวาน', start: yesterday, end: yesterday},
    {key: '7d', label: '7 วันที่ผ่านมา', start: clampStart(last7Start, tmin), end: todayInRange},
    {key: '30d', label: '30 วันที่ผ่านมา', start: clampStart(last30Start, tmin), end: todayInRange},
    {key: 'this_month', label: 'เดือนนี้', start: clampStart(monthStart, tmin), end: todayInRange},
    {key: 'prev_month', label: 'เดือนที่แล้ว', start: clampStart(prevMonthStart, tmin), end: clampEnd(prevMonthEnd, tmax)},
    {key: 'all', label: 'ทั้งหมด', start: tmin, end: tmax},
  ];
}
function clampStart(s, min) { return s < min ? min : s; }
function clampEnd(s, max) { return s > max ? max : s; }

// ----- Picker UI -----
function openPicker(mode) {
  pickerMode = mode;
  const cur = mode === 'main' ? currentRange : (cmpRange || currentRange);
  pickerDraft = {start: cur.start, end: cur.end, preset: detectPreset(cur)};
  // set left month to start month
  const sd = parseDate(cur.start);
  pickerLeftMonth = {y: sd.getFullYear(), m: sd.getMonth()};
  document.getElementById('picker-overlay').classList.add('open');
  renderPicker();
}
function closePicker() { document.getElementById('picker-overlay').classList.remove('open'); }
function detectPreset(r) {
  const presets = getPresets();
  for (const p of presets) {
    if (p.start === r.start && p.end === r.end) return p.key;
  }
  return null;
}
function renderPicker() {
  // side presets
  const presets = getPresets();
  document.getElementById('picker-side').innerHTML = presets.map(p =>
    `<button class="preset-btn ${p.key===pickerDraft.preset?'active':''}" data-k="${p.key}">${p.label}</button>`
  ).join('');
  document.querySelectorAll('#picker-side .preset-btn').forEach(b => {
    b.onclick = () => {
      const p = presets.find(x => x.key===b.dataset.k);
      pickerDraft = {start: p.start, end: p.end, preset: p.key};
      // Move calendar to start of new range
      const sd = parseDate(p.start);
      pickerLeftMonth = {y: sd.getFullYear(), m: sd.getMonth()};
      renderPicker();
    };
  });
  // custom button (always available)
  document.getElementById('custom-btn').classList.toggle('active', pickerDraft.preset === null);
  // calendars (2 months)
  renderCalendars();
  document.getElementById('btn-apply').disabled = !(pickerDraft.start && pickerDraft.end);
}
function renderCalendars() {
  const left = pickerLeftMonth;
  const right = {y: left.m === 11 ? left.y+1 : left.y, m: (left.m+1) % 12};
  document.getElementById('cal-container').innerHTML = renderCal(left, true) + renderCal(right, false);
  attachCalHandlers();
}
function renderCal(mo, isLeft) {
  const first = new Date(mo.y, mo.m, 1);
  const startDow = (first.getDay() + 6) % 7; // Mon=0
  const daysInMonth = new Date(mo.y, mo.m+1, 0).getDate();
  const prevMonthDays = new Date(mo.y, mo.m, 0).getDate();
  let cells = [];
  for (let i = startDow-1; i >= 0; i--) {
    cells.push({day: prevMonthDays - i, out: true});
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({day: d, y: mo.y, m: mo.m, out: false});
  }
  const total = Math.ceil(cells.length / 7) * 7;
  while (cells.length < total) cells.push({day: cells.length - daysInMonth - startDow + 1, out: true});
  
  const monthLabel = `${String(mo.m+1).padStart(2,'0')} / ${mo.y+543}`;
  const navBtns = isLeft
    ? `<button class="cal-nav-btn" data-nav="-12">«</button><button class="cal-nav-btn" data-nav="-1">‹</button>`
    : `<button class="cal-nav-btn" data-nav="1">›</button><button class="cal-nav-btn" data-nav="12">»</button>`;
  const navL = isLeft ? navBtns.split('<button').slice(0,3).filter(Boolean).map(x=>'<button'+x).join('') : '';
  const navR = !isLeft ? navBtns : '';
  
  let html = `<div class="cal">
    <div class="cal-nav">
      ${isLeft ? `<div>${navBtns}</div>` : '<div></div>'}
      <div class="cal-nav-title">${monthLabel}</div>
      ${!isLeft ? `<div>${navBtns}</div>` : '<div></div>'}
    </div>
    <div class="cal-grid">
      ${THAI_DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}`;
  cells.forEach(c => {
    if (c.out) {
      html += `<div class="cal-day out">${c.day}</div>`;
    } else {
      const ds = dateToStr(new Date(c.y, c.m, c.day));
      const disabled = ds < RAW.date_min || ds > RAW.date_max;
      const isStart = pickerDraft.start === ds;
      const isEnd = pickerDraft.end === ds;
      const inRange = pickerDraft.start && pickerDraft.end && ds >= pickerDraft.start && ds <= pickerDraft.end;
      const isToday = ds === TODAY;
      let cls = 'cal-day';
      if (disabled) cls += ' disabled';
      if (inRange && !isStart && !isEnd) cls += ' range';
      if (isStart) cls += ' range-start';
      if (isEnd) cls += ' range-end';
      html += `<div class="${cls}" data-d="${ds}" ${disabled?'':''}>${c.day}${isToday ? '<br><span class="dot"></span>' : ''}</div>`;
    }
  });
  html += `</div></div>`;
  return html;
}
function attachCalHandlers() {
  document.querySelectorAll('.cal-nav-btn').forEach(b => {
    b.onclick = () => {
      const n = parseInt(b.dataset.nav);
      const nd = new Date(pickerLeftMonth.y, pickerLeftMonth.m + n, 1);
      pickerLeftMonth = {y: nd.getFullYear(), m: nd.getMonth()};
      renderCalendars();
    };
  });
  document.querySelectorAll('.cal-day').forEach(d => {
    if (d.classList.contains('out') || d.classList.contains('disabled')) return;
    d.onclick = () => {
      const ds = d.dataset.d;
      if (!pickerDraft.start || (pickerDraft.start && pickerDraft.end)) {
        pickerDraft = {start: ds, end: null, preset: null};
      } else {
        if (ds < pickerDraft.start) pickerDraft = {start: ds, end: pickerDraft.start, preset: null};
        else pickerDraft = {start: pickerDraft.start, end: ds, preset: null};
      }
      renderPicker();
    };
  });
}

  else cmpRange = {start: pickerDraft.start, end: pickerDraft.end};

document.getElementById('cmp-toggle').onchange = (e) => {
  if (e.target.checked) {
    document.getElementById('open-cmp-picker').style.display = '';
    // default cmp range = previous period of same length
    if (!cmpRange) {
      const len = Math.round((parseDate(currentRange.end) - parseDate(currentRange.start)) / 86400000);
      const prevEnd = addDays(currentRange.start, -1);
      const prevStart = addDays(prevEnd, -len);
      const clampedStart = clampStart(prevStart, RAW.date_min);
      // Check the clamped range is valid (start must be <= end and end must be in data range)
      if (clampedStart <= prevEnd && prevEnd >= RAW.date_min) {
        cmpRange = {start: clampedStart, end: prevEnd};
      } else {
        // Fallback: split available data range — use first half as comparison
        const totalDays = Math.round((parseDate(RAW.date_max) - parseDate(RAW.date_min)) / 86400000);
        const halfDays = Math.max(1, Math.floor(totalDays / 2));
        const fallbackEnd = addDays(RAW.date_min, halfDays - 1);
        const fallbackStart = RAW.date_min;
        cmpRange = {start: fallbackStart, end: fallbackEnd};
      }
    }
  } else {
    document.getElementById('open-cmp-picker').style.display = 'none';
    cmpRange = null;
  }
  render();
};

// ----- AGGREGATION -----
function aggregate(start, end) {
  // Guard: if range is invalid, return empty stats
  if (!start || !end || start > end) {
    return {kpi:{total_sales:0,real_sales:0,internal_sales:0,internal_breakdown:{},total_orders:0,aov:0,total_items:0,unique_products:0,total_shipping:0},channels:[],products:[],trend:[],top20_qty:[],by_channel_top20:{},chan_x_prod:[],shipping:[]};
  }
  const lines = RAW.lines.filter(l => l.d >= start && l.d <= end);

  // ── totals จาก lines ──────────────────────────────────────────────
  // แต่ละ line = 1 unique order (deduped จาก เลขที่ออเดอร์)
  const INTERNAL_CH = new Set(['Carcare', 'POS', 'สินค้าสำหรับทำการตลาด', 'เบิกของ']);
  const total_sales  = lines.reduce((s,l) => s + l.s, 0);
  const internal_breakdown = {};
  lines.forEach(l => {
    const ch = RAW.channels[l.c];
    if (INTERNAL_CH.has(ch)) internal_breakdown[ch] = (internal_breakdown[ch] || 0) + l.s;
  });
  const internal_sales = Object.values(internal_breakdown).reduce((s,v) => s+v, 0);
  const real_sales = total_sales - internal_sales;
  const total_items  = lines.reduce((s,l) => s + l.q, 0);
  const skus         = new Set(lines.map(l => l.p)).size;
  const total_orders   = new Set(lines.map(l => l.order_id)).size;
  const aov            = total_orders > 0 ? Math.round(total_sales / total_orders) : 0;
  const total_shipping = 0;

  // ── Channel breakdown (from lines) ───────────────────────────────
  const chMap = new Map();
  lines.forEach(l => {
    const cur = chMap.get(l.c) || {orderSet: new Set(), sales: 0};
    cur.orderSet.add(l.order_id); cur.sales += l.s;
    chMap.set(l.c, cur);
  });
  const channels = [...chMap.entries()].map(([cidx, v]) => ({
    ch: RAW.channels[cidx] || 'อื่นๆ', orders: v.orderSet.size, sales: v.sales,
    aov: v.orderSet.size ? v.sales / v.orderSet.size : 0
  })).sort((a,b) => b.sales - a.sales);

  // ── Products (qty / sales / avg price) ───────────────────────────
  const prMap = new Map();
  lines.forEach(l => {
    const cur = prMap.get(l.p) || {qty: 0, sales: 0};
    cur.qty += l.q; cur.sales += l.s;
    prMap.set(l.p, cur);
  });
  const products = [...prMap.entries()].map(([pidx, v]) => ({
    product: RAW.products[pidx] || '?', qty: v.qty, sales: v.sales,
    price: v.qty ? v.sales / v.qty : 0
  })).sort((a,b) => b.sales - a.sales);

  // ── Top 20 by qty ─────────────────────────────────────────────────
  const top20_qty = [...products].sort((a,b) => b.qty - a.qty).slice(0, 20);

  // ── Top 20 per channel ────────────────────────────────────────────
  const by_channel_top20 = {};
  const chProdMap = new Map();
  lines.forEach(l => {
    const key = l.c + '|' + l.p;
    const cur = chProdMap.get(key) || {qty: 0, sales: 0};
    cur.qty += l.q; cur.sales += l.s;
    chProdMap.set(key, cur);
  });
  channels.forEach(c => {
    const cidx = RAW.channels.indexOf(c.ch);
    const list = [];
    chProdMap.forEach((v, key) => {
      const [ci, pi] = key.split('|').map(Number);
      if (ci === cidx) list.push({product: RAW.products[pi] || '?', qty: v.qty, sales: v.sales});
    });
    by_channel_top20[c.ch] = list.sort((a,b) => b.qty - a.qty).slice(0, 20);
  });

  // ── Channel × Product ─────────────────────────────────────────────
  const top20p_idx = new Set(products.slice(0, 20).map(p => RAW.products.indexOf(p.product)));
  const cxpList = [];
  chProdMap.forEach((v, key) => {
    const [ci, pi] = key.split('|').map(Number);
    if (top20p_idx.has(pi)) cxpList.push({
      product: RAW.products[pi] || '?', ch: RAW.channels[ci] || 'อื่นๆ', qty: v.qty, sales: v.sales
    });
  });

  // ── Daily trend (from lines) ──────────────────────────────────────
  const dayMap = new Map();
  lines.forEach(l => {
    const cur = dayMap.get(l.d) || {sales: 0, orders: 0};
    cur.sales += l.s; cur.orders += l.q;  // orders = items sold per day
    dayMap.set(l.d, cur);
  });
  const trend = [...dayMap.entries()]
    .map(([d, v]) => ({date_str: d, sales: v.sales, orders: v.orders}))
    .sort((a,b) => a.date_str.localeCompare(b.date_str));

  // ── Shipping (ไม่มีข้อมูลใน RAW) ────────────────────────────────
  const shipping = [];

  return {
    kpi: {total_sales, real_sales, internal_sales, internal_breakdown, total_orders, total_items, aov, total_shipping, unique_products: skus},
    channels, products, top20_qty, by_channel_top20, chan_x_prod: cxpList, trend, shipping
  };
}

function destroyCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

// ----- RENDER -----
function delta(a, b) {
  if (b === undefined || b === null) return null;
  const diff = a - b;
  // b=0 means new item in current period → treat as +100% if a>0, else 0%
  const pct = b !== 0 ? (diff/b)*100 : (a > 0 ? 100 : 0);
  return {diff, pct, pos: diff >= 0};
}
function safeDeltaCell(d) {
  if (!d) return '<td class="num" style="color:var(--muted)">—</td>';
  return `<td class="num ${d.pos?'delta-pos':'delta-neg'}">${d.pos?'▲':'▼'} ${Math.abs(d.pct).toFixed(1)}%</td>`;
}
function deltaHtml(d, isPct=true, isMoney=false) {
  if (!d) return '';
  const arrow = d.pos ? '▲' : '▼';
  const cls = d.pos ? 'delta-pos' : 'delta-neg';
  const txt = isPct ? `${arrow} ${Math.abs(d.pct).toFixed(1)}%` : `${arrow} ${fmt(Math.abs(d.diff))}`;
  return `<div class="kpi-delta ${cls}">${txt} vs ช่วงก่อน</div>`;
}

      <div class="card"><h2>ช่องทางขาย — สัดส่วนยอดขาย</h2><div class="chart-box"><canvas id="ch-pie"></canvas></div></div>
      <div class="card"><h2>ช่องทางขาย — รายละเอียด${C ? ' (เปรียบเทียบ)' : ''}</h2>
        <div class="table-wrap"><table id="ch-table"><thead><tr><th>ช่องทาง</th><th class="num">ออเดอร์</th><th class="num">ยอดขาย</th><th class="num">AOV</th><th class="num">%</th>${C?'<th class="num">Δ ยอดขาย</th>':''}</tr></thead><tbody></tbody></table></div>
      </div>
    </div>

    <div class="card"><h2>Trend ยอดขายรายวัน${C ? ' (กับช่วงเปรียบเทียบ)' : ''}</h2><div class="chart-box tall"><canvas id="trend-chart"></canvas></div></div>

    <div class="card" style="margin-top:16px;"><h2>🔥 Top 20 สินค้าขายดี (จำนวนชิ้น) — รวมทุกแพลตฟอร์ม</h2>
      <div class="sub">เรียงจากจำนวนชิ้นที่ขายได้สูงสุดในช่วงเวลาที่เลือก</div>
      <div class="grid grid-2">
        <div class="chart-box xtall"><canvas id="top20-chart"></canvas></div>
        <div class="table-wrap" style="max-height:580px;">
          <table><thead><tr><th>#</th><th>สินค้า</th><th class="num">ชิ้น</th><th class="num">ยอดขาย</th>${C?'<th class="num">Δ %</th>':''}</tr></thead><tbody id="top20-tbody"></tbody></table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;"><h2>🏆 Top 20 สินค้าขายดี (จำนวนชิ้น) — แยกตามแพลตฟอร์ม</h2>
      <div class="sub">เลือกแพลตฟอร์มเพื่อดูสินค้าที่ขายดีที่สุดในช่องทางนั้น</div>
      <div class="channel-tabs" id="channel-tabs"></div>
      <div class="grid grid-2">
        <div class="chart-box xtall"><canvas id="ch-top20-chart"></canvas></div>
        <div class="table-wrap" style="max-height:580px;">
          <table><thead><tr><th>#</th><th>สินค้า</th><th class="num">ชิ้น</th><th class="num">ยอดขาย</th></tr></thead><tbody id="ch-top20-tbody"></tbody></table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;"><h2>🔀 ช่องทาง × สินค้า (เลือกสินค้า)</h2>
      <div class="controls"><select id="cxp-product"></select></div>
      <div class="grid grid-2">
        <div class="chart-box"><canvas id="cxp-chart"></canvas></div>
        <div class="table-wrap"><table id="cxp-table"><thead><tr><th>ช่องทาง</th><th class="num">จำนวน</th><th class="num">ยอดขาย</th><th class="num">%</th></tr></thead><tbody></tbody></table></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;"><h2>📋 รายการสินค้าทั้งหมด</h2>
      <div class="controls">
        <input type="text" id="prod-search" placeholder="ค้นหาสินค้า..." style="flex:1; min-width:160px;">
        <select id="prod-sort"><option value="sales">เรียง: ยอดขาย</option><option value="qty">เรียง: จำนวนชิ้น</option><option value="price">เรียง: ราคา</option></select>
      </div>
      <div class="table-wrap" style="max-height:480px;">
        <table id="prod-table"><thead><tr><th>สินค้า</th><th class="num">ชิ้น</th><th class="num">ยอดขาย</th><th class="num">ราคาเฉลี่ย</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
    <style>
      .rank-up   { color: #10b981; font-size: 0.75em; margin-left: 4px; white-space: nowrap; }
      .rank-down { color: #ef4444; font-size: 0.75em; margin-left: 4px; white-space: nowrap; }
      .rank-same { color: #94a3b8; font-size: 0.75em; margin-left: 4px; white-space: nowrap; }
      .rank-new  { color: #f59e0b; font-size: 0.75em; margin-left: 4px; white-space: nowrap; }
      .rank-gone { color: #94a3b8; font-size: 0.75em; margin-left: 4px; white-space: nowrap; }
      #prod-table.cmp-mode th.hide-cmp, #prod-table.cmp-mode td.hide-cmp { display: none; }
      #prod-table td.prod-p2 { color: var(--text); }
      #prod-table td.prod-p2 span.pname { font-weight: 500; }
    </style>

    <div class="card" style="margin-top:16px;"><h2>ขนส่ง</h2>
      <div class="grid grid-2">
        <div class="chart-box"><canvas id="ship-chart"></canvas></div>
        <div class="table-wrap"><table id="ship-table"><thead><tr><th>ขนส่ง</th><th class="num">ออเดอร์</th><th class="num">ยอดขาย</th></tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  `;

  // Channel pie
  const chTotal = D.channels.reduce((s,c) => s+c.sales, 0) || 1;
  charts.chPie = new Chart(document.getElementById('ch-pie'), {
    type: 'doughnut',
    data: {labels: D.channels.map(c => c.ch), datasets: [{data: D.channels.map(c => c.sales), backgroundColor: PALETTE}]},
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {position: 'right'},
      tooltip: {callbacks: {label: ctx => `${ctx.label}: ${fmtBaht(ctx.parsed)} (${(ctx.parsed/chTotal*100).toFixed(1)}%)`}}}}
  });
  // Channel table
  const cmpChMap = C ? new Map(C.channels.map(c => [c.ch, c.sales])) : null;
  document.querySelector('#ch-table tbody').innerHTML = D.channels.map(c => {
    const d = C ? delta(c.sales, cmpChMap.get(c.ch) || 0) : null;
    return `<tr><td><span class="chip">${c.ch}</span></td><td class="num">${fmt(c.orders)}</td>
      <td class="num">${fmtBaht(c.sales)}</td><td class="num">${fmtBaht(c.aov)}</td>
      <td class="num">${(c.sales/chTotal*100).toFixed(1)}%</td>
      ${C ? safeDeltaCell(d) : ''}</tr>`;
  }).join('');
  
  // Trend
  const t = D.trend;
  const datasets = [
    {label: `ยอดขาย (฿) — ${rangeLabel(currentRange.start, currentRange.end)}`, data: t.map(d => d.sales), borderColor:'#1A5CDB', backgroundColor:'rgba(99,102,241,0.1)', fill:true, tension:0.3, yAxisID:'y'},
  ];
  if (C) {
    // Align by day-offset from start
    const offsetMap = new Map();
    t.forEach(d => {
      const off = Math.round((parseDate(d.date_str) - parseDate(currentRange.start)) / 86400000);
      offsetMap.set(off, d.sales);
    });
    const cOffsetMap = new Map();
    C.trend.forEach(d => {
      const off = Math.round((parseDate(d.date_str) - parseDate(cmpRange.start)) / 86400000);
      cOffsetMap.set(off, d.sales);
    });
    const maxOff = Math.max(...[...offsetMap.keys(), ...cOffsetMap.keys()]);
    const labels = [];
    const main = [], cmp = [];
    for (let i = 0; i <= maxOff; i++) {
      labels.push(`Day ${i+1}`);
      main.push(offsetMap.get(i) || 0);
      cmp.push(cOffsetMap.get(i) || 0);
    }
    charts.trend = new Chart(document.getElementById('trend-chart'), {
      type: 'line',
      data: {labels, datasets: [
        {label: `ปัจจุบัน: ${rangeLabel(currentRange.start, currentRange.end)}`, data: main, borderColor:'#1A5CDB', backgroundColor:'rgba(99,102,241,0.1)', fill:true, tension:0.3},
        {label: `เปรียบเทียบ: ${rangeLabel(cmpRange.start, cmpRange.end)}`, data: cmp, borderColor:'#ec4899', borderDash:[6,4], tension:0.3},
      ]},
      options: {responsive: true, maintainAspectRatio: false, scales: {y: {beginAtZero: true, ticks: {callback: v => fmt(v)}}}}
    });
  } else {
    charts.trend = new Chart(document.getElementById('trend-chart'), {
      type: 'line',
      data: {labels: t.map(d => d.date_str), datasets: [
        {label: 'ยอดขาย (฿)', data: t.map(d => d.sales), borderColor:'#1A5CDB', backgroundColor:'rgba(99,102,241,0.1)', fill:true, tension:0.3, yAxisID:'y'},
        {label: 'ออเดอร์', data: t.map(d => d.orders), borderColor:'#ec4899', tension:0.3, yAxisID:'y1'},
      ]},
      options: {responsive: true, maintainAspectRatio: false,
        scales: {y: {beginAtZero: true, ticks: {callback: v => fmt(v)}, title: {display:true, text:'ยอดขาย'}},
                 y1: {beginAtZero: true, position: 'right', grid: {drawOnChartArea: false}, title: {display:true, text:'ออเดอร์'}}}}
    });
  }
  
  // Top 20 by qty (combined)
  const top20 = D.top20_qty;
  charts.top20 = new Chart(document.getElementById('top20-chart'), {
    type: 'bar',
    data: {labels: top20.map(p => p.product.length>28 ? p.product.slice(0,26)+'...' : p.product),
      datasets: [{label: 'จำนวนชิ้น', data: top20.map(p => p.qty), backgroundColor: '#1A5CDB'}]},
    options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display:false},
        tooltip: {callbacks: {title: ctx => top20[ctx[0].dataIndex].product, label: ctx => fmt(ctx.parsed.x)+' ชิ้น | '+fmtBaht(top20[ctx.dataIndex].sales)}}}}
  });
  const cmpProdMap = C ? new Map(C.products.map(p => [p.product, p.qty])) : null;
  const maxQ = Math.max(...top20.map(p => p.qty), 1);
  document.getElementById('top20-tbody').innerHTML = top20.map((p,i) => {
    const d = C ? delta(p.qty, cmpProdMap.get(p.product) || 0) : null;
    return `<tr><td class="rank">${i+1}</td><td>${p.product}</td>
      <td class="num bar-cell"><div class="bar-fill" style="width:${(p.qty/maxQ*60)}px"></div>${fmt(p.qty)}</td>
      <td class="num">${fmtBaht(p.sales)}</td>
      ${C ? safeDeltaCell(d) : ''}</tr>`;
  }).join('');
  
  // Top 20 per channel
  const channelsList = Object.keys(D.by_channel_top20).filter(c => D.by_channel_top20[c].length > 0);
  let activeCh = channelsList[0];
  const renderChTop = () => {
    document.getElementById('channel-tabs').innerHTML = channelsList.map(c =>
      `<div class="channel-tab ${c===activeCh?'active':''}" data-c="${c}">${c}</div>`).join('');
    document.querySelectorAll('#channel-tabs .channel-tab').forEach(el => {
      el.onclick = () => {activeCh = el.dataset.c; renderChTop();};
    });
    const data = D.by_channel_top20[activeCh] || [];
    if (charts.chTop20) charts.chTop20.destroy();
    charts.chTop20 = new Chart(document.getElementById('ch-top20-chart'), {
      type: 'bar',
      data: {labels: data.map(p => p.product.length>28 ? p.product.slice(0,26)+'...' : p.product),
        datasets: [{label: `จำนวนชิ้น (${activeCh})`, data: data.map(p => p.qty), backgroundColor: '#10b981'}]},
      options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {legend: {display:false},
          tooltip: {callbacks: {title: ctx => data[ctx[0].dataIndex].product, label: ctx => fmt(ctx.parsed.x)+' ชิ้น | '+fmtBaht(data[ctx.dataIndex].sales)}}}}
    });
    const mx = Math.max(...data.map(p => p.qty), 1);
    document.getElementById('ch-top20-tbody').innerHTML = data.map((p,i) => `
      <tr><td class="rank">${i+1}</td><td>${p.product}</td>
      <td class="num bar-cell"><div class="bar-fill" style="width:${(p.qty/mx*60)}px"></div>${fmt(p.qty)}</td>
      <td class="num">${fmtBaht(p.sales)}</td></tr>`).join('');
  };
  if (channelsList.length) renderChTop();
  
  // CXP picker
  const cxpProducts = [...new Set(D.chan_x_prod.map(x => x.product))];
  const cxpSel = document.getElementById('cxp-product');
  cxpSel.innerHTML = cxpProducts.map(p => `<option value="${p.replace(/"/g,'&quot;')}">${p}</option>`).join('');
  const renderCxp = () => {
    const p = cxpSel.value;
    const rows = D.chan_x_prod.filter(x => x.product === p).sort((a,b) => b.sales - a.sales);
    const tot = rows.reduce((s,r) => s + r.sales, 0) || 1;
    if (charts.cxp) charts.cxp.destroy();
    charts.cxp = new Chart(document.getElementById('cxp-chart'), {
      type: 'doughnut',
      data: {labels: rows.map(r => r.ch), datasets: [{data: rows.map(r => r.sales), backgroundColor: PALETTE}]},
      options: {responsive: true, maintainAspectRatio: false,
        plugins: {legend: {position: 'right'},
          tooltip: {callbacks: {label: ctx => `${ctx.label}: ${fmtBaht(ctx.parsed)} (${(ctx.parsed/tot*100).toFixed(1)}%)`}}}}
    });
    document.querySelector('#cxp-table tbody').innerHTML = rows.map(r => `
      <tr><td><span class="chip">${r.ch}</span></td><td class="num">${fmt(r.qty)}</td>
      <td class="num">${fmtBaht(r.sales)}</td><td class="num">${(r.sales/tot*100).toFixed(1)}%</td></tr>`).join('');
  };
  cxpSel.onchange = renderCxp;
  if (cxpProducts.length) renderCxp();
  
  // All products
  const renderProdTable = () => {
    const q = document.getElementById('prod-search').value.toLowerCase();
    const tbl = document.getElementById('prod-table');
    const thead = tbl.querySelector('thead tr');
    const tbody = tbl.querySelector('tbody');

    if (C) {
      // ── Comparison mode: side-by-side ranked by qty ──────────────────────
      tbl.classList.add('cmp-mode');

      // Build ranked lists (filter by search query, rank by qty)
      const p1List = D.products
        .filter(p => p.product.toLowerCase().includes(q))
        .sort((a, b) => (b.qty || 0) - (a.qty || 0));
      const p2List = C.products
        .filter(p => p.product.toLowerCase().includes(q))
        .sort((a, b) => (b.qty || 0) - (a.qty || 0));

      // Build lookup: product name → rank (1-based) in each list
      const p1RankMap = new Map(p1List.map((p, i) => [p.product, i + 1]));
      const p2RankMap = new Map(p2List.map((p, i) => [p.product, i + 1]));
      const p2QtyMap  = new Map(p2List.map(p => [p.product, p.qty]));

      // Rank-change badge for a P2 product
      const rankBadge = (p2name) => {
        const r2 = p2RankMap.get(p2name);
        const r1 = p1RankMap.get(p2name);
        if (!r1) return `<span class="rank-new">✦ สินค้าใหม่</span>`;
        const diff = r1 - r2; // positive = moved up (lower rank number = better)
        if (diff > 0)  return `<span class="rank-up">▲ ขึ้นจากอันดับ ${r1}</span>`;
        if (diff < 0)  return `<span class="rank-down">▼ ลงจากอันดับ ${r1}</span>`;
        return `<span class="rank-same">— อันดับเดิม</span>`;
      };

      // Rows: use length of longer list
      const rowCount = Math.max(p1List.length, p2List.length);

      // Update header
      const p1Label = rangeLabel(currentRange.start, currentRange.end);
      const p2Label = rangeLabel(cmpRange.start, cmpRange.end);
      thead.innerHTML = `
        <th>สินค้า — ช่วง 1<br><small style="font-weight:400;color:var(--muted)">${p1Label}</small></th>
        <th>สินค้า — ช่วง 2<br><small style="font-weight:400;color:var(--muted)">${p2Label}</small></th>
        <th class="num">ชิ้น (ช่วง 1)</th>
        <th class="num">ชิ้น (ช่วง 2)</th>`;

      tbody.innerHTML = Array.from({length: rowCount}, (_, i) => {
        const p1 = p1List[i];
        const p2 = p2List[i];
        const p1Cell = p1
          ? `<td><span style="color:var(--muted);margin-right:6px;font-size:0.8em">${i+1}.</span>${p1.product}</td>`
          : `<td style="color:var(--muted)">—</td>`;
        const p2Cell = p2
          ? `<td class="prod-p2"><span style="color:var(--muted);margin-right:6px;font-size:0.8em">${i+1}.</span><span class="pname">${p2.product}</span>${rankBadge(p2.product)}</td>`
          : `<td style="color:var(--muted)">—</td>`;
        const q1Cell = p1 ? `<td class="num">${fmt(p1.qty)}</td>` : `<td class="num" style="color:var(--muted)">—</td>`;
        const q2Cell = p2 ? `<td class="num">${fmt(p2.qty)}</td>` : `<td class="num" style="color:var(--muted)">—</td>`;
        return `<tr>${p1Cell}${p2Cell}${q1Cell}${q2Cell}</tr>`;
      }).join('');

    } else {
      // ── Normal mode ────────────────────────────────────────────────────────
      tbl.classList.remove('cmp-mode');
      const sort = document.getElementById('prod-sort').value;
      const filtered = D.products.filter(p => p.product.toLowerCase().includes(q))
        .sort((a, b) => (b[sort] || 0) - (a[sort] || 0));
      const mx = Math.max(...filtered.map(p => p.sales), 1);

      thead.innerHTML = `<th>สินค้า</th><th class="num">ชิ้น</th><th class="num">ยอดขาย</th><th class="num">ราคาเฉลี่ย</th>`;
      tbody.innerHTML = filtered.map(p => `
        <tr><td>${p.product}</td><td class="num">${fmt(p.qty)}</td>
        <td class="num bar-cell"><div class="bar-fill" style="width:${(p.sales / mx * 60)}px"></div>${fmtBaht(p.sales)}</td>
        <td class="num">${fmtBaht(p.price)}</td></tr>`).join('');
    }
  };
  document.getElementById('prod-search').oninput = renderProdTable;
  document.getElementById('prod-sort').onchange = renderProdTable;
  renderProdTable();
  
  // Shipping
  charts.ship = new Chart(document.getElementById('ship-chart'), {
    type: 'bar',
    data: {labels: D.shipping.map(s => s.carrier || 'ไม่ระบุ'),
      datasets: [{label: 'ออเดอร์', data: D.shipping.map(s => s.orders), backgroundColor: '#10b981'}]},
    options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: {legend: {display:false}}}
  });
  const shTotal = D.shipping.reduce((s,x) => s + x.orders, 0) || 1;
  document.querySelector('#ship-table tbody').innerHTML = D.shipping.map(s => `
    <tr><td>${s.carrier || 'ไม่ระบุ'}</td><td class="num">${fmt(s.orders)} (${(s.orders/shTotal*100).toFixed(1)}%)</td>
    <td class="num">${fmtBaht(s.sales)}</td></tr>`).join('');
}

// Initialize: default to "ทั้งหมด"
currentRange = {start: RAW.date_min, end: RAW.date_max};
render();
</script>
</body>
</html>
